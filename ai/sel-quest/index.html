<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WEND - Inclusive Word Finder & Riddles</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        /* Smart Orientation & Fullscreen Overlay Warning */
        #orientation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            z-index: 99999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Baloo 2', cursive, sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        @keyframes wf-rotate-phone {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(90deg) scale(1.15);
            }

            100% {
                transform: rotate(0deg) scale(1);
            }
        }

        .wf-rotate-icon-wrap {
            font-size: 64px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: wf-rotate-phone 2s ease-in-out infinite;
        }

        .wf-static-icon-wrap {
            font-size: 64px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: none;
        }

        .wf-dom {
            position: absolute;
            box-sizing: border-box;
        }

        .wf-dom,
        .wf-dom * {
            font-family: 'Baloo 2', 'Fredoka', cursive, sans-serif;
            box-sizing: border-box;
            /* Enable smooth touch scrolling on touch devices */
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        @keyframes wf-pop-in {
            0% {
                transform: scale(.4) rotate(-6deg);
                opacity: 0;
            }

            65% {
                transform: scale(1.08) rotate(2deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .wf-pop-in {
            animation: wf-pop-in .38s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        @keyframes wf-shine {

            0%,
            55% {
                left: -60%;
            }

            100% {
                left: 130%;
            }
        }

        .wf-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            border: 4px solid #ffffff;
            border-radius: 999px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 28px;
            font-weight: 800;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: transform .09s ease, box-shadow .09s ease;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.22);
            font-size: calc(var(--base-btn-size, 32px) + 6px);
        }

        .wf-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.6);
            box-shadow: none;
            transform: none !important;
        }

        .wf-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .65), transparent);
            transform: skewX(-18deg);
            animation: wf-shine 2.8s ease-in-out infinite;
        }

        .wf-btn:hover:not(:disabled) {
            filter: brightness(1.08);
            transform: translateY(-3px) scale(1.02);
        }

        .wf-btn:active:not(:disabled) {
            transform: translateY(4px) scale(.96);
            filter: brightness(.95);
        }

        .wf-btn .wf-btn-icon {
            width: 1.4em;
            height: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .wf-card {
            border-radius: 36px;
            cursor: pointer;
            transition: transform .18s cubic-bezier(.34, 1.56, .64, 1);
        }

        .wf-card:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .wf-card.wf-static {
            cursor: default;
        }

        .wf-card.wf-static:hover {
            transform: none;
        }

        .wf-age-card {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: relative;
            overflow: hidden;
            border-radius: 32px;
        }

        .wf-age-card-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .wf-age-card-icon-box {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.18);
            border: 4px solid #ffffff;
            flex-shrink: 0;
        }

        .wf-age-card-title {
            font-size: 38px;
            font-weight: 800;
            line-height: 1.1;
            color: #fff;
        }

        .wf-age-card-sub {
            font-size: 22px;
            font-weight: 600;
            color: #f8fafc;
            opacity: .9;
            margin-top: 4px;
        }

        .wf-age-card-badge {
            padding: 10px 24px;
            border-radius: 999px;
            font-size: 20px;
            font-weight: 800;
            border: 3px solid #ffffff;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .wf-mode-card {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 28px;
            position: relative;
            overflow: hidden;
            border-radius: 36px;
            text-align: center;
        }

        .wf-mode-icon-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
            margin-bottom: 12px;
        }

        .wf-mode-title {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
        }

        .wf-mode-desc {
            font-size: 24px;
            font-weight: 600;
            color: #f8fafc;
            opacity: 0.95;
            margin-top: 6px;
        }

        .wf-mode-pill {
            margin-top: 16px;
            padding: 10px 32px;
            border-radius: 999px;
            font-size: 22px;
            font-weight: 800;
            border: 3px solid #ffffff;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
            background: #ffffff;
            color: #1e293b;
        }

        .wf-word-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            max-height: 250px;
            overflow-y: auto;
            padding: 4px;
        }

        .wf-word-row {
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 999px;
            padding: 6px 22px;
            height: 60px;
            font-weight: 800;
            border: 3px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.1);
            transition: all .25s ease;
        }

        .wf-word-row .wf-word-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .wf-word-row .wf-word-text {
            font-size: 28px;
            letter-spacing: 1px;
        }

        .wf-word-row .wf-word-check {
            width: 28px;
            height: 28px;
            display: flex;
            opacity: 0;
            transform: scale(.4);
            transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
        }

        .wf-word-row.wf-found {
            background: #22c55e !important;
            color: #ffffff !important;
            border-color: #ffffff !important;
        }

        .wf-word-row.wf-found .wf-word-text {
            text-decoration: line-through;
            color: #ffffff !important;
        }

        .wf-word-row.wf-found .wf-word-check {
            opacity: 1;
            transform: scale(1);
            color: #ffffff !important;
        }

        .wf-powerup-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-top: 10px;
        }

        .wf-powerup-btn {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 28px;
            background: linear-gradient(180deg, #38bdf8, #0284c7);
            border: 4px solid #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
            transition: transform .1s ease;
        }

        .wf-powerup-btn:active {
            transform: translateY(4px) scale(0.95);
        }

        .wf-powerup-btn.wf-highlight {
            animation: wf-pulse 1s infinite alternate;
            border-color: #facc15 !important;
        }

        @keyframes wf-pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0px #facc15;
            }

            100% {
                transform: scale(1.12);
                box-shadow: 0 0 25px #facc15;
            }
        }

        .wf-powerup-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            border-radius: 999px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffffff;
        }

        .wf-powerup-label {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 2px;
        }

        .wf-setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 22px;
            background: #253356;
            border: 3px solid #475b8a;
            border-radius: 22px;
            margin-bottom: 12px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
        }

        .wf-setting-label {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
        }

        .wf-toggle {
            padding: 8px 26px;
            border-radius: 999px;
            font-size: 22px;
            font-weight: 800;
            border: 3px solid #ffffff;
            cursor: pointer;
        }

        .wf-tts-btn {
            background: #facc15;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            color: #1e3a8a;
        }

        .wf-grid-btn {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            border: 4px solid #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
            transition: transform .12s ease;
            padding: 6px;
        }

        .wf-grid-btn.wf-locked {
            background: linear-gradient(180deg, #334155, #1e293b);
            opacity: 0.6;
            cursor: not-allowed;
        }

        .wf-grid-btn:hover:not(.wf-locked) {
            transform: translateY(-4px) scale(1.05);
            filter: brightness(1.1);
        }

        .wf-grid-btn:active:not(.wf-locked) {
            transform: translateY(2px) scale(0.95);
        }

        .wf-grid-btn-num {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .wf-grid-btn-stars {
            display: flex;
            gap: 2px;
            margin-top: 4px;
        }

        .wf-diff-tab {
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 20px;
            font-weight: 800;
            border: 3px solid #ffffff;
            cursor: pointer;
            background: #253356;
            color: #94a3b8;
            transition: all .15s ease;
        }

        .wf-diff-tab.active {
            background: #facc15;
            color: #1e3a8a;
            border-color: #ffffff;
        }

        .wf-help-card {
            display: flex;
            gap: 16px;
            align-items: center;
            width: 100%;
            background: #253356;
            border: 3px solid #475b8a;
            border-radius: 24px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }

        .wf-help-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        }

        .wf-help-title {
            font-size: 28px;
            font-weight: 800;
            color: #facc15;
            line-height: 1.1;
        }

        .wf-help-desc {
            font-size: 20px;
            font-weight: 600;
            color: #f8fafc;
            opacity: 0.95;
            margin-top: 4px;
        }

        .wf-confetti {
            position: absolute;
            top: 0;
            border-radius: 4px;
            animation: wf-confetti-fall linear forwards;
            pointer-events: none;
        }

        @keyframes wf-confetti-fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(640px) rotate(540deg);
                opacity: 0;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>
    <!-- Dynamic State-Driven Smart Overlay (Hidden initially until loading completes) -->
    <div id="orientation-overlay" style="display: none;">
        <div id="overlay-icon-container" class="wf-rotate-icon-wrap">
            <i data-lucide="smartphone-nfc" style="width: 64px; height: 64px; stroke: #facc15;"></i>
        </div>
        <h2 id="overlay-title" style="font-size: 36px; margin: 0 0 10px 0; color: #facc15;">Please Rotate Your Device
        </h2>
        <p id="overlay-desc"
            style="font-size: 20px; max-width: 420px; color: #cbd5e1; line-height: 1.4; margin-bottom: 24px;">This game
            is
            designed to be played in portrait mode.</p>
        <button id="fullscreen-overlay-btn" class="wf-btn"
            style="width: 320px; height: 75px; background: linear-gradient(180deg, #fde047, #eab308); font-size: 30px; color: #1e3a8a; border: 4px solid #ffffff;">
            <span id="overlay-btn-text">OK</span>
        </button>
    </div>

    <div id="game-container"></div>

    <script>
        "use strict";

        const W = 1080;
        const H = 1920;
        const MODE = { CLASSIC: "classic", QUIZ: "quiz" };
        const BLOCK_TILE = "■";
        const AGE = { UNDER_8: "under8", EIGHT_TO_12: "eightTo12", TEENS: "teens", ADULTS: "adults" };

        const DIRS = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
        let JSON_DATA = null;
        let isGameLoaded = false; // Tracks whether the loading screen has finished
        let isGamePausedByOverlay = false; // Tracks whether the game was paused due to orientation/fullscreen overlay warning

        let seed = 1;
        function seededRandom() {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }
        function seededRnd(a, b) { return Math.floor(seededRandom() * (b - a + 1)) + a; }
        function seededChoice(arr) { return arr[Math.floor(seededRandom() * arr.length)]; }
        function seededShuffle(arr) {
            arr = [...arr];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(seededRandom() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function checkFullscreenSupport() {
            const docEl = document.documentElement;
            return !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
        }

        function isFullscreenActive() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function isPortraitActive() {
            return window.innerHeight >= window.innerWidth;
        }

        function isIOSDevice() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            return /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        }

        function isMobileDevice() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            return /android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua.toLowerCase());
        }

        function updateSmartOverlay() {
            const overlay = document.getElementById("orientation-overlay");
            const titleEl = document.getElementById("overlay-title");
            const descEl = document.getElementById("overlay-desc");
            const btnEl = document.getElementById("fullscreen-overlay-btn");
            const iconContainer = document.getElementById("overlay-icon-container");

            if (!overlay) return;

            // Do not show the overlay until loading is finished, and bypass completely if not on a mobile device
            if (!isGameLoaded || !isMobileDevice()) {
                overlay.style.display = "none";
                if (isGamePausedByOverlay) {
                    isGamePausedByOverlay = false;
                    if (window.currentGameSceneInstance) {
                        window.currentGameSceneInstance.resumeFromOverlayPause();
                    }
                }
                return;
            }

            const portrait = isPortraitActive();
            const fsSupported = checkFullscreenSupport();
            const inFullscreen = isFullscreenActive();
            const isIOS = isIOSDevice();

            // On iOS devices, Fullscreen API support is restricted/unavailable, so bypass fullscreen prompt when unnecessary
            if (portrait && (isIOS || !fsSupported || inFullscreen)) {
                overlay.style.display = "none";
                if (isGamePausedByOverlay) {
                    isGamePausedByOverlay = false;
                    if (window.currentGameSceneInstance) {
                        window.currentGameSceneInstance.resumeFromOverlayPause();
                    }
                }
                return;
            }

            if (portrait && fsSupported && !inFullscreen && isIOS) {
                overlay.style.display = "none";
                if (isGamePausedByOverlay) {
                    isGamePausedByOverlay = false;
                    if (window.currentGameSceneInstance) {
                        window.currentGameSceneInstance.resumeFromOverlayPause();
                    }
                }
                return;
            }

            let needsOverlay = false;

            if (!portrait) {
                titleEl.textContent = "Please Rotate Your Device";
                iconContainer.className = "wf-rotate-icon-wrap";
                iconContainer.innerHTML = '<i data-lucide="smartphone-nfc" style="width: 64px; height: 64px; stroke: #facc15;"></i>';
                if (fsSupported && !inFullscreen && !isIOS) {
                    descEl.textContent = "This game requires portrait mode and fullscreen view. Click OK below to adjust!";
                    btnEl.style.display = "flex";
                } else {
                    descEl.textContent = "This game is designed to be played in portrait mode. Please turn your device upright.";
                    btnEl.style.display = "none";
                }
                needsOverlay = true;
            } else if (fsSupported && !inFullscreen && !isIOS) {
                titleEl.textContent = "Fullscreen Mode Required";
                iconContainer.className = "wf-static-icon-wrap";
                iconContainer.innerHTML = '<i data-lucide="maximize" style="width: 64px; height: 64px; stroke: #facc15;"></i>';
                descEl.textContent = "Click OK below to enter Fullscreen mode and start playing!";
                btnEl.style.display = "flex";
                needsOverlay = true;
            } else {
                overlay.style.display = "none";
                if (isGamePausedByOverlay) {
                    isGamePausedByOverlay = false;
                    if (window.currentGameSceneInstance) {
                        window.currentGameSceneInstance.resumeFromOverlayPause();
                    }
                }
            }

            if (needsOverlay) {
                overlay.style.display = "flex";
                if (!isGamePausedByOverlay) {
                    isGamePausedByOverlay = true;
                    if (window.currentGameSceneInstance) {
                        window.currentGameSceneInstance.triggerOverlayPause();
                    }
                }
            }

            if (window.lucide) window.lucide.createIcons();
        }

        function requestFullscreenAndLock() {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => { });
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }

            if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
                window.screen.orientation.lock('portrait').catch(() => { });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) window.lucide.createIcons();

            const overlayBtn = document.getElementById("fullscreen-overlay-btn");
            if (overlayBtn) {
                overlayBtn.addEventListener("click", () => {
                    requestFullscreenAndLock();
                    setTimeout(updateSmartOverlay, 150);
                });
            }

            window.addEventListener("resize", updateSmartOverlay);
            window.addEventListener("orientationchange", updateSmartOverlay);
            document.addEventListener("fullscreenchange", updateSmartOverlay);
            document.addEventListener("webkitfullscreenchange", updateSmartOverlay);

            updateSmartOverlay();
        });

        const State = {
            age: localStorage.getItem('wend_age_group') || AGE.UNDER_8,
            difficulty: parseInt(localStorage.getItem('wend_difficulty') || "1", 10),
            mode: MODE.CLASSIC,
            hasChosenMode: localStorage.getItem('wend_has_chosen_mode') === 'true',
            hasSeenTutorial: localStorage.getItem('wend_has_seen_tutorial') === 'true',
            found: 0, streak: 0, lastFoundTime: 0, comboMultiplier: 1,
            usedPowerupThisLevel: false,
            timerFrozen: false,

            powerups: {
                magnet: parseInt(localStorage.getItem('wend_pw_magnet') || "2", 10),
                freeze: parseInt(localStorage.getItem('wend_pw_freeze') || "2", 10),
                reveal: parseInt(localStorage.getItem('wend_pw_reveal') || "3", 10),
                shuffle: parseInt(localStorage.getItem('wend_pw_shuffle') || "2", 10)
            },

            sfx: localStorage.getItem('wend_sfx') !== 'false',
            bgm: localStorage.getItem('wend_bgm') !== 'false',
            tapToSelect: localStorage.getItem('wend_tap_select') === 'true',
            colorblindMode: localStorage.getItem('wend_colorblind') === 'true',
            highContrast: localStorage.getItem('wend_high_contrast') === 'true',
            quietMode: localStorage.getItem('wend_quiet_mode') === 'true',

        function generateShapeBlocks(grid, p) {
            const shapeKey = seededChoice(["U", "L", "C", "E", "F", "S", "Z"]);
            let shapeCoords = WALL_SHAPES[shapeKey];
            const rotation = seededRnd(0, 3);
            for (let r = 0; r < rotation; r++) shapeCoords = shapeCoords.map(([x, y]) => [2 - y, x]);
            if (seededRnd(0, 1) === 1) shapeCoords = shapeCoords.map(([x, y]) => [2 - x, y]);
            if (seededRnd(0, 1) === 1) shapeCoords = shapeCoords.map(([x, y]) => [x, 2 - y]);

            const maxOffsetR = p.rows - 3, maxOffsetC = p.cols - 3;
            if (maxOffsetR < 0 || maxOffsetC < 0) return;
            const offsetR = seededRnd(0, maxOffsetR), offsetC = seededRnd(0, maxOffsetC);

            let placedCount = 0;
            for (let [dx, dy] of shapeCoords) {
                const r = offsetR + dy, c = offsetC + dx;
                if (r < p.rows && c < p.cols && grid[r][c] === null) {
                    grid[r][c] = BLOCK_TILE; placedCount++;
                    if (placedCount >= p.blocks) break;
                }
            }
            while (placedCount < p.blocks) {
                const br = seededRnd(0, p.rows - 1), bc = seededRnd(0, p.cols - 1);
                if (grid[br][bc] === null) { grid[br][bc] = BLOCK_TILE; placedCount++; }
            }
        }

        function placeSnakingWord(grid, p, word) {
            for (let attempt = 0; attempt < 300; attempt++) {
                const startR = seededRnd(0, p.rows - 1), startC = seededRnd(0, p.cols - 1);
                if (grid[startR][startC] !== null) continue;

                const path = [[startC, startR]];
                let currentR = startR, currentC = startC, success = true;

                for (let i = 1; i < word.length; i++) {
                    const neighbors = seededShuffle(DIRS).map(d => ({ r: currentR + d.dy, c: currentC + d.dx }))
                        .filter(n => n.r >= 0 && n.r < p.rows && n.c >= 0 && n.c < p.cols && grid[n.r][n.c] === null && !path.some(pt => pt[0] === n.c && pt[1] === n.r));

                    if (neighbors.length === 0) { success = false; break; }
                    const next = neighbors[0];
                    path.push([next.c, next.r]);
                    currentR = next.r; currentC = next.c;
                }

                if (success && path.length === word.length) {
                    path.forEach(([cc, cr], idx) => grid[cr][cc] = word[idx]);
                    return path;
                }
            }
            return null;
        }

        function generateLevel(age, level, mode, difficulty) {
            let ageOffset = 1;
            if (age === AGE.EIGHT_TO_12) ageOffset = 2;
            if (age === AGE.TEENS) ageOffset = 3;
            if (age === AGE.ADULTS) ageOffset = 4;

            seed = (level * 10007) + (difficulty * 1337) + (ageOffset * 503) + (mode.length * 97);

            const p = JSON_DATA.difficulties[difficulty.toString()] || JSON_DATA.difficulties["1"];
            const pool = JSON_DATA.wordPools[age] || JSON_DATA.wordPools.under8;

            let subPoolKeys = ["EASY"];
            if (difficulty >= 3) subPoolKeys.push("MEDIUM");
            if (difficulty >= 4) subPoolKeys.push("HARD");

            let combinedWords = [];
            subPoolKeys.forEach(key => {
                if (pool[key]) combinedWords = combinedWords.concat(pool[key]);
            });

            const uniquePool = [];
            const seenWords = new Set();
            combinedWords.forEach(item => {
                if (!seenWords.has(item.word)) {
                    seenWords.add(item.word);
                    uniquePool.push(item);
                }
            });

            let forced = null, quiz = null;
            if (mode === MODE.QUIZ) {
                const validQuizzes = JSON_DATA.quizzes.filter(q => q.minDiff <= difficulty);
                quiz = seededChoice(validQuizzes.length > 0 ? validQuizzes : JSON_DATA.quizzes);
                forced = { word: quiz.answer, category: "QUIZ", icon: quiz.icon, isQuizWord: true };
            }

            const shuffledPool = seededShuffle(uniquePool);
            const targetCount = p.words - (forced ? 1 : 0);

            const chosen = (forced ? [forced] : []).concat(
                shuffledPool.filter(w => !forced || w.word !== forced.word).slice(0, targetCount)
            );

            const grid = Array.from({ length: p.rows }, () => Array(p.cols).fill(null));

            generateShapeBlocks(grid, p);

            const placements = [];
            for (let item of chosen) {
                const path = placeSnakingWord(grid, p, item.word);
                if (path) placements.push({ ...item, path });
            }

            for (let r = 0; r < p.rows; r++) {
                for (let c = 0; c < p.cols; c++) {
                    if (!grid[r][c]) grid[r][c] = String.fromCharCode(65 + seededRnd(0, 25));
                }
            }

            return { profile: p, grid, placements, mode, quiz };
        }

            openHistoryTracker() {
                const history = State.getLevelHistory();
                let selectedDiff = State.difficulty;

                const renderGrid = (diff) => {
                    const levelMap = {};

                    history.forEach(h => {
                        if (h.diffNum === diff) {
                            if (!levelMap[h.level] || h.stars > levelMap[h.level]) {
                                levelMap[h.level] = h.stars;
                            }
                        }
                    });

                    let gridHTML = "";
                    const maxHistoryLevel = Math.max(...history.filter(h => h.diffNum === diff).map(h => h.level), 0);
                    const currentProgressLevel = (selectedDiff === State.difficulty) ? State.level : 1;
                    const totalLevelsToShow = Math.max(20, maxHistoryLevel + 1, currentProgressLevel);

                    for (let l = 1; l <= totalLevelsToShow; l++) {
                        const stars = levelMap[l] || 0;
                        const isAttempted = levelMap[l] !== undefined;
                        const isUnlocked = (l === 1) || isAttempted || (l <= maxHistoryLevel + 1);

                        const starsHTML = Array.from({ length: 3 }, (_, i) =>
                            miniIconHTML(i < stars ? "star" : "star-off", 16, i < stars ? "#facc15" : "rgba(255,255,255,0.4)")
                        ).join("");

                        if (isUnlocked) {
                            gridHTML += `
                <div class="wf-grid-btn" data-level="${l}">
                  <span class="wf-grid-btn-num">${l}</span>
                  <div class="wf-grid-btn-stars">${starsHTML}</div>
                </div>`;
                        } else {
                            gridHTML += `
                <div class="wf-grid-btn wf-locked" data-level="${l}">
                  <span class="wf-grid-btn-num">${miniIconHTML("lock", 20, "#94a3b8")}</span>
                  <div class="wf-grid-btn-stars">${starsHTML}</div>
                </div>`;
                        }
                    }

                    return gridHTML;
                };

                const renderTabs = () => {
                    return [1, 2, 3, 4, 5].map(d => {
                        const unlocked = State.isDiffUnlocked(d);
                        const active = d === selectedDiff ? "active" : "";
                        const diffName = (JSON_DATA.difficulties[d.toString()] || {}).name || `D${d}`;
                        return `
              <button class="wf-diff-tab ${active}" data-diff="${d}" ${unlocked ? "" : "disabled"}>
                ${unlocked ? diffName : "🔒 " + diffName}
              </button>`;
                    }).join("");
                };

                const modalHTML = `
          <div style="width:100%; display:flex; flex-direction:column; align-items:center; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding-right:4px;">
            <div style="font-size:40px; font-weight:800; color:#fff; margin-bottom:8px;">LEVEL SELECT & HISTORY</div>
            <div style="font-size:22px; color:#cbd5e1; margin-bottom:14px;">Select difficulty & jump directly into attempted levels</div>
            
            <div id="diff-tabs" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px; flex-shrink:0;">

            </div>

          </div>`;

                const modal = this.openHtmlModal(920, 920, modalHTML, { depth: 200, bg: "#1e2942", border: "#475569", padding: 28 });

                const attachGridListeners = () => {

            startAssistedTutorial() {
                this.isTutorialRunning = true;
                State.timerFrozen = true;

                if (this.levelData.placements.length < 2) return;
                const firstPlacement = this.levelData.placements[0];
                const secondPlacement = this.levelData.placements[1];

                const tooltip1 = this.add.text(W / 2, 400, "WATCH: HOW TO FIND WORDS!", {
                    fontFamily: theme().font, fontSize: "28px", fontStyle: "bold", color: "#ffffff",
                    backgroundColor: "#3b82f6", padding: { x: 20, y: 12 }, align: "center"
                }).setOrigin(0.5).setDepth(110);

                const firstPathPoints = firstPlacement.path.map(([c, r]) => ({
                    x: this.cells[r][c].cx,
                    y: this.cells[r][c].cy
                }));

                const handW = 70, handH = 70;
                const startPt = firstPathPoints[0];

                const handHtml = `<div style="width:${handW}px;height:${handH}px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.3));pointer-events:none;">${miniIconHTML("pointer", 52, "#ffffff")}</div>`;

                const handDom = this.add.dom(startPt.x - handW / 2, startPt.y - handH / 2).createFromHTML(handHtml).setOrigin(0, 0).setDepth(120);
                refreshIcons();

                let idx1 = 0;
                const animateFirstWord = () => {
                    if (idx1 < firstPathPoints.length) {
                        const pt = firstPathPoints[idx1];
                        const cell = firstPlacement.path[idx1];
                        this.addCell(cell[0], cell[1]);

                        this.tweens.add({
                            targets: handDom, x: pt.x - handW / 2, y: pt.y - handH / 2, duration: 500, ease: "Power1.easeInOut",
                            onComplete: () => { idx1++; animateFirstWord(); }
                        });
                    } else {
                        this.finishSelection();
                        tooltip1.destroy();

                        const tooltip2 = this.add.text(W / 2, 400, "WATCH PATH & DRAG TO SOLVE!", {
                            fontFamily: theme().font, fontSize: "26px", fontStyle: "bold", color: "#ffffff",
                            backgroundColor: "#22c55e", padding: { x: 20, y: 12 }, align: "center"
                        }).setOrigin(0.5).setDepth(110);

                        const secondPathPoints = secondPlacement.path.map(([c, r]) => ({
                            x: this.cells[r][c].cx,
                            y: this.cells[r][c].cy
                        }));

                        let isLooping = true;
                        let currentTween = null;

                        const runLoopAnimation = () => {
                            if (!isLooping) return;
                            handDom.setPosition(secondPathPoints[0].x - handW / 2, secondPathPoints[0].y - handH / 2);

                            let step = 0;
                            const nextStep = () => {
                                if (!isLooping) return;
                                if (step < secondPathPoints.length) {
                                    const pt = secondPathPoints[step];
                                    currentTween = this.tweens.add({
                                        targets: handDom, x: pt.x - handW / 2, y: pt.y - handH / 2, duration: 450, ease: "Power1.easeInOut",
                                        onComplete: () => { step++; nextStep(); }
                                    });
                                } else {
                                    currentTween = this.time.delayedCall(700, () => {
                                        if (isLooping) runLoopAnimation();
                                    });
                                }
                            };
                            nextStep();
                        };

                        runLoopAnimation();

                        this.tutorialLoopActive = true;
                        this.tutorialHandDomRef = handDom;
                        this.tutorialTooltipRef = tooltip2;
                        this.cancelTutorialLoop = () => {
                            isLooping = false;
                            if (currentTween) {
                                if (typeof currentTween.stop === 'function') currentTween.stop();
                                if (currentTween.remove) currentTween.remove();
                            }
                            this.tweens.killTweensOf(handDom);
                            handDom.destroy();
                            tooltip2.destroy();
                            State.timerFrozen = false;
                            State.hasSeenTutorial = true;
                            localStorage.setItem('wend_has_seen_tutorial', 'true');
                            this.isTutorialRunning = false;
                            this.tutorialLoopActive = false;
                        };
                    }
                };

                animateFirstWord();
            }

                    loop: true

            drawBoard() {
                const d = this.levelData, p = d.profile, t = theme();
                const maxW = 920;
                this.cellSize = Math.floor(maxW / p.cols);
                const bw = this.cellSize * p.cols, bh = this.cellSize * p.rows;

                this.boardX = (W - bw) / 2; this.boardY = 220 + (maxW - bh) / 2;
                this.boardBg = this.add.rectangle(this.boardX + bw / 2, this.boardY + bh / 2, bw + 28, bh + 28, t.panel, 0.95).setStrokeStyle(8, t.line);

                this.cells = Array.from({ length: p.rows }, () => Array(p.cols));

                for (let r = 0; r < p.rows; r++) {
                    for (let c = 0; c < p.cols; c++) {

            useMagnetPowerup() {
                const unfound = this.levelData.placements.filter(pl => !this.foundSet.has(pl.word));

            useRevealPowerup() {

            useShufflePowerup() {
                const p = this.levelData.profile;
                const targetCoords = new Set();
                this.levelData.placements.forEach(pl => {
                    pl.path.forEach(([c, r]) => targetCoords.add(`${c},${r}`));
                });

                for (let r = 0; r < p.rows; r++) {
                    for (let c = 0; c < p.cols; c++) {
                        const cell = this.cells[r][c];
                        if (!cell.isBlock && !targetCoords.has(`${c},${r}`)) {
                            cell.letter = String.fromCharCode(65 + seededRnd(0, 25));
                            cell.tx.setText(cell.letter);
                            this.tweens.add({ targets: cell.tx, angle: 360, duration: 400 });
                        }
                    }
                }
                this.showPowerupBanner("DISTRACTORS SHUFFLED!");
            }

            getCellAtPointer(pointer) {
                if (this.isLevelCleared || this.isPausedByOverlay) return null;
                const p = this.levelData.profile, radiusSq = (this.cellSize / 2) * (this.cellSize / 2);
                for (let r = 0; r < p.rows; r++) {
                    for (let c = 0; c < p.cols; c++) {
                        const cell = this.cells[r][c]; if (cell.isBlock) continue;
                        const dx = pointer.x - cell.cx, dy = pointer.y - cell.cy;
                        if (dx * dx + dy * dy <= radiusSq) return cell;
                    }
                }
                return null;
            }

            handlePointerDown(pointer) {
                if (this.isLevelCleared || this.isPausedByOverlay) return;

                if (this.tutorialLoopActive) {
                    if (this.cancelTutorialLoop) this.cancelTutorialLoop();
                }

                if (this.isTutorialRunning) return;

                const cell = this.getCellAtPointer(pointer);
                if (cell) {
                    if (State.tapToSelect) { this.addCell(cell.c, cell.r); this.checkTapMatch(); }
                    else { this.clearSelection(); this.dragging = true; this.addCell(cell.c, cell.r); }
                }
            }

            handlePointerMove(pointer) {
                if (!this.dragging || this.isLevelCleared || this.isPausedByOverlay || State.tapToSelect || this.isTutorialRunning) return;
                const cell = this.getCellAtPointer(pointer);
                if (cell) {
                    if (this.selected.length >= 2) {
                        const prevCell = this.selected[this.selected.length - 2];
                        if (prevCell.c === cell.c && prevCell.r === cell.r) {
                            const removed = this.selected.pop();
                            const remCell = this.cells[removed.r][removed.c];
                            this.paintTile(remCell.g, remCell.cx, remCell.cy, remCell.cs, theme().cell, theme().cellLine, "normal");
                            AudioEngine.deselect();
                            return;
                        }
                    }
                    this.addCell(cell.c, cell.r);
                }
            }

            addCell(c, r) {
                const p = this.levelData.profile;
                if (r < 0 || r >= p.rows || c < 0 || c >= p.cols || this.cells[r][c].isBlock) return;
                const last = this.selected[this.selected.length - 1];
                if (last && last.c === c && last.r === r) return;
                if (last && (Math.abs(last.c - c) + Math.abs(last.r - r) !== 1)) return;

                if (this.selected.some(item => item.c === c && item.r === r)) return;

                this.selected.push({ c, r });
                const cell = this.cells[r][c];
                this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, theme().selected, theme().accent, "selected");
                AudioEngine.select();
            }

            checkTapMatch() {
                const traced = this.selected.map(item => this.cells[item.r][item.c].letter).join("");
                const reversed = [...traced].reverse().join("");
                const match = this.levelData.placements.find(pl => !this.foundSet.has(pl.word) && (pl.word === traced || pl.word === reversed));
                if (match) {
                    this.markFound(match, [...this.selected]);
                }
            }

            finishSelection() {
                if (State.tapToSelect || (!this.dragging && !this.isTutorialRunning) || this.isPausedByOverlay) return;
                this.dragging = false;
                const traced = this.selected.map(item => this.cells[item.r][item.c].letter).join("");
                const reversed = [...traced].reverse().join("");
                const match = this.levelData.placements.find(pl => !this.foundSet.has(pl.word) && (pl.word === traced || pl.word === reversed));

                if (match) {
                    this.markFound(match, [...this.selected]);
                } else {
                    if (this.selected.length > 1) AudioEngine.wrong();
                    this.clearSelection();
                }
            }

            clearSelection() {
                this.selected.forEach(item => {
                    const cell = this.cells[item.r][item.c];
                    this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, theme().cell, theme().cellLine, "normal");
                });
                this.selected = [];
            }

            markFound(pl, customPath = null) {
                this.foundSet.add(pl.word); const t = theme();
                State.addLearnedWord(pl.word, pl.category || "GENERAL", State.age);

                const pathTiles = customPath || pl.path.map(([c, r]) => ({ c, r }));

                pathTiles.forEach(({ c, r }) => {
                    const cell = this.cells[r][c];
                    this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, t.found, t.success, "found");
                });

                const row = this.wordRowEls[pl.word];
                if (row) { row.classList.add("wf-found"); if (pl.isQuizWord) row.querySelector(".wf-word-text").textContent = pl.word; }

                AudioEngine.correct();

                const now = Date.now(), timeDiff = (now - State.lastFoundTime) / 1000;
                State.lastFoundTime = now;

                if (timeDiff <= 7) {
                    State.streak++; State.powerups.magnet++; State.savePowerups();
                    this.showPowerupBanner(`FAST SOLVE x${State.streak}! +1 MAGNET`);
                } else { State.streak = 1; }

                const centerItem = pathTiles[Math.floor(pathTiles.length / 2)];
                const centerCell = this.cells[centerItem.r][centerItem.c];
                this.spawnWordParticleFX(centerCell.cx, centerCell.cy);
                this.confettiBurst(W / 2, 700, 28);
                this.selected = [];

                if (this.foundSet.size === this.levelData.placements.length) {

            openHistoryGridModalFromGame() {
                const history = State.getLevelHistory();
                let selectedDiff = State.difficulty;

                const renderGrid = (diff) => {
                    const levelMap = {};

                    history.forEach(h => {
                        if (h.diffNum === diff) {
                            if (!levelMap[h.level] || h.stars > levelMap[h.level]) {
                                levelMap[h.level] = h.stars;
                            }
                        }
                    });

                    let gridHTML = "";
                    const maxHistoryLevel = Math.max(...history.filter(h => h.diffNum === diff).map(h => h.level), 0);
                    const currentProgressLevel = (selectedDiff === State.difficulty) ? State.level : 1;
                    const totalLevelsToShow = Math.max(20, maxHistoryLevel + 1, currentProgressLevel);

                    for (let l = 1; l <= totalLevelsToShow; l++) {
                        const stars = levelMap[l] || 0;
                        const isAttempted = levelMap[l] !== undefined;
                        const isUnlocked = (l === 1) || isAttempted || (l <= maxHistoryLevel + 1);

                        const starsHTML = Array.from({ length: 3 }, (_, i) =>
                            miniIconHTML(i < stars ? "star" : "star-off", 16, i < stars ? "#facc15" : "rgba(255,255,255,0.4)")

                        if (isUnlocked) {

                const modalHTML = `

                const modal = this.openHtmlModal(920, 920, modalHTML, { depth: 300, bg: "#1e2942", border: "#475569", padding: 28 });

            levelComplete() {
                this.isLevelCleared = true;
                if (this.timerEvent) this.timerEvent.remove();
                AudioEngine.win();

                let stars = 1;
                if (this.timeTaken <= 25) stars = 3;
                else if (this.timeTaken <= 45) stars = 2;

                const reqStars = State.getRequiredStarsToUnlock(State.difficulty + 1);
                const prevAccumulatedStars = State.getAccumulatedStars(State.difficulty);

                const currentLevel = State.level;

                // Save history and compute strictly extra stars gained beyond previous personal best for this level
                const extraStarsGained = State.saveLevelHistory({
                    level: currentLevel,
                    diffNum: State.difficulty,
                    diffName: this.levelData.profile.name,
                    timeTaken: this.timeTaken,
                    stars,
                    usedPw: State.usedPowerupThisLevel,
                    timestamp: Date.now()
                });

                const newTotalStars = State.addStars(State.difficulty, extraStarsGained);

                let newlyUnlockedDiff = null;
                if (prevAccumulatedStars < reqStars && newTotalStars >= reqStars && State.difficulty < 5) {
                    newlyUnlockedDiff = State.difficulty + 1;
                }

                const maxLevelForThisTier = 20;
                const isLastLevelOfTier = currentLevel >= maxLevelForThisTier;

                const starsHTML = Array.from({ length: 3 }, (_, i) => miniIconHTML(i < stars ? "star" : "star-off", 64, i < stars ? "#facc15" : "#64748b")).join("");

                if (isLastLevelOfTier) {
                    const badgeHTML = `
            <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; height:100%; justify-content:center;">
              <div style="display:flex; gap:12px; margin-bottom:4px;">${starsHTML}</div>
              
              <div style="display:flex; align-items:center; justify-content:center; gap:10px; background:rgba(250,204,21,0.15); border:3px solid #facc15; padding:8px 24px; border-radius:999px;">
                ${miniIconHTML("sparkles", 30, "#facc15")}
                <span style="font-size:32px; font-weight:800; color:#facc15; letter-spacing:1px;">DIFFICULTY COMPLETED!</span>
                ${miniIconHTML("sparkles", 30, "#facc15")}
              </div>

              <div style="font-size:22px; color:#e2e8f0; max-width:720px; line-height:1.4;">
                You have completed this difficulty tier! Move on to a new challenge or choose to replay your favorite levels.
              </div>

              <div style="display:flex; flex-direction:column; gap:10px; width:100%; max-width:540px; margin-top:6px;">
                ${State.difficulty < 5 ? `
                <button class="wf-btn" id="btn-next-diff" style="height:70px; background:linear-gradient(180deg, #22c55e, #15803d); --base-btn-size: 24px; color:#ffffff;">
                  <span class="wf-btn-icon">${miniIconHTML("play", 28, "#ffffff")}</span>
                  <span>MOVE TO NEXT DIFFICULTY ▶</span>
                </button>` : ""}
                <button class="wf-btn" id="btn-open-grid" style="height:70px; background:linear-gradient(180deg, #38bdf8, #0284c7); --base-btn-size: 22px; color:#ffffff;">
                  <span class="wf-btn-icon">${miniIconHTML("grid", 26, "#ffffff")}</span>
                  <span>REPLAY LEVELS (GRID)</span>
                </button>
                <button class="wf-btn" id="btn-home" style="height:65px; background:linear-gradient(180deg, #a855f7, #7e22ce); --base-btn-size: 22px; color:#ffffff;">
                  HOME MENU
                </button>
              </div>
            </div>`;

                    const modal = this.openHtmlModal(880, 820, badgeHTML, { depth: 200, bg: "#1e2942", border: "#facc15", borderWidth: 6 });
                    refreshIcons();

                    if (modal.node.querySelector("#btn-next-diff")) {
                        modal.node.querySelector("#btn-next-diff").addEventListener("click", () => {
                            State.difficulty++;
                            localStorage.setItem('wend_difficulty', State.difficulty.toString());
                            State.level = 1;
                            modal.destroy(); this.scene.restart();
                        });
                    }

                    modal.node.querySelector("#btn-open-grid").addEventListener("click", () => {
                        modal.destroy();
                        this.openHistoryGridModalFromGame();
                    });

                    modal.node.querySelector("#btn-home").addEventListener("click", () => {
                        modal.destroy(); this.scene.start("Home");
                    });

                } else if (newlyUnlockedDiff) {
                    State.powerups.magnet += 2;
                    State.powerups.reveal += 2;
                    State.powerups.freeze += 2;
                    State.powerups.shuffle += 2;
                    State.savePowerups();

                    const totalUnlocked = State.getUnlockedDiffCount();
                    const showChooseOption = totalUnlocked > 2;

                    const badgeHTML = `
            <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; height:100%; justify-content:center;">
              <div style="display:flex; gap:12px; margin-bottom:4px;">${starsHTML}</div>
              
              <div style="display:flex; align-items:center; justify-content:center; gap:10px; background:rgba(250,204,21,0.15); border:3px solid #facc15; padding:8px 24px; border-radius:999px;">
                ${miniIconHTML("sparkles", 30, "#facc15")}
                <span style="font-size:32px; font-weight:800; color:#facc15; letter-spacing:1px;">NEW DIFFICULTY UNLOCKED!</span>
                ${miniIconHTML("sparkles", 30, "#facc15")}
              </div>

              <div style="font-size:22px; color:#e2e8f0; max-width:720px; line-height:1.4;">
                Awesome job! You reached <strong>${newTotalStars}/${reqStars}</strong> total stars in this difficulty tier, unlocking the next challenge!
              </div>

              <div style="display:flex; align-items:center; justify-content:center; gap:12px; width:100%; background:linear-gradient(135deg, rgba(34,197,94,0.25), rgba(16,185,129,0.25)); border:3px solid #22c55e; padding:12px 20px; border-radius:24px; box-shadow:0 6px 0 rgba(0,0,0,0.15);">
                <div style="background:#22c55e; border-radius:16px; width:48px; height:48px; display:flex; align-items:center; justify-content:center; border:2px solid #ffffff;">
                  ${miniIconHTML("zap", 28, "#ffffff")}
                </div>
                <div style="text-align:left;">
                  <div style="font-size:16px; font-weight:700; color:#86efac; text-transform:uppercase; letter-spacing:1px;">New Tier Unlocked</div>
                  <div style="font-size:26px; font-weight:800; color:#ffffff;">${JSON_DATA.difficulties[newlyUnlockedDiff.toString()].name.toUpperCase()} DIFFICULTY</div>
                </div>
              </div>
              
              <div style="display:flex; flex-direction:column; gap:10px; width:100%; max-width:540px; margin-top:6px;">
                <button class="wf-btn" id="btn-jump-new" style="height:70px; background:linear-gradient(180deg, #22c55e, #15803d); --base-btn-size: 24px; color:#ffffff;">
                  <span class="wf-btn-icon">${miniIconHTML("play", 28, "#ffffff")}</span>
                  <span>JUMP TO NEW DIFFICULTY</span>
                </button>
                <div style="display:flex; gap:12px; width:100%;">
                  <button class="wf-btn" id="btn-mode-select-unlocked" style="width:90px; height:70px; padding:0; flex-shrink:0; background:linear-gradient(180deg, #a855f7, #7e22ce); color:#ffffff;" title="Change Game Mode">
                    ${miniIconHTML("gamepad-2", 36, "#ffffff")}
                  </button>
                  <button class="wf-btn" id="btn-continue-practice" style="flex:1; height:70px; background:linear-gradient(180deg, #fde047, #eab308); --base-btn-size: 22px; color:#1e3a8a;">
                    CONTINUE PRACTICE
                  </button>
                </div>
                ${showChooseOption ? `
                <button class="wf-btn" id="btn-diff-menu" style="height:65px; background:linear-gradient(180deg, #38bdf8, #0284c7); --base-btn-size: 22px; color:#ffffff;">
                  <span class="wf-btn-icon">${miniIconHTML("layers", 26, "#ffffff")}</span>
                  <span>CHOOSE DIFFICULTY</span>
                </button>` : ""}
              </div>
            </div>`;

                    const modal = this.openHtmlModal(880, 880, badgeHTML, { depth: 200, bg: "#1e2942", border: "#475569", borderWidth: 6 });
                    refreshIcons();

                    modal.node.querySelector("#btn-jump-new").addEventListener("click", () => {
                        State.difficulty = newlyUnlockedDiff;
                        localStorage.setItem('wend_difficulty', newlyUnlockedDiff.toString());
                        State.level = 1;
                        modal.destroy(); this.scene.restart();
                    });

                    modal.node.querySelector("#btn-mode-select-unlocked").addEventListener("click", () => {
                        modal.destroy(); this.scene.start("ModeScene");
                    });

                    if (showChooseOption) {
                        modal.node.querySelector("#btn-diff-menu").addEventListener("click", () => {
                            modal.destroy(); this.scene.start("DifficultyScene");
                        });
                    }

                    modal.node.querySelector("#btn-continue-practice").addEventListener("click", () => {
                        State.level++;
                        modal.destroy(); this.scene.restart();
                    });
                } else {
                    State.level++;
                    const html = `
            <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px; height:100%; justify-content:center;">
              <div style="display:flex; gap:10px;">${starsHTML}</div>
              <div style="font-size:52px; font-weight:800; color:${hex(theme().text)};">LEVEL CLEAR!</div>
              <div style="font-size:26px; color:${hex(theme().soft)};">Time Taken: ${this.timeTaken}s • Earned +${stars} ⭐</div>
              <div style="font-size:22px; color:#22c55e; font-weight:800;">
                ✨ Total Tier Stars: ${newTotalStars}/${reqStars}
              </div>

              <div style="display:flex; gap:14px; width:100%; max-width:500px; justify-content:center; align-items:center;">
                <button class="wf-btn" id="btn-mode-select" style="width:90px; height:90px; padding:0; flex-shrink:0; background:linear-gradient(180deg, #a855f7, #7e22ce); color:#ffffff;" title="Level Grid Mode Switch">
                  ${miniIconHTML("gamepad-2", 42, "#ffffff")}
                </button>
                <button class="wf-btn" id="btn-next" style="flex:1; height:90px; background:linear-gradient(180deg, ${theme().gradA}, ${theme().gradB}); --base-btn-size: 32px; color:#1e3a8a;">
                  NEXT LEVEL ▶
                </button>
              </div>
            </div>`;

                    const modal = this.openHtmlModal(840, 600, html, { depth: 200 });
                    refreshIcons();

                    modal.node.querySelector("#btn-mode-select").addEventListener("click", () => {
                        modal.destroy(); this.scene.start("ModeScene");
                    });

                    modal.node.querySelector("#btn-next").addEventListener("click", () => {
                        modal.destroy(); this.scene.restart();
                    });
                }
            }
        }

        const config = {
            type: Phaser.AUTO, parent: "game-container", width: W, height: H,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            dom: { createContainer: true },
            scene: [PreloadScene, HomeScene, DifficultyScene, SettingsScene, AgeScene, ModeScene, GameScene]
        };

        window.onload = () => new Phaser.Game(config);
    </script>
</body>

</html>
