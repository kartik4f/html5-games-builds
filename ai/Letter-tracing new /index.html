<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f342c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Chalkboard Trace — a letter, number, and word tracing game for kids.">
  <title>Chalkboard Trace</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap">
  <style>
    /*
    Chalkboard Trace commits to one scene — a wood-framed classroom chalkboard —
    regardless of the viewer's light/dark OS setting, the way a themed poster or
    game screen would. Every color below is painted explicitly rather than
    switched by prefers-color-scheme.
  */
    :root {
      --wall: #d9e4dc;
      --wall-deep: #c3d3c8;
      --wood: #96622f;
      --wood-dark: #6e4620;
      --wood-light: #c08c50;
      --board: #1f342c;
      --board-deep: #12201a;
      --chalk: #f5f0e6;
      --chalk-dim: #cfd8ce;
      --accent: #ffb703;
      --accent-ink: #6b4600;
      --good: #4cd88a;
      --c-coral: #ff6b6b;
      --c-sky: #4cc9f0;
      --c-mint: #2ec4a6;
      --c-butter: #ffd166;
      --c-lilac: #b185db;
      --font-display: 'Fredoka', 'Baloo 2', system-ui, sans-serif;
      --font-body: 'Quicksand', 'Nunito', system-ui, sans-serif;
      --font-hand: 'Caveat', 'Segoe Script', cursive;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }

    button,
    .swatch,
    .tile,
    .menu-card {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background: radial-gradient(120% 140% at 50% -10%, var(--wall) 0%, var(--wall-deep) 100%);
      color: var(--board);
      font-family: var(--font-body);
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overscroll-behavior-y: none;
      padding: clamp(12px, 3vw, 32px);
      padding-top: max(clamp(12px, 3vw, 32px), env(safe-area-inset-top, 0px));
      padding-bottom: max(clamp(12px, 3vw, 32px), env(safe-area-inset-bottom, 0px));
      padding-left: max(clamp(12px, 3vw, 32px), env(safe-area-inset-left, 0px));
      padding-right: max(clamp(12px, 3vw, 32px), env(safe-area-inset-right, 0px));
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .titleplate {
      text-align: center;
      padding: 2px 6px 0;
    }

    .titleplate h1 {
      font-family: var(--font-hand);
      font-weight: 700;
      font-size: clamp(2.3rem, 7.5vw, 3.4rem);
      color: var(--wood-dark);
      margin: 0;
      text-wrap: balance;
      letter-spacing: 0.5px;
    }

    .titleplate p {
      margin: 2px 0 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: #4c5f52;
    }

    /* ---------- home / menu screen ---------- */
    #homeScreen {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (max-width: 420px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }
    }

    .menu-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 26px 14px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      background: linear-gradient(160deg, var(--wood-light), var(--wood) 55%, var(--wood-dark));
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.25), inset 0 -6px 12px rgba(0, 0, 0, 0.3), 0 8px 18px -8px rgba(30, 20, 5, 0.5);
      color: var(--chalk);
    }

    .menu-card:active {
      transform: scale(0.97);
    }

    .menu-icon {
      font-size: 2.8rem;
      line-height: 1;
    }

    .menu-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.2rem;
    }

    .menu-sub {
      font-family: var(--font-hand);
      font-size: 1.05rem;
      opacity: 0.85;
    }

    .settings-label {
      font-family: var(--font-hand);
      font-weight: 700;
      color: var(--wood-dark);
      font-size: 1.1rem;
      text-align: center;
      margin-top: 4px;
    }

    .board-row-left {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    .subtoggle {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .subtab {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      color: var(--chalk);
    }

    .subtab.active {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .voicebar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: -2px;
    }

    .voice-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #4c5f52;
      margin-right: 2px;
    }

    .voicetab {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: rgba(150, 98, 47, 0.12);
      color: var(--wood-dark);
    }

    .voicetab.active {
      background: var(--wood);
      color: var(--chalk);
    }

    .voicetab[aria-pressed="true"] {
      background: var(--wood);
      color: var(--chalk);
    }

    body.lefty .board-footer {
      flex-direction: row-reverse;
    }

    /* ---------- wooden frame + chalkboard ---------- */
    .frame {
      position: relative;
      padding: 14px;
      border-radius: 18px;
      background:
        repeating-linear-gradient(115deg, rgba(0, 0, 0, 0.10) 0 2px, transparent 2px 9px),
        linear-gradient(160deg, var(--wood-light), var(--wood) 45%, var(--wood-dark) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.25),
        inset 0 -6px 14px rgba(0, 0, 0, 0.35),
        0 14px 30px -12px rgba(30, 20, 5, 0.55);
    }

    .frame .peg-tl,
    .frame .peg-tr,
    .frame .peg-bl,
    .frame .peg-br {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe1a8, #7a5323 70%, #4a2f11);
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
    }

    .frame .peg-tl {
      top: 8px;
      left: 8px;
    }

    .frame .peg-tr {
      top: 8px;
      right: 8px;
    }

    .frame .peg-bl {
      bottom: 8px;
      left: 8px;
    }

    .frame .peg-br {
      bottom: 8px;
      right: 8px;
    }

    .board {
      position: relative;
      border-radius: 8px;
      background: var(--board-deep);
      box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.35), inset 0 10px 24px rgba(0, 0, 0, 0.5);
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .board-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .plaque {
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--chalk);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(245, 240, 230, 0.25);
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
    }

    .totals {
      font-family: var(--font-body);
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 999px;
      padding: 6px 12px;
      display: inline-block;
    }

    .bump {
      animation: bumpPulse 0.4s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes bumpPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.4);
      }

      100% {
        transform: scale(1);
      }
    }

    .flying-star {
      position: fixed;
      pointer-events: none;
      font-size: 20px;
      z-index: 9999;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      transition: left 0.55s cubic-bezier(.2, .8, .3, 1), top 0.55s cubic-bezier(.2, .8, .3, 1), transform 0.55s ease, opacity 0.5s ease 0.05s;
    }

    .canvas-wrap {
      position: relative;
      margin: 0 auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      /* Grow the tracing surface to fill whatever room the viewport allows —
       bounded by a comfortable max width, but also by available viewport
       height (minus the chrome around it) so short/landscape screens don't
       force scrolling just to see the whole board. Never distorts: the
       canvas element itself is fixed at a 320:380 aspect-ratio below, so
       this only ever scales it uniformly, never stretches it. */
      width: min(100%, 560px, max(220px, calc((100dvh - 300px) * 0.842)));
    }

    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 320 / 380;
      border-radius: 6px;
      object-fit: contain;
    }

    #ink,
    #cp,
    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pulse-ring {
      position: absolute;
      width: 30px;
      height: 30px;
      margin-left: -15px;
      margin-top: -15px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      pointer-events: none;
      animation: pulseRing 1.1s ease-out infinite;
    }

    .pulse-ring.hidden {
      display: none;
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.6);
        opacity: 0.95;
      }

      100% {
        transform: scale(1.7);
        opacity: 0;
      }
    }

    .icon-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      color: var(--chalk);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background 0.12s ease;
      flex: 0 0 auto;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .icon-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .icon-btn.is-hidden {
      visibility: hidden;
    }

    .icon-btn.mini {
      width: 40px;
      height: 40px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.14);
    }

    .tray .is-hidden {
      display: none;
    }

    .board-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tray {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(0, 0, 0, 0.22);
      border-radius: 999px;
      padding: 8px 14px;
      max-width: 100%;
    }

    .swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 -3px 4px rgba(0, 0, 0, 0.25);
    }

    .swatch[aria-pressed="true"] {
      outline: 3px solid var(--chalk);
      outline-offset: 2px;
      transform: scale(1.12);
    }

    .clear-btn {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--board-deep);
      background: var(--chalk);
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      cursor: pointer;
    }

    .clear-btn:active {
      transform: scale(0.96);
    }

    button:focus-visible,
    .swatch:focus-visible,
    .tile:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- celebration overlay ---------- */
    .celebrate {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 32, 26, 0.72);
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .celebrate.show {
      opacity: 1;
      pointer-events: auto;
    }

    .celebrate-card {
      background: var(--chalk);
      color: var(--board-deep);
      border-radius: 18px;
      padding: 22px 30px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      transform: scale(0.8) rotate(-4deg);
      transition: transform 0.32s cubic-bezier(.34, 1.56, .64, 1);
    }

    .celebrate.show .celebrate-card {
      transform: scale(1) rotate(0deg);
    }

    .celebrate-msg {
      font-family: var(--font-hand);
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0;
    }

    .celebrate-stars {
      font-size: 2rem;
      color: var(--accent);
      margin: 4px 0 6px;
      letter-spacing: 3px;
    }

    .celebrate-object {
      margin: 6px 0 16px;
    }

    .obj-pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .obj-letter {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 4rem;
      line-height: 1;
      color: var(--wood-dark);
      animation: objPopLetter 0.5s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    .obj-emoji {
      font-size: 4rem;
      line-height: 1;
      animation: objPopEmoji 0.5s cubic-bezier(.34, 1.56, .64, 1) 0.15s both;
    }

    .obj-text {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.2rem;
      margin-top: 8px;
    }

    @keyframes objPopLetter {
      0% {
        transform: scale(0) rotate(-18deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.25) rotate(6deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes objPopEmoji {
      0% {
        transform: scale(0) rotate(18deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.3) rotate(-6deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    .btn-primary {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.05rem;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 999px;
      padding: 12px 26px;
      cursor: pointer;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .nudge {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) translateY(6px);
      background: rgba(0, 0, 0, 0.62);
      color: var(--chalk);
      font-weight: 700;
      font-size: 0.92rem;
      padding: 9px 18px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
      max-width: 92%;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .nudge.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- shelf ---------- */
    .shelf-wrap {
      margin-top: 2px;
    }

    .shelf-label {
      font-family: var(--font-hand);
      font-weight: 700;
      color: var(--wood-dark);
      font-size: 1.1rem;
      margin: 6px 2px 3px;
    }

    .shelf {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      scroll-snap-type: x proximity;
    }

    .shelf::-webkit-scrollbar {
      height: 6px;
    }

    .shelf::-webkit-scrollbar-thumb {
      background: var(--wood);
      border-radius: 4px;
    }

    .tile {
      scroll-snap-align: start;
      flex: 0 0 auto;
      width: 62px;
      height: 68px;
      border-radius: 9px;
      cursor: pointer;
      background: linear-gradient(160deg, #d9a465, #b47a3d);
      border: 1px solid rgba(0, 0, 0, 0.15);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 5px rgba(0, 0, 0, 0.25), 0 2px 3px rgba(0, 0, 0, 0.18);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.4rem;
      color: #4a2f11;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      position: relative;
    }

    .tile.wordtile {
      width: auto;
      min-width: 92px;
      padding: 0 14px;
      font-size: 1.15rem;
      letter-spacing: 1px;
    }

    .tile.numtile {
      width: auto;
      min-width: 54px;
      padding: 0 8px;
      font-size: 1.2rem;
    }

    .tile .pips {
      font-size: 0.55rem;
      letter-spacing: 1px;
      color: var(--accent-ink);
      height: 9px;
    }

    .tile[aria-current="true"] {
      background: linear-gradient(160deg, #ffe1a8, var(--accent));
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -3px 5px rgba(0, 0, 0, 0.2), 0 0 0 2px var(--chalk);
      animation: tileBob 1.6s ease-in-out infinite;
    }

    .tile[data-stars="0"] .pips {
      visibility: hidden;
    }

    .tile-pop {
      animation: tilePop 0.28s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes tilePop {
      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.18) rotate(-3deg);
      }

      100% {
        transform: scale(1) rotate(0);
      }
    }

    @keyframes tileBob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    /* On short / landscape screens (phones on their side, small tablets),
     trim the chrome around the board so the tracing surface keeps as much
     of the available height as possible. */
    @media (max-height: 560px) {
      .app {
        gap: 6px;
      }

      .board {
        padding: 8px 8px 9px;
        gap: 6px;
      }

      .board-footer {
        gap: 6px;
      }

      .tray {
        padding: 6px 10px;
        gap: 7px;
      }

      .swatch {
        width: 32px;
        height: 32px;
      }

      .shelf-wrap {
        margin-top: 0;
      }

      .shelf-label {
        margin: 4px 2px 2px;
        font-size: 0.95rem;
      }

      .shelf {
        padding: 2px 2px 6px;
        gap: 7px;
      }

      .tile {
        width: 48px;
        height: 52px;
        font-size: 1.15rem;
      }

      .settings-label {
        margin-top: 2px;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <!-- ============ HOME / MENU SCENE ============ -->
    <div id="homeScreen">
      <div class="titleplate">
        <h1>Chalkboard Trace</h1>
        <p>Pick something to trace!</p>
      </div>

      <div class="menu-grid">
        <button class="menu-card" data-menu="letters">
          <span class="menu-icon">🔤</span>
          <span class="menu-title">Letter Tracing</span>
          <span class="menu-sub">A a</span>
        </button>
        <button class="menu-card" data-menu="numbers">
          <span class="menu-icon">🔢</span>
          <span class="menu-title">Number Tracing</span>
          <span class="menu-sub">1 2 3</span>
        </button>
        <button class="menu-card" data-menu="words">
          <span class="menu-icon">📝</span>
          <span class="menu-title">Word Tracing</span>
          <span class="menu-sub">Cat · Dog</span>
        </button>
        <button class="menu-card" data-menu="free">
          <span class="menu-icon">🎨</span>
          <span class="menu-title">Free Draw</span>
          <span class="menu-sub">Just for fun</span>
        </button>
      </div>

      <div class="settings-label">⚙️ Settings</div>
      <div class="voicebar" role="group" aria-label="Voice accent">
        <span class="voice-label">Voice:</span>
        <button class="voicetab accent-tab active" data-accent="us" aria-pressed="true">🇺🇸 US</button>
        <button class="voicetab accent-tab" data-accent="uk" aria-pressed="false">🇬🇧 UK</button>

      function buildWordGlyph(word) {

      // ---------- audio ----------

      // ---------- speech (kid-toned, with a UK / US / India accent picker) ----------

      function refreshVoices() { if (canSpeak) voicesList = speechSynthesis.getVoices() || []; }

        if (!candidates.length) candidates = voicesList.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));

      // iOS/Safari (and some Chrome builds) only allow speechSynthesis to start

      document.querySelectorAll('.accent-tab').forEach(btn => {

      });

      let guideOsc = null, guideGain = null;

      // ---------- particles ----------
      let particles = [], fxRunning = false, lastT = 0;
      function spawnSparkle(x, y, color) {
        if (reduceMotion) return;
        for (let i = 0; i < 3; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60 - 20, life: 0.6, color, size: 1.5 + Math.random() * 1.5 });
        ensureFx();
      }
      function spawnRing(x, y, color) {

      }
      function spawnBurst() {
        if (reduceMotion) return;

          particles.push({ x: Wc / 2, y: Hc / 2, vx: (Math.random() - 0.5) * 220, vy: -Math.random() * 220 - 40, life: 1, color, size: 2 + Math.random() * 2.5 });

      function ensureFx() { if (!fxRunning) { fxRunning = true; lastT = performance.now(); requestAnimationFrame(fxLoop); } }
      function fxLoop(t) {

      // ---------- state ----------
      let mode = 'trace', currentTrace = 0, currentWord = 0, currentNum100 = 0;
      let glyph = null, attempt = null, curColor = COLORS[0], drawing = false, lastPt = null;

      function newAttempt() { return { cpIndex: 0, userTotal: 0, onTrackTotal: 0, midStrokeLifts: 0, completed: false, celebrated: false, exploring: false }; }

          plaque.textContent = 'Number ' + numStr;
          updateNum100ShelfActive();
          speak(`Trace the number ${numStr}`);
        }
        attempt = newAttempt();
        drawGuide(glyph);
        inkCtx.clearRect(0, 0, Wc, Hc);
        renderCheckpoints(glyph, 0);
        positionPulseRing(glyph.checkpoints[0]);
        fxCtx.clearRect(0, 0, Wc, Hc);
        hideCelebration();
      }

      // ---------- free-draw goal (a rotating prompt so it's not just a blank pad) ----------
      let currentFreePromptIdx = -1;
      function rerollFreePrompt() {
        let idx;
        do { idx = Math.floor(Math.random() * FREE_PROMPTS.length); } while (idx === currentFreePromptIdx && FREE_PROMPTS.length > 1);
        currentFreePromptIdx = idx;
        const [emoji, word] = FREE_PROMPTS[idx];
        plaque.textContent = `🎯 Draw a ${word}! ${emoji}`;
        inkCtx.clearRect(0, 0, Wc, Hc);
        speak(`Let's draw a ${word}!`);
      }

      function loadFree() {
        glyph = null; attempt = null;
        drawBoardBackground(ctx);
        inkCtx.clearRect(0, 0, Wc, Hc);
        cpCtx.clearRect(0, 0, Wc, Hc);
        fxCtx.clearRect(0, 0, Wc, Hc);
        positionPulseRing(null);
        hideCelebration();
        rerollFreePrompt();
      }

      function toLogical(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (Wc / rect.width), y: (e.clientY - rect.top) * (Hc / rect.height) };
      }

      function drawSegment(a, b, colorVar) {
        const color = RESOLVED[colorVar] || '#ff6b6b';
        const corridor = currentCorridor();
        inkCtx.save();
        inkCtx.strokeStyle = color; inkCtx.lineWidth = corridor * 0.5;
        inkCtx.lineJoin = 'round'; inkCtx.lineCap = 'round'; inkCtx.globalAlpha = 0.92;
        inkCtx.beginPath(); inkCtx.moveTo(a.x, a.y); inkCtx.lineTo(b.x, b.y); inkCtx.stroke();
        if (Math.random() < 0.35) {
          inkCtx.globalAlpha = 0.25; inkCtx.lineWidth = corridor * 0.22; inkCtx.strokeStyle = '#ffffff';
          inkCtx.beginPath();
          inkCtx.moveTo(a.x + (Math.random() - 0.5) * 2, a.y + (Math.random() - 0.5) * 2);
          inkCtx.lineTo(b.x + (Math.random() - 0.5) * 2, b.y + (Math.random() - 0.5) * 2);
          inkCtx.stroke();
        }
        inkCtx.restore();
        // mask out ink that landed outside the letter's shape — but only past the
        // wider buffer zone, not the strict scoring corridor, so a slightly loose
        // stroke still shows instead of vanishing right at the guide's edge
        if (glyph && glyph.bufferMaskCanvas) {
          inkCtx.save();
          inkCtx.globalCompositeOperation = 'destination-in';
          inkCtx.drawImage(glyph.bufferMaskCanvas, 0, 0, Wc, Hc);
          inkCtx.restore();
        }
      }

      function processAccuracy(p) {
        attempt.userTotal++;
        const gx = Math.round(p.x), gy = Math.round(p.y);
        if (gx >= 0 && gx < Wc && gy >= 0 && gy < Hc && glyph.mask[gy * Wc + gx]) attempt.onTrackTotal++;
      }

      function markHit(i) {
        attempt.cpIndex = i + 1;
        const hitX = glyph.checkpoints[i].x, hitY = glyph.checkpoints[i].y;
        spawnSparkle(hitX, hitY, RESOLVED[curColor]);
        spawnRing(hitX, hitY, RESOLVED[curColor]);
        flyStarToCounter(hitX, hitY);
        addStars(1);
        playTick();
        if (navigator.vibrate) navigator.vibrate(16);
        renderCheckpoints(glyph, attempt.cpIndex);
        if (attempt.cpIndex >= glyph.checkpoints.length) {
          positionPulseRing(null);
          onCompleted();
        } else {
          positionPulseRing(glyph.checkpoints[attempt.cpIndex]);
        }
      }

      function registerHitCheck(p) {
        while (!attempt.completed) {
          const t = glyph.checkpoints[attempt.cpIndex];
          if (!t) break;
          if (dist(p, t) <= effHitR(glyph)) markHit(attempt.cpIndex); else break;
        }
      }

      function showNudge(text) {
        nudgeEl.textContent = text;
        nudgeEl.classList.add('show');
        clearTimeout(showNudge._t);
        showNudge._t = setTimeout(() => nudgeEl.classList.remove('show'), 1500);
      }

      const MESSAGES = { 3: ['Perfect!', 'Amazing!', 'Superstar!'], 2: ['Great job!', 'Well done!', 'So good!'], 1: ['Nice try!', 'Good start!', 'Keep it up!'] };
      function celebrate(stars, obj) {
        celebrateMsg.textContent = MESSAGES[stars][Math.floor(Math.random() * MESSAGES[stars].length)];
        celebrateStars.textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
        if (obj) {
          objLetter.textContent = obj.letter;
          objEmoji.textContent = obj.emoji;
          objText.textContent = `${obj.letter.toUpperCase()} is for ${obj.word}`;
          // force the pop-in animation to replay even if the same letter is retraced back-to-back
          celebrateObject.hidden = true;
          void celebrateObject.offsetWidth;
          celebrateObject.hidden = false;
        } else {
          celebrateObject.hidden = true;
        }
        celebrateEl.classList.add('show');
        spawnBurst();
        srStatus.textContent = `${celebrateMsg.textContent} ${stars} out of 3 stars.` + (obj ? ` ${obj.letter.toUpperCase()} is for ${obj.word}.` : '');
      }
      function hideCelebration() { celebrateEl.classList.remove('show'); }

      function onCompleted() {
        attempt.completed = true;
        if (attempt.celebrated) return;
        attempt.celebrated = true;
        const accuracy = attempt.userTotal ? attempt.onTrackTotal / attempt.userTotal : 1;
        // Sound Guide tracing is judged by ear, not by eye — pixel-perfect accuracy
        // isn't the point, so completion itself counts for more toward the rating,
        // and an imperfect pen-lift (much harder to time without sight) isn't capped.
        let stars = soundGuideOn
          ? (accuracy >= 0.5 ? 3 : accuracy >= 0.3 ? 2 : 1)
          : (accuracy >= 0.75 ? 3 : accuracy >= 0.5 ? 2 : 1);
        if (attempt.midStrokeLifts > 0 && !soundGuideOn) stars = Math.min(stars, 2);
        const isSingleLetter = mode === 'trace' && /^[A-Za-z]$/.test(glyph.ch);
        const objData = isSingleLetter && OBJECTS[glyph.ch.toLowerCase()]
          ? { letter: glyph.ch, emoji: OBJECTS[glyph.ch.toLowerCase()][0], word: OBJECTS[glyph.ch.toLowerCase()][1] }
          : null;
        celebrate(stars, objData);
        if (mode === 'trace') saveProgress(glyph.ch, stars);
        addStars(stars * 3);
        playChime(stars);
        if (navigator.vibrate) navigator.vibrate([0, 40, 40, 40, 40, 80]);
        let completionSpeech = null;
        if (objData) completionSpeech = `${objData.letter} is for ${objData.word}`;
        else if (mode === 'trace') completionSpeech = `That's the number ${glyph.ch}!`;
        else if (mode === 'num100') completionSpeech = `You traced ${glyph.ch}!`;
        else if (mode === 'words') completionSpeech = `You traced the word ${glyph.ch}!`;
        if (completionSpeech) setTimeout(() => speak(completionSpeech), 650);
      }

      // ---------- pointer events ----------
      // Sound Guide widens tolerance a lot — a blind child can't visually confirm
      // "close enough", so the same physical miss that's fine for a sighted child
      // needs a much bigger effective target.
      function effHitR(g) { return soundGuideOn ? g.hitR * 2.2 : g.hitR; }
      function effStartR(g) { return soundGuideOn ? g.startR * 2.4 : g.startR; }

      canvas.addEventListener('pointerdown', (e) => {
        ensureAudio();
        unlockSpeech();
        const p = toLogical(e);
        if (mode === 'free') {
          drawing = true; lastPt = p;
          try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
          e.preventDefault();
          return;
        }
        if (!glyph || attempt.completed) return;
        const target = glyph.checkpoints[attempt.cpIndex];
        if (!target) return;
        if (target.isStart) {
          if (dist(p, target) > effStartR(glyph)) {
            if (soundGuideOn) {
              // touchscreens have no "hover" — dragging IS how a blind child explores.
              // Start a silent search: play the guide tone toward the target and only
              // begin the real stroke once they land close enough to lock on.
              attempt.exploring = true;
              drawing = true; lastPt = p;
              try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
              startGuideTone();
            } else {
              showNudge(attempt.cpIndex === 0 ? 'Start on the glowing dot 1!' : 'Put your finger back on the glowing dot!');
            }
            e.preventDefault();
            return;
          }
          drawing = true; lastPt = p;
          try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
          startGuideTone();
          markHit(attempt.cpIndex);
        } else {
          drawing = true; lastPt = p;
          try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
          startGuideTone();
        }
        e.preventDefault();
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const p = toLogical(e);
        if (mode === 'free') { drawSegment(lastPt, p, curColor); lastPt = p; e.preventDefault(); return; }
        if (attempt.completed) return;
        if (attempt.exploring) {
          // searching for the start dot by ear only — no ink, no scoring yet
          const target = glyph.checkpoints[attempt.cpIndex];
          if (target) {
            updateGuideTone(dist(p, target), false);
            if (dist(p, target) <= effStartR(glyph)) {
              attempt.exploring = false;
              lastPt = p;
              markHit(attempt.cpIndex);
            }
          }
          e.preventDefault();
          return;
        }
        drawSegment(lastPt, p, curColor);
        processAccuracy(p);
        registerHitCheck(p);
        if (soundGuideOn && !attempt.completed) {
          const target = glyph.checkpoints[attempt.cpIndex];
          if (target) {
            const gx = Math.round(p.x), gy = Math.round(p.y);
            const onTrack = gx >= 0 && gx < Wc && gy >= 0 && gy < Hc && !!glyph.mask[gy * Wc + gx];
            updateGuideTone(dist(p, target), onTrack);
          }
        }
        lastPt = p;
        e.preventDefault();
      });
      function endStroke() {
        if (!drawing) return;
        drawing = false;
        stopGuideTone();
        if (mode === 'free') return;
        if (!glyph || attempt.completed) return;
        if (attempt.exploring) { attempt.exploring = false; return; }
        const lastCp = glyph.checkpoints[attempt.cpIndex - 1];
        if (lastCp && !lastCp.isEnd) {
          attempt.midStrokeLifts++;
          showNudge('Try to keep your finger down until the line is done!');
        }
      }
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
      canvas.addEventListener('pointerleave', () => { if (drawing) endStroke(); });

      // ---------- home / menu → draw scene ----------
      // ITEMS is [26 upper][26 lower][10 digits] in that order (see construction above).
      const RANGES = { upper: [0, 25], lower: [26, 51], digits: [52, 61] };
      let topMenu = 'letters', letterCase = 'upper', numberSet = 'digits';

      function showScene(name) {
        document.getElementById('homeScreen').style.display = name === 'home' ? '' : 'none';
        document.getElementById('playScreen').style.display = name === 'play' ? '' : 'none';
      }

      function applyModeChrome() {
        hearBtn.style.display = (mode !== 'free' && canSpeak) ? '' : 'none';
        const isFree = mode === 'free';
        prevBtn.classList.toggle('is-hidden', isFree);
        nextArrow.classList.toggle('is-hidden', isFree);
        document.getElementById('freeNewIdeaBtn').classList.toggle('is-hidden', !isFree);
        document.getElementById('freeDoneBtn').classList.toggle('is-hidden', !isFree);
      }

      function updateShelfVisibility() {
        const activeKey = topMenu === 'letters' ? letterCase : topMenu === 'numbers' ? numberSet : topMenu === 'words' ? 'words' : null;
        const units = { upper: 'unitUpper', lower: 'unitLower', digits: 'unitDigits', words: 'unitWords', count100: 'unitNum100' };
        Object.entries(units).forEach(([key, id]) => { document.getElementById(id).style.display = key === activeKey ? '' : 'none'; });
      }

      function updateSubToggles() {
        document.getElementById('letterCaseToggle').style.display = topMenu === 'letters' ? '' : 'none';
        document.getElementById('numberSetToggle').style.display = topMenu === 'numbers' ? '' : 'none';
        document.querySelectorAll('#letterCaseToggle .subtab').forEach(b => b.classList.toggle('active', b.dataset.case === letterCase));
        document.querySelectorAll('#numberSetToggle .subtab').forEach(b => b.classList.toggle('active', b.dataset.set === numberSet));
      }

      function openMenu(which) {
        topMenu = which;
        if (which === 'letters') { mode = 'trace'; currentTrace = RANGES[letterCase][0]; }
        else if (which === 'numbers') {
          if (numberSet === 'digits') { mode = 'trace'; currentTrace = RANGES.digits[0]; }
          else { mode = 'num100'; }
        } else if (which === 'words') { mode = 'words'; }
        else if (which === 'free') { mode = 'free'; }
        applyModeChrome();
        updateShelfVisibility();
        updateSubToggles();
        showScene('play');
        if (mode === 'free') loadFree(); else loadItem();
      }
      document.querySelectorAll('.menu-card').forEach(card => {
        card.addEventListener('click', () => { popTile(card); openMenu(card.dataset.menu); });
      });
      document.getElementById('backBtn').addEventListener('click', () => {
        stopGuideTone();
        if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { } }
        showScene('home');
      });
      document.querySelectorAll('#letterCaseToggle .subtab').forEach(btn => {
        btn.addEventListener('click', () => {
          letterCase = btn.dataset.case;
          currentTrace = RANGES[letterCase][0];
          updateShelfVisibility(); updateSubToggles();
          loadItem();
        });
      });
      document.querySelectorAll('#numberSetToggle .subtab').forEach(btn => {
        btn.addEventListener('click', () => {
          numberSet = btn.dataset.set;
          if (numberSet === 'digits') { mode = 'trace'; currentTrace = RANGES.digits[0]; }
          else { mode = 'num100'; }
          applyModeChrome(); updateShelfVisibility(); updateSubToggles();
          loadItem();
        });
      });

      function activeRangeKey() {
        if (topMenu === 'letters') return letterCase;
        if (topMenu === 'numbers' && numberSet === 'digits') return 'digits';
        return null;
      }
      function stepItem(delta) {
        if (mode === 'trace') {
          const key = activeRangeKey();
          if (key) {
            const [start, end] = RANGES[key], len = end - start + 1;
            currentTrace = start + (((currentTrace - start) + delta) % len + len) % len;
          } else {
            currentTrace = (currentTrace + delta + ITEMS.length) % ITEMS.length;
          }
          loadItem();
        } else if (mode === 'words') {
          currentWord = (currentWord + delta + WORDS.length) % WORDS.length;
          loadItem();
        } else if (mode === 'num100') {
          currentNum100 = (currentNum100 + delta + NUM100.length) % NUM100.length;
          loadItem();
        } else if (mode === 'free') {
          hideCelebration(); rerollFreePrompt();
        }
      }

      // ---------- controls ----------
      document.querySelectorAll('.swatch').forEach(sw => {
        sw.addEventListener('click', () => {
          curColor = sw.dataset.color;
          document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s === sw)));
        });
      });
      document.getElementById('freeNewIdeaBtn').addEventListener('click', () => rerollFreePrompt());
      document.getElementById('freeDoneBtn').addEventListener('click', () => {
        celebrate(3, null);
        addStars(10);
        playChime(3);
        if (navigator.vibrate) navigator.vibrate([0, 40, 40, 40, 40, 80]);
        speak('Beautiful drawing!');
      });
      document.getElementById('clearBtn').addEventListener('click', () => {
        inkCtx.clearRect(0, 0, Wc, Hc);
        if (mode === 'free') return;
        attempt = newAttempt();
        renderCheckpoints(glyph, 0);
        positionPulseRing(glyph.checkpoints[0]);
        fxCtx.clearRect(0, 0, Wc, Hc);
        hideCelebration();
      });
      prevBtn.addEventListener('click', () => stepItem(-1));
      nextArrow.addEventListener('click', () => stepItem(1));
      document.getElementById('nextBtn').addEventListener('click', () => stepItem(1));
      hearBtn.addEventListener('click', () => {
        if (mode === 'trace') speakItem(ITEMS[currentTrace]);
        else if (mode === 'words') speakWord(WORDS[currentWord]);
        else if (mode === 'num100') speak(`Trace the number ${NUM100[currentNum100]}`);
      });

      // ---------- boot ----------
      function boot() { showScene('home'); }
      if (document.fonts && document.fonts.ready) {
        Promise.all([document.fonts.load('600 20px Quicksand'), document.fonts.load('700 20px Caveat')])
          .catch(() => { }).then(() => document.fonts.ready).then(boot);
      } else {
        boot();
      }
    })();
  </script>
</body>

</html>
