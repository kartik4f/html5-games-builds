<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wendRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#e0455e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#c23b52" flood-opacity="1"/>
    </filter>
  </defs>

  <text x="450" y="150" text-anchor="middle"
        font-family="'Baloo 2','Fredoka',cursive,sans-serif"
        font-size="150" font-weight="800"
        fill="url(#wendRed)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"
        paint-order="stroke fill"
        filter="url(#softShadow)"
        letter-spacing="4">WEND</text>

  <text x="450" y="225" text-anchor="middle"
        font-family="'Baloo 2','Fredoka',cursive,sans-serif"
        font-size="52" font-weight="800"
        fill="#7c5cf0" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"
        paint-order="stroke fill"
        letter-spacing="3">SEARCH &amp; RIDDLES</text>
</svg>
