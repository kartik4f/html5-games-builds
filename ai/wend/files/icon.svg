<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fa6f5"/>
      <stop offset="100%" stop-color="#5f85ea"/>
    </linearGradient>
    <linearGradient id="letterRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#e0455e"/>
    </linearGradient>
    <linearGradient id="playYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgBlue)"/>

    <!-- soft decorative circles, echoing the home screen backdrop -->
    <circle cx="430" cy="70" r="150" fill="#ffffff" opacity="0.12"/>
    <circle cx="60" cy="470" r="120" fill="#ffffff" opacity="0.10"/>
    <circle cx="120" cy="120" r="16" fill="#ffffff" opacity="0.18"/>
    <circle cx="410" cy="410" r="12" fill="#ffffff" opacity="0.18"/>

    <!-- bold W mark -->
    <text x="256" y="330" text-anchor="middle"
          font-family="'Baloo 2','Fredoka',cursive,sans-serif"
          font-size="300" font-weight="800"
          fill="url(#letterRed)" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"
          paint-order="stroke fill">W</text>

    <!-- playful play-button badge, bottom right -->
    <circle cx="392" cy="392" r="58" fill="url(#playYellow)" stroke="#ffffff" stroke-width="8"/>
    <path d="M375 366 L420 392 L375 418 Z" fill="#1e3a8a"/>
  </g>
</svg>
