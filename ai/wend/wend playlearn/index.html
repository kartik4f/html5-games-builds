<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WEND - Inclusive Word Finder & Riddles</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap"
    rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
      --wf-font-scale: 1.4;
    }

    #font-loader-probe {
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
      pointer-events: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      margin: 0 auto;
      touch-action: none;
      -ms-touch-action: none;
    }

    #orientation-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Baloo 2', cursive, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    @keyframes wf-rotate-phone {
      0% {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(90deg) scale(1.15);
      }

      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    .wf-rotate-icon-wrap {
      font-size: 72px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: wf-rotate-phone 2s ease-in-out infinite;
    }

    .wf-static-icon-wrap {
      font-size: 72px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: none;
    }

    .wf-dom {
      position: absolute;
      box-sizing: border-box;
    }

    .wf-dom,
    .wf-dom * {
      font-family: 'Baloo 2', 'Fredoka', cursive, sans-serif;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    @keyframes wf-pop-in {
      0% {
        transform: scale(.4) rotate(-6deg);
        opacity: 0;
      }

      65% {
        transform: scale(1.08) rotate(2deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .wf-pop-in {
      animation: wf-pop-in .38s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes wf-coin-bounce {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.28) rotate(6deg);
        filter: brightness(1.3);
      }

      100% {
        transform: scale(1);
      }
    }

    .wf-coin-anim {
      animation: wf-coin-bounce 0.4s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes wf-float-up {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 1;
      }

      100% {
        transform: translateY(-45px) scale(1.2);
        opacity: 0;
      }
    }

    .wf-floating-number {
      position: absolute;
      font-weight: 800;
      color: #facc15;
      font-size: calc(34px * var(--wf-font-scale));
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      animation: wf-float-up 0.9s ease-out forwards;
      z-index: 999;
    }

    @keyframes wf-shine {

      0%,
      55% {
        left: -60%;
      }

      100% {
        left: 130%;
      }
    }

    .wf-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      border: 4px solid #ffffff;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 28px;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
      transition: transform .09s ease, box-shadow .09s ease;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.22);
      font-size: calc((var(--base-btn-size, 32px)) * var(--wf-font-scale));
    }

    .wf-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.6);
      box-shadow: none;
      transform: none !important;
    }

    .wf-btn-attention::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .65), transparent);
      transform: skewX(-18deg);
      animation: wf-shine 2.8s ease-in-out infinite;
    }

    .wf-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-3px) scale(1.02);
    }

    .wf-btn:active:not(:disabled) {
      transform: translateY(4px) scale(.96);
      filter: brightness(.95);
    }

    .wf-btn .wf-btn-icon {
      width: 1.4em;
      height: 1.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .wf-card {
      border-radius: 36px;
      cursor: pointer;
      transition: transform .18s cubic-bezier(.34, 1.56, .64, 1);
    }

    .wf-card.wf-static {
      cursor: default;
    }

    .wf-word-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-height: 250px;
      overflow-y: auto;
      padding: 4px;
    }

    .wf-word-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 999px;
      padding: 6px 20px;
      height: 56px;
      font-weight: 800;
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.1);
      transition: all .25s ease;
    }

    .wf-word-row .wf-word-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .wf-word-row .wf-word-text {
      font-size: calc(30px * var(--wf-font-scale));
      letter-spacing: 1px;
    }

    .wf-word-row .wf-word-check {
      width: 26px;
      height: 26px;
      display: flex;
      opacity: 0;
      transform: scale(.4);
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    .wf-word-row.wf-found {
      background: #22c55e !important;
      color: #ffffff !important;
      border-color: #ffffff !important;
    }

    .wf-word-row.wf-found .wf-word-text {
      text-decoration: line-through;
      color: #ffffff !important;
    }

    .wf-word-row.wf-found .wf-word-check {
      opacity: 1;
      transform: scale(1);
      color: #ffffff !important;
    }

    /* "Learn more" info button on a word row - stays invisible/inert until
       the word is actually found, so nothing is spoiled (especially with
       a masked riddle answer). */
    .wf-word-row .wf-word-info {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0;
      transform: scale(.4);
      pointer-events: none;
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }

    .wf-word-row.wf-found .wf-word-info {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .wf-word-row.wf-found .wf-word-info:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .wf-powerup-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-top: 10px;
    }

    .wf-powerup-btn {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 32px;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border: 6px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.2);
      transition: transform .1s ease;
    }

    .wf-powerup-btn:active {
      transform: translateY(6px) scale(0.95);
    }

    .wf-powerup-count {
      position: absolute;
      top: -15px;
      right: -15px;
      background: #ef4444;
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      border-radius: 999px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #ffffff;
    }

    /* Shown instead of a "0" once a powerup runs out - green + a play icon
       to make it obvious this is now a "watch an ad for +2" button rather
       than just a dead/disabled control. */
    .wf-powerup-count-ad {
      background: #22c55e;
      animation: wf-timer-pulse-warn 1.2s ease-in-out infinite;
    }

    .wf-powerup-label {
      font-size: calc(23px * var(--wf-font-scale));
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
    }

    .wf-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 20px;
      background: #253356;
      border: 3px solid #475b8a;
      border-radius: 18px;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }

    .wf-setting-label {
      font-size: calc(28px * var(--wf-font-scale));
      font-weight: 800;
      color: #ffffff;
    }

    .wf-toggle {
      padding: 6px 20px;
      border-radius: 999px;
      font-size: calc(26px * var(--wf-font-scale));
      font-weight: 800;
      border: 3px solid #ffffff;
      cursor: pointer;
    }

    /* Age Group picker - a real dropdown showing every option at once,
       instead of the old "tap to cycle through ages blindly" button. */
    .wf-age-select {
      padding: 10px 16px;
      border-radius: 999px;
      font-size: calc(24px * var(--wf-font-scale));
      font-weight: 800;
      font-family: 'Baloo 2', 'Fredoka', cursive, sans-serif;
      border: 3px solid #ffffff;
      background: #3b82f6;
      color: #ffffff;
      cursor: pointer;
      appearance: auto;
      max-width: 320px;
    }

    .wf-age-select option {
      font-family: 'Baloo 2', 'Fredoka', cursive, sans-serif;
      font-weight: 700;
      background: #1e2942;
      color: #ffffff;
    }

    /* Small corner close "X" for popups whose only other actions are a
       forced choice (Retry/Next Level, or one of the utility icons) - so
       there's still a conventional, always-available way to dismiss. */
    .wf-modal-close-x {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: background .15s ease;
    }

    .wf-modal-close-x:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Brief, non-blocking message - replaces native alert(), which is
       silently ignored in a sandboxed iframe with no allow-modals flag
       (the exact environment this game is deployed in). */
    .wf-toast-msg {
      padding: 16px 32px;
      border-radius: 999px;
      color: #ffffff;
      font-size: calc(24px * var(--wf-font-scale));
      font-weight: 800;
      text-align: center;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.25), 0 0 20px rgba(0, 0, 0, 0.3);
      border: 3px solid #ffffff;
      animation: wf-toast-inout 2.2s ease forwards;
      white-space: nowrap;
    }

    @keyframes wf-toast-inout {
      0% {
        transform: translateY(-20px) scale(.8);
        opacity: 0;
      }

      12% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      82% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateY(-10px) scale(.95);
        opacity: 0;
      }
    }

    /* Win popup: earned stars fly in one at a time and land in their
       outlined slot instead of every star just appearing filled at once. */
    .wf-flying-star {
      position: fixed;
      z-index: 30000;
      pointer-events: none;
      transition: transform .55s cubic-bezier(.34, 1.56, .64, 1), opacity .3s ease;
      filter: drop-shadow(0 0 10px rgba(250, 204, 21, .8));
    }

    .wf-star-slot.wf-star-pop {
      animation: wf-star-pop .4s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes wf-star-pop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.5);
      }

      100% {
        transform: scale(1);
      }
    }

    .wf-tts-btn {
      background: #facc15;
      border: 3px solid #ffffff;
      border-radius: 50%;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      color: #1e3a8a;
    }

    .wf-grid-btn {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
      transition: transform .12s ease;
      padding: 6px;
    }

    .wf-grid-btn.wf-locked {
      background: linear-gradient(180deg, #334155, #1e293b);
      opacity: 0.6;
      cursor: not-allowed;
    }

    .wf-grid-btn:hover:not(.wf-locked) {
      transform: translateY(-4px) scale(1.05);
      filter: brightness(1.1);
    }

    .wf-grid-btn-num {
      font-size: calc(40px * var(--wf-font-scale));
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
    }

    .wf-modal-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 3px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      text-align: center;
      background: inherit;
    }

    .wf-modal-title {
      font-size: calc(48px * var(--wf-font-scale));
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .wf-modal-subtitle {
      font-size: calc(26px * var(--wf-font-scale));
      color: #cbd5e1;
      margin-top: 4px;
    }

    .wf-confetti {
      position: absolute;
      top: 0;
      border-radius: 4px;
      animation: wf-confetti-fall linear forwards;
      pointer-events: none;
    }

    @keyframes wf-confetti-fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(640px) rotate(540deg);
        opacity: 0;
      }
    }

    /* Circular countdown timer - builds visible pressure as time runs low
   instead of a static pill. Calm green early, amber warning under 15s
   (gentle pulse), urgent red under 5s (fast pulse + shake). */
    .wf-timer-ring-wrap {
      transform-origin: center center;
    }

    .wf-timer-ring-wrap.wf-timer-warn {
      animation: wf-timer-pulse-warn 1s ease-in-out infinite;
    }

    .wf-timer-ring-wrap.wf-timer-critical {
      animation: wf-timer-pulse-critical .45s ease-in-out infinite, wf-timer-shake .45s ease-in-out infinite;
    }

    @keyframes wf-timer-pulse-warn {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes wf-timer-pulse-critical {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.16);
      }
    }

    @keyframes wf-timer-shake {

      0%,
      100% {
        transform: translateX(0) scale(1.1);
      }

      25% {
        transform: translateX(-3px) scale(1.1);
      }

      75% {
        transform: translateX(3px) scale(1.1);
      }
    }

    /* Big single animated PLAY button - a large glowing circular FAB instead
   of the old icon+text pill, since it's the primary call-to-action. */
    .wf-play-fab-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wf-play-fab-pulse {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 4px solid #fde047;
      animation: wf-play-fab-ring 1.8s ease-out infinite;
      z-index: 1;
      pointer-events: none;
    }

    .wf-play-fab-pulse.wf-play-fab-pulse-2 {
      animation-delay: .9s;
    }

    .wf-play-fab {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 6px solid #ffffff;
      background: linear-gradient(180deg, #fde047, #eab308);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 0 rgba(0, 0, 0, 0.25), 0 0 40px rgba(250, 204, 21, 0.5);
      position: relative;
      z-index: 2;
      animation: wf-play-fab-bounce 1.6s ease-in-out infinite;
      padding: 0;
    }

    .wf-play-fab:active {
      transform: translateY(6px);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25), 0 0 40px rgba(250, 204, 21, 0.5);
    }

    .wf-play-fab svg,
    .wf-play-fab i {
      margin-left: 8px;
      /* optical centering for the play triangle */
    }

    @keyframes wf-play-fab-bounce {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }
    }

    @keyframes wf-play-fab-ring {
      0% {
        transform: scale(1);
        opacity: .7;
      }

      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }
  </style>

  <script src="/uploads/sdk/playlearn-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>
  <div id="font-loader-probe">
    <span style="font-family: 'Baloo 2', cursive; font-weight: 800;">Baloo 2 Probe</span>
    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700;">Fredoka Probe</span>
  </div>

  <div id="orientation-overlay" style="display: none;">
    <div id="overlay-icon-container" class="wf-rotate-icon-wrap">
      <i data-lucide="smartphone-nfc" style="width: 64px; height: 64px; stroke: #facc15;"></i>
    </div>
    <h2 id="overlay-title" style="font-size: 44px; margin: 0 0 10px 0; color: #facc15;">Please Rotate Your Device</h2>
    <p id="overlay-desc"
      style="font-size: 28px; max-width: 420px; color: #cbd5e1; line-height: 1.4; margin-bottom: 24px;">This game is
      designed to be played in portrait mode.</p>
    <button id="fullscreen-overlay-btn" class="wf-btn"
      style="width: 320px; height: 75px; background: linear-gradient(180deg, #fde047, #eab308); font-size: 38px; color: #1e3a8a; border: 4px solid #ffffff;">
      <span id="overlay-btn-text">OK</span>
    </button>
  </div>

  <div id="game-container"></div>

  <script>
    "use strict";

    const W = 1080;
    const H = 1920;
    const MODE = { CLASSIC: "classic", BUILDER: "builder" };
    const BLOCK_TILE = "■";
    const AGE = { UNDER_8: "under8", EIGHT_TO_12: "eightTo12", TEENS: "teens", ADULTS: "adults" };
    const AGE_LABELS = {
      [AGE.UNDER_8]: "KIDS (UNDER 8)",
      [AGE.EIGHT_TO_12]: "JUNIORS (8-12)",
      [AGE.TEENS]: "TEENS (13-17)",
      [AGE.ADULTS]: "ADULTS (18+)"
    };

    const DIRS = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];

    let JSON_DATA = {
      "difficulties": {
        "1": { "name": "Very Easy", "rows": 5, "cols": 5, "words": 3, "blocks": 1 },
        "2": { "name": "Easy", "rows": 6, "cols": 6, "words": 4, "blocks": 2 },
        "3": { "name": "Medium", "rows": 7, "cols": 7, "words": 5, "blocks": 3 },
        "4": { "name": "Hard", "rows": 8, "cols": 8, "words": 6, "blocks": 4 },
        "5": { "name": "Expert", "rows": 9, "cols": 9, "words": 7, "blocks": 5 },
        "6": { "name": "Master", "rows": 10, "cols": 10, "words": 8, "blocks": 6 }
      },
      "wordPools": {
        "under8": {
          "EASY": [
            { "word": "CAT", "category": "ANIMALS", "icon": "cat", "definition": "A small domesticated carnivorous mammal." },
            { "word": "DOG", "category": "ANIMALS", "icon": "dog", "definition": "A domesticated carnivorous mammal." },
            { "word": "SUN", "category": "NATURE", "icon": "sun", "definition": "The star around which the earth orbits." },
            { "word": "HAT", "category": "CLOTHES", "icon": "shirt", "definition": "A shaped covering for the head." },
            { "word": "BALL", "category": "TOYS", "icon": "disc", "definition": "A rounded object used in games." }
          ],

      // resumeFromOverlayPause() on the live GameScene - i.e. it could
      // this.scene.pause() the ENTIRE game and set isPausedByOverlay=true,
      // which every pointer/touch handler checks and bails out on. That
      // was already the cause of one confirmed "unplayable" bug (a
      // fullscreen requirement unsatisfiable in PlayLearn's sandboxed
      // iframe). Since this function also runs on "resize" - which mobile
      // browsers fire constantly just from the address bar showing/hiding
      // on scroll, completely unrelated to actual rotation - any transient
      // misfire here could silently pause the game with zero visible
      // indication if the overlay's own display state ever desynced from

      // or hides based on orientation and nothing else. When visible, it's

      // z-index), so it already physically blocks touches from reaching
      // the canvas underneath - no separate JS-driven scene pause is
      // needed for that, and removing it eliminates an entire class of
      // "game randomly stops responding to touch" bugs.
      if (!isGameLoaded || !isMobileDevice()) {
        overlay.style.display = "none";
        return;

    // Animates a counter element's displayed number from whatever it
    // currently shows up (or down) to `toVal`, instead of the value just
    // instantly jumping - used for every coin counter in the game.
    function animateCounterEl(el, toVal, duration = 600) {
      if (!el) return;
      const fromVal = parseInt(el.textContent, 10) || 0;
      if (fromVal === toVal) { el.textContent = toVal; return; }
      const start = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
        const val = Math.round(fromVal + (toVal - fromVal) * eased);
        el.textContent = val;
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = toVal;
      };
      requestAnimationFrame(step);
    }

    function generateShapeBlocks(grid, p) {
      if (p.blocks <= 0) return;
      const shapeKey = seededChoice(["U", "L", "C", "E", "F", "S", "Z"]);
      let shapeCoords = WALL_SHAPES[shapeKey];
      const rotation = seededRnd(0, 3);
      for (let r = 0; r < rotation; r++) shapeCoords = shapeCoords.map(([x, y]) => [2 - y, x]);
      if (seededRnd(0, 1) === 1) shapeCoords = shapeCoords.map(([x, y]) => [2 - x, y]);
      if (seededRnd(0, 1) === 1) shapeCoords = shapeCoords.map(([x, y]) => [x, 2 - y]);

      const maxOffsetR = p.rows - 3, maxOffsetC = p.cols - 3;
      if (maxOffsetR < 0 || maxOffsetC < 0) return;
      const offsetR = seededRnd(0, maxOffsetR), offsetC = seededRnd(0, maxOffsetC);

      let placedCount = 0;
      for (let [dx, dy] of shapeCoords) {
        const r = offsetR + dy, c = offsetC + dx;
        if (r < p.rows && c < p.cols && grid[r][c] === null) {
          grid[r][c] = BLOCK_TILE; placedCount++;
          if (placedCount >= p.blocks) break;
        }
      }
      while (placedCount < p.blocks) {
        const br = seededRnd(0, p.rows - 1), bc = seededRnd(0, p.cols - 1);
        if (grid[br][bc] === null) { grid[br][bc] = BLOCK_TILE; placedCount++; }
      }
    }

    function placeSnakingWord(grid, p, word) {
      for (let attempt = 0; attempt < 300; attempt++) {
        const startR = seededRnd(0, p.rows - 1), startC = seededRnd(0, p.cols - 1);
        if (grid[startR][startC] !== null) continue;

        const path = [[startC, startR]];
        let currentR = startR, currentC = startC, success = true;

        for (let i = 1; i < word.length; i++) {
          const neighbors = seededShuffle(DIRS).map(d => ({ r: currentR + d.dy, c: currentC + d.dx }))
            .filter(n => n.r >= 0 && n.r < p.rows && n.c >= 0 && n.c < p.cols && grid[n.r][n.c] === null && !path.some(pt => pt[0] === n.c && pt[1] === n.r));

          if (neighbors.length === 0) { success = false; break; }
          const next = neighbors[0];
          path.push([next.c, next.r]);
          currentR = next.r; currentC = next.c;
        }

        if (success && path.length === word.length) {
          path.forEach(([cc, cr], idx) => grid[cr][cc] = word[idx]);
          return path;
        }
      }
      return null;
    }

    function generateLevel(age, level, mode, difficulty) {
      let ageOffset = 1;
      if (age === AGE.EIGHT_TO_12) ageOffset = 2;
      if (age === AGE.TEENS) ageOffset = 3;
      if (age === AGE.ADULTS) ageOffset = 4;

      seed = (level * 10007) + (difficulty * 1337) + (ageOffset * 503) + (mode.length * 97);

      const p = JSON_DATA.difficulties[difficulty.toString()] || JSON_DATA.difficulties["1"];
      const pool = JSON_DATA.wordPools[age] || JSON_DATA.wordPools.under8;

      let subPoolKeys = ["EASY"];
      if (difficulty >= 3) subPoolKeys.push("MEDIUM");
      if (difficulty >= 4) subPoolKeys.push("HARD");

      let combinedWords = [];
      subPoolKeys.forEach(key => {
        if (pool && pool[key]) combinedWords = combinedWords.concat(pool[key]);
      });

      if (combinedWords.length === 0 && JSON_DATA.wordPools.under8.EASY) {
        combinedWords = JSON_DATA.wordPools.under8.EASY;
      }

      const uniquePool = [];
      const seenWords = new Set();
      combinedWords.forEach(item => {
        if (!seenWords.has(item.word)) {
          seenWords.add(item.word);
          uniquePool.push(item);
        }
      });

      let quiz = null;
      const includeRiddle = (mode === MODE.CLASSIC && (level % 2 === 0 || difficulty >= 3));
      if (includeRiddle) {
        const validQuizzes = JSON_DATA.quizzes ? JSON_DATA.quizzes.filter(q => q.minDiff <= difficulty) : [];
        quiz = seededChoice(validQuizzes.length > 0 ? validQuizzes : JSON_DATA.quizzes);
      }

      let forced = null;
      if (quiz) {
        forced = { word: quiz.answer, category: "RIDDLE", icon: quiz.icon, isQuizWord: true };
      }

      const shuffledPool = seededShuffle(uniquePool);
      const targetCount = Math.max(2, p.words - (forced ? 1 : 0));

      const chosen = (forced ? [forced] : []).concat(
        shuffledPool.filter(w => !forced || w.word !== forced.word).slice(0, targetCount)
      );

      const grid = Array.from({ length: p.rows }, () => Array(p.cols).fill(null));
      generateShapeBlocks(grid, p);

      const placements = [];
      for (let item of chosen) {
        const path = placeSnakingWord(grid, p, item.word);
        if (path) placements.push({ ...item, path });
      }

      for (let r = 0; r < p.rows; r++) {
        for (let c = 0; c < p.cols; c++) {
          if (!grid[r][c]) grid[r][c] = String.fromCharCode(65 + seededRnd(0, 25));
        }
      }

      return { profile: p, grid, placements, mode, quiz };
    }

        const dom = this.add.dom(x - w / 2, y - h / 2).createFromHTML(wrapped).setOrigin(0, 0);

      openHtmlModal(w, h, innerHTML, opts = {}) {

            border-radius:${opts.radius || 36}px; box-shadow:0 14px 0 rgba(0,0,0,.12);
            display:flex; flex-direction:column; align-items:center; justify-content:${opts.justify || "flex-start"};
            padding:${opts.padding ?? 24}px; overflow:hidden;
          ">${innerHTML}</div>`;
        return this.domCenter(x, y, w, h, html, "", opts.depth ?? 50);
      }

      confettiBurst(x, y, count = 30) {
        if (State.quietMode) return;
        // Deferred to the next tick for the same reason as
        // handleCoinUpdateEvent below: this creates a real DOM subtree
        // (up to 30 child divs) via domCenter(), and it used to happen
        // synchronously inside the touchend/pointerup call stack on every
        // single word found. That's a much bigger synchronous DOM write
        // than the coin counter ever was, and an even stronger candidate
        // for the "drag breaks after the first word, only on touch"
        // symptom - so it now runs after the touch event has fully
        // finished and control has returned to the browser.
        setTimeout(() => {
          const t = theme(); const colors = [t.primary, t.secondary, t.accent, t.success].map(hex);
          let html = "";
          for (let i = 0; i < count; i++) {
            const dx = Math.floor(Math.random() * 560 - 280), dur = Math.floor(Math.random() * 700 + 900), size = Math.floor(Math.random() * 10 + 10);
            html += `<div class="wf-confetti" style="left:${dx + 280}px; width:${size}px; height:${size * 0.6}px; background:${colors[Math.floor(Math.random() * colors.length)]}; animation-duration:${dur}ms;"></div>`;
          }
          const dom = this.domCenter(x, y, 560, 640, `<div style="position:relative;width:100%;height:100%;">${html}</div>`, "", 9999);
          this.time.delayedCall(2000, () => dom.destroy());
        }, 0);
      }

      // Moved here from HomeScene so it can be opened correctly from ANY
      // scene (e.g. GameScene's in-game accessibility button). Calling
      // homeScene.openSettingsModal() from another scene ran this method
      // with `this` bound to the Home scene instance, so this.scene.pause()
      // paused Home (usually already inactive - a no-op) instead of
      // whichever scene was actually visible, leaving that scene's own
      // buttons live and clickable underneath the modal. Being a normal
      // `this.openSettingsModal()` call now, it always pauses/resumes the
      // caller's own scene.
      openSettingsModal() {
        const html = `
          <div style="width:100%; height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden;">
            <div style="flex-shrink:0; padding:32px 32px 10px 32px; width:100%; box-sizing:border-box; background:#1e2942; z-index:2;">
              <div class="wf-modal-header" style="margin-bottom:0;">
                <div class="wf-modal-title">SETTINGS</div>
                <div class="wf-modal-subtitle">Age group, audio & ad preferences</div>
              </div>
            </div>

            <div style="flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:10px 32px 110px 32px; display:flex; flex-direction:column; align-items:center; width:100%; box-sizing:border-box;">
              <div style="width:100%; display:flex; flex-direction:column; gap:10px;">
                <div class="wf-setting-row"><span class="wf-setting-label">Sound FX</span><button class="wf-toggle" id="toggle-sfx" style="background:${State.sfx ? '#22c55e' : '#ef4444'}; color:#fff;">${State.sfx ? 'ON' : 'OFF'}</button></div>
                <div class="wf-setting-row"><span class="wf-setting-label">Background Music</span><button class="wf-toggle" id="toggle-bgm" style="background:${State.bgm ? '#22c55e' : '#ef4444'}; color:#fff;">${State.bgm ? 'ON' : 'OFF'}</button></div>
                <div class="wf-setting-row"><span class="wf-setting-label">Tap-To-Select Mode</span><button class="wf-toggle" id="toggle-tap" style="background:${State.tapToSelect ? '#22c55e' : '#ef4444'}; color:#fff;">${State.tapToSelect ? 'ON' : 'OFF'}</button></div>
                <div class="wf-setting-row"><span class="wf-setting-label">Colorblind Mode</span><button class="wf-toggle" id="toggle-cb" style="background:${State.colorblindMode ? '#22c55e' : '#ef4444'}; color:#fff;">${State.colorblindMode ? 'ON' : 'OFF'}</button></div>
                <div class="wf-setting-row"><span class="wf-setting-label">High Contrast Mode</span><button class="wf-toggle" id="toggle-hc" style="background:${State.highContrast ? '#22c55e' : '#ef4444'}; color:#fff;">${State.highContrast ? 'ON' : 'OFF'}</button></div>
                <div class="wf-setting-row"><span class="wf-setting-label">Ads Enabled (IAP Switch)</span><button class="wf-toggle" id="toggle-ads" style="background:${State.adsEnabled && !State.isPremium ? '#22c55e' : '#334155'}; color:#fff;">${State.isPremium ? 'PREMIUM (NO ADS)' : (State.adsEnabled ? 'ON' : 'OFF')}</button></div>
              </div>
            </div>

            <div style="position:absolute; bottom:0; left:0; width:100%; background:linear-gradient(180deg, rgba(30,41,66,0), #1e2942 30%); padding:16px 32px 24px 32px; display:flex; gap:14px; justify-content:center; box-sizing:border-box; z-index:10;">
              <button class="wf-btn" id="settings-reset" style="flex:1; height:72px; background:linear-gradient(180deg, #64748b, #334155); --base-btn-size: 20px; color:#fff;">RESET TO DEFAULT</button>
              <button class="wf-btn" id="settings-close" style="flex:1; height:72px; background:linear-gradient(180deg, #fde047, #eab308); --base-btn-size: 24px; color:#1e3a8a;">SAVE & BACK</button>
            </div>
          </div>`;

        const modal = this.openHtmlModal(960, 1080, html, { depth: 9999, bg: "#1e2942", border: "#475b8a", padding: 0 });

        const bindToggle = (id, stateProp, onToggle) => {
          const btn = modal.node.querySelector(id);
          if (btn) {
            btn.addEventListener("click", () => {
              State[stateProp] = !State[stateProp];
              btn.textContent = State[stateProp] ? 'ON' : 'OFF';
              btn.style.background = State[stateProp] ? '#22c55e' : '#ef4444';
              AudioEngine.click(); AudioEngine.unlock(); if (onToggle) onToggle();
            });
          }
        };


        const adsBtn = modal.node.querySelector("#toggle-ads");
        if (adsBtn) {
          adsBtn.addEventListener("click", () => {
            if (State.isPremium) {
              State.isPremium = false; State.adsEnabled = true;
              adsBtn.textContent = 'ON'; adsBtn.style.background = '#22c55e';
            } else if (State.adsEnabled) {
              State.adsEnabled = false;
              adsBtn.textContent = 'OFF'; adsBtn.style.background = '#ef4444';
            } else {
              State.isPremium = true; State.adsEnabled = false;
              adsBtn.textContent = 'PREMIUM (NO ADS)'; adsBtn.style.background = '#334155';
            }
            AudioEngine.click(); AudioEngine.unlock();
          });
        }

        bindToggle("#toggle-sfx", "sfx");
        bindToggle("#toggle-bgm", "bgm", () => AudioEngine.startBGM());
        bindToggle("#toggle-tap", "tapToSelect");
        bindToggle("#toggle-cb", "colorblindMode");
        // Used to call this.scene.restart() here, which threw away the
        // whole in-progress level just to pick up a border-thickness
        // change. High Contrast is the only toggle that needs any visual
        // refresh at all (colorblind mode's pattern only shows on an
        // actively-selected tile, so it naturally applies on the next
        // selection with no refresh needed) - and refreshBoardTheme()
        // repaints in place instead of regenerating the level, so board
        // progress, found words, timer and score are all preserved.
        bindToggle("#toggle-hc", "highContrast", () => {
          if (this.scene.key === "GameScene" && typeof this.refreshBoardTheme === "function") {
            this.refreshBoardTheme();
          }
        });

        // Resets every setting shown on this screen back to its default.
        // Doesn't touch progress, coins, or powerups; this is scoped to
        // preferences, not a full account wipe. Age group now lives on
        // Home itself (see drawHomeMenu), but it's still reset here as
        // part of "every preference back to default" - just tracked
        // separately since this modal no longer has its own age control
        // to compare against on close.
        modal.node.querySelector("#settings-reset").addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          // Native confirm() is silently ignored (no allow-modals in this
          // sandboxed iframe) - it never shows anything and immediately
          // returns undefined, so "if (!confirm(...)) return;" was always
          // treating that as a cancel and the button did nothing at all.
          this.showConfirmModal("Reset all settings to their defaults?", () => {
            const ageBeforeReset = State.age;
            State.age = AGE.UNDER_8;
            State.sfx = true;
            State.bgm = true;
            State.tapToSelect = false;
            State.colorblindMode = false;
            State.highContrast = false;
            State.isPremium = false;
            State.adsEnabled = true;
            AudioEngine.startBGM();
            if (this.scene.key === "GameScene" && typeof this.refreshBoardTheme === "function") {
              this.refreshBoardTheme();
            }
            modal.destroy();
            if (this.scene.key === "Home" && State.age !== ageBeforeReset) {
              this.scene.restart();
            } else {
              this.openSettingsModal();
            }
          }, { title: "Reset Settings?", confirmLabel: "RESET" });
        });

        // Closing Settings no longer restarts the scene - every relevant
        // change already applies live (the toggles above).
        modal.node.querySelector("#settings-close").addEventListener("click", () => {
          modal.destroy();
        });
      }

      // Also moved from HomeScene to BaseScene (same reasoning as
      // openSettingsModal above) so GameScene's win/fail popups can open
      // the Level Grid directly via this.openHistoryTracker() instead of
      // reaching into the Home scene instance.
      // Shared "more options" row used on both the win (level clear) and
      // fail (time up) popups: Accessibility Settings, Switch Mode, Level
      // Grid, and Home - so a player isn't limited to just "next"/"retry"
      // and has to back out to Home manually to reach any of these.
      postLevelExtrasHTML() {
        return `
          <div style="display:flex; gap:14px; margin-top:6px;">
            <button class="wf-btn" id="eol-accessibility" style="width:66px; height:66px; padding:0; background:linear-gradient(180deg, #f43f5e, #be123c); color:#ffffff;" title="Accessibility Settings">
              ${miniIconHTML("user", 28, "#ffffff")}
            </button>
            <button class="wf-btn" id="eol-mode" style="width:66px; height:66px; padding:0; background:linear-gradient(180deg, #a855f7, #7e22ce); color:#ffffff;" title="Switch Mode">
              ${miniIconHTML("gamepad-2", 28, "#ffffff")}
            </button>
            <button class="wf-btn" id="eol-levelgrid" style="width:66px; height:66px; padding:0; background:linear-gradient(180deg, #38bdf8, #0284c7); color:#ffffff;" title="Level Grid">
              ${miniIconHTML("grid", 28, "#ffffff")}
            </button>
            <button class="wf-btn" id="eol-home" style="width:66px; height:66px; padding:0; background:linear-gradient(180deg, #64748b, #334155); color:#ffffff;" title="Home">
              ${miniIconHTML("home", 28, "#ffffff")}
            </button>
          </div>`;
      }

      bindPostLevelExtras(modal) {
        const acc = modal.node.querySelector("#eol-accessibility");
        if (acc) acc.addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          modal.destroy();
          this.openInGameAccessibility();
        });

        const modeBtn = modal.node.querySelector("#eol-mode");
        if (modeBtn) modeBtn.addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          modal.destroy();
          State.mode = (State.mode === MODE.CLASSIC) ? MODE.BUILDER : MODE.CLASSIC;
          this.scene.restart();
        });

        const grid = modal.node.querySelector("#eol-levelgrid");
        if (grid) grid.addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          modal.destroy();
          this.openHistoryTracker();
        });

        const home = modal.node.querySelector("#eol-home");
        if (home) home.addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          modal.destroy();
          this.scene.start("Home");
        });
      }

      openHistoryTracker() {
        this.openLevelGridModal(9999, State.difficulty, {
          title: "LEVEL SELECT",
          subtitle: "Pick a difficulty, then jump into any unlocked level",
          startGame: () => this.scene.start("GameScene")
        });
      }

      openLevelGridModal(depth, selectedDiff, opts = {}, selectedAge = State.age) {
        let currentDiff = (selectedDiff >= 1 && selectedDiff <= 6) ? selectedDiff : State.difficulty;
        let currentAge = selectedAge;
        const title = opts.title || "LEVEL SELECT";
        const subtitle = opts.subtitle || "Pick a difficulty, then jump into any unlocked level";
        const startGame = opts.startGame || (() => this.scene.start("GameScene"));

        // Remembers scroll position per age+difficulty combo across tab
        // switches within this modal (and across re-opens, since it's kept
        // on the scene instance) so hopping between tabs doesn't reset you
        // back to the top of the grid every time.
        if (!this._levelGridScroll) this._levelGridScroll = {};

        // Builds just the modal's inner content for a given age+difficulty
        // - called once for the initial open, then again in place on every
        // tab switch instead of tearing down and recreating the whole
        // popup (which used to replay the pop-in animation and cycle
        // scene pause/resume on every tab click).
        const buildContent = (age, diff) => {
          const ageOrder = [AGE.UNDER_8, AGE.EIGHT_TO_12, AGE.TEENS, AGE.ADULTS];
          const ageTabsHTML = ageOrder.map(a => {
            const isActive = a === age;
            const shortLabel = (AGE_LABELS[a] || a).split(" (")[0];
            return `
              <button class="wf-lg-age-tab" data-tab-age="${a}"
                style="flex:1; min-width:0; padding:10px 4px; border-radius:14px; border:2px solid ${isActive ? "#38bdf8" : "#475b8a"};
                       background:${isActive ? "#38bdf8" : "#253356"}; color:#fff;
                       font-weight:800; font-size:calc(22px * var(--wf-font-scale)); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${shortLabel}
              </button>`;
          }).join("");

          const diffs = JSON_DATA.difficulties;
          const tabsHTML = Object.keys(diffs).map(key => {
            const diffNum = parseInt(key, 10);
            const d = diffs[key];
            const unlocked = State.isDiffUnlocked(diffNum, age);
            const isActive = diffNum === diff;
            return `
              <button class="wf-lg-tab" data-tab-diff="${diffNum}" ${unlocked ? "" : "disabled"}
                style="flex:1; min-width:0; padding:11px 4px; border-radius:14px; border:2px solid ${isActive ? "#facc15" : "#475b8a"};
                       background:${isActive ? "#facc15" : "#253356"}; color:${isActive ? "#1e2942" : (unlocked ? "#fff" : "#64748b")};
                       font-weight:800; font-size:calc(23px * var(--wf-font-scale)); cursor:${unlocked ? "pointer" : "not-allowed"}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${unlocked ? d.name : "🔒"}
              </button>`;
          }).join("");

          const highestUnlocked = State.getHighestUnlockedLevelFor(diff, age);
          const currentLevel = State.getLevelFor(diff, age);
          const totalToShow = Math.min(Math.max(highestUnlocked + 4, 12), 30);

          let cellsHTML = "";
          for (let lvl = 1; lvl <= totalToShow; lvl++) {
            const unlocked = lvl <= highestUnlocked;
            const isCurrent = unlocked && lvl === currentLevel && diff === State.difficulty && age === State.age;
            cellsHTML += `
              <div class="wf-grid-btn ${unlocked ? "" : "wf-locked"}" data-level="${lvl}"
                   style="${isCurrent ? "outline:4px solid #facc15; outline-offset:3px;" : ""}">
                ${unlocked ? `<span class="wf-grid-btn-num">${lvl}</span>` : miniIconHTML("lock", 28, "#94a3b8")}
              </div>`;
          }

          return `
            <div style="width:100%; height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden;">
              <div style="flex-shrink:0; padding:24px 28px 10px 28px; width:100%; box-sizing:border-box; background:#1e2942; z-index:2;">
                <div class="wf-modal-header" style="margin-bottom:10px; padding-bottom:10px;">
                  <div class="wf-modal-title">${title}</div>
                  <div class="wf-modal-subtitle">${subtitle}</div>
                </div>

                <div style="display:flex; gap:6px; width:100%; flex-shrink:0; margin-bottom:10px;">${ageTabsHTML}</div>
                <div style="display:flex; gap:8px; width:100%; flex-shrink:0;">${tabsHTML}</div>
              </div>

              <div id="lg-scroll" style="flex:1; overflow-y:auto; overflow-anchor:none; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:10px 28px 110px 28px; display:flex; flex-direction:column; align-items:center; width:100%; box-sizing:border-box;">
                <div id="grid-container" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; width:100%; padding:10px; justify-items:center;">
                  ${cellsHTML}
                </div>
              </div>

              <div style="position:absolute; bottom:0; left:0; width:100%; background:linear-gradient(180deg, rgba(30,41,66,0), #1e2942 30%); padding:16px 28px 24px 28px; display:flex; justify-content:center; box-sizing:border-box; z-index:10;">
                <button class="wf-btn" id="hist-close" style="width:320px; height:70px; background:linear-gradient(180deg, #fde047, #eab308); --base-btn-size: 24px; color:#1e3a8a;">CLOSE</button>
              </div>
            </div>`;
        };

        const modal = this.openHtmlModal(980, 1180, buildContent(currentAge, currentDiff), { depth: depth || 9999, bg: "#1e2942", border: "#475b8a", padding: 0 });
        const box = modal.contentRoot || modal.node.firstElementChild;

        const bindContent = () => {
          const scrollEl = modal.node.querySelector("#lg-scroll");
          const scrollKey = `${currentAge}_${currentDiff}`;
          if (scrollEl && this._levelGridScroll[scrollKey]) {
            // Restoring scrollTop on the same tick the new content was
            // inserted can fight with the browser's own layout pass and
            // visibly jump/shift the popup - waiting a frame lets layout
            // settle first.
            requestAnimationFrame(() => { scrollEl.scrollTop = this._levelGridScroll[scrollKey]; });
          }

          const switchTab = (newAge, newDiff) => {
            const oldScrollEl = modal.node.querySelector("#lg-scroll");
            if (oldScrollEl) this._levelGridScroll[`${currentAge}_${currentDiff}`] = oldScrollEl.scrollTop;
            // A tab button can still hold browser focus after being
            // clicked; some browsers try to keep a focused element in view
            // and will auto-scroll the page when it's removed from the DOM
            // (which innerHTML replacement does) - blurring first avoids
            // that entirely.
            if (document.activeElement && typeof document.activeElement.blur === "function") {
              document.activeElement.blur();
            }
            currentAge = newAge; currentDiff = newDiff;
            box.innerHTML = buildContent(currentAge, currentDiff);
            refreshIcons();
            bindContent();
          };

          modal.node.querySelectorAll(".wf-lg-age-tab").forEach(tab => {
            tab.addEventListener("click", () => {
              const age = tab.getAttribute("data-tab-age");
              if (age === currentAge) return;
              AudioEngine.click(); AudioEngine.unlock();
              switchTab(age, SessionStore.getSelectedDifficulty(age));
            });
          });

          modal.node.querySelectorAll(".wf-lg-tab").forEach(tab => {
            if (tab.disabled) return;
            tab.addEventListener("click", () => {
              const diffNum = parseInt(tab.getAttribute("data-tab-diff"), 10);
              AudioEngine.click(); AudioEngine.unlock();
              switchTab(currentAge, diffNum);
            });
          });

          modal.node.querySelectorAll(".wf-grid-btn:not(.wf-locked)").forEach(btn => {
            btn.addEventListener("click", () => {
              const lvl = parseInt(btn.getAttribute("data-level"), 10);
              AudioEngine.click(); AudioEngine.unlock();
              State.age = currentAge;
              State.difficulty = currentDiff;
              State.level = lvl;
              modal.destroy();
              startGame();
            });
          });

          modal.node.querySelector("#hist-close").addEventListener("click", () => {
            if (scrollEl) this._levelGridScroll[scrollKey] = scrollEl.scrollTop;
            modal.destroy();
          });
        };

        bindContent();
      }

      // "Learn more about this word" popup - shared by GameScene's word
      // list (once a word is found) and the Vocab Vault. `info` is
      // {word, category, icon, definition}, from getWordInfo().
      openWordDetail(info) {
        const catBadge = info.category
          ? `<div style="display:inline-block; background:rgba(255,255,255,0.12); color:#facc15; font-size:calc(26px * var(--wf-font-scale)); font-weight:800; letter-spacing:1px; padding:7px 18px; border-radius:999px; margin-bottom:16px;">${info.category}</div>`
          : "";

        const html = `
          <div style="width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; height:100%; justify-content:center;">
            <div style="width:130px; height:130px; border-radius:50%; background:rgba(250,204,21,0.15); border:4px solid #facc15; display:flex; align-items:center; justify-content:center; margin-bottom:20px; flex-shrink:0;">
              ${miniIconHTML(info.icon, 66, "#facc15")}
            </div>
            <div style="font-size:calc(54px * var(--wf-font-scale)); font-weight:800; color:#fff; margin-bottom:10px; letter-spacing:1px;">${info.word}</div>
            ${catBadge}
            <div style="font-size:calc(34px * var(--wf-font-scale)); line-height:1.5; color:#cbd5e1;">${info.definition}</div>
            <button class="wf-btn" id="word-detail-close" style="width:280px; height:72px; background:linear-gradient(180deg, #fde047, #eab308); --base-btn-size: 26px; color:#1e3a8a; margin-top:28px; flex-shrink:0;">GOT IT</button>
          </div>`;

        const modal = this.openHtmlModal(840, 760, html, { depth: 9999, bg: "#1e2942", border: "#facc15", padding: 40 });
        modal.node.querySelector("#word-detail-close").addEventListener("click", () => {
          modal.destroy();
        });
      }

      // Replaces native confirm(), which is silently ignored (never
      // shows, and returns undefined immediately) in a sandboxed iframe
      // with no allow-modals flag - the exact environment this game runs
      // in on PlayLearn. Opens fine nested inside another modal too,
      // since openHtmlModal's pause/resume is reference-counted.
      showConfirmModal(message, onConfirm, opts = {}) {
        const title = opts.title || "Are you sure?";
        const confirmLabel = opts.confirmLabel || "YES";
        const cancelLabel = opts.cancelLabel || "CANCEL";

        const html = `
          <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:26px; height:100%; justify-content:center;">
            <div class="wf-modal-header" style="border:none; margin:0; padding:0;">
              <div class="wf-modal-title" style="color:#facc15;">${title}</div>
            </div>
            <div style="font-size:calc(28px * var(--wf-font-scale)); color:#ffffff; max-width:600px;">${message}</div>
            <div style="display:flex; gap:16px;">
              <button class="wf-btn" id="confirm-cancel" style="width:220px; height:75px; background:linear-gradient(180deg, #64748b, #334155); --base-btn-size: 22px; color:#fff;">${cancelLabel}</button>
              <button class="wf-btn" id="confirm-yes" style="width:220px; height:75px; background:linear-gradient(180deg, #ef4444, #b91c1c); --base-btn-size: 22px; color:#fff;">${confirmLabel}</button>
            </div>
          </div>`;

        const modal = this.openHtmlModal(760, 480, html, { depth: 9999, bg: "#1e2942", border: "#facc15" });
        modal.node.querySelector("#confirm-cancel").addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          modal.destroy();
        });
        modal.node.querySelector("#confirm-yes").addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          modal.destroy();
          onConfirm();
        });
      }

      // Replaces native alert() for brief, non-blocking messages - same
      // sandboxed-iframe reasoning as showConfirmModal above. Pure DOM,
      // not tied to a scene's own camera/depth system, so it works the
      // same from Home or GameScene.
      showToast(message, opts = {}) {
        const color = opts.color || "#ef4444";
        const html = `<div class="wf-toast-msg" style="background:${color};">${message}</div>`;
        const dom = this.add.dom(W / 2, H * 0.18).createFromHTML(html).setOrigin(0.5).setDepth(20000);
        if (dom.node) dom.node.style.zIndex = "20000";
        this.time.delayedCall(2200, () => dom.destroy());
      }

      // Converts a DOM element's on-screen center into Phaser world
      // coordinates, accounting for the canvas's FIT-mode scaling - lets a
      // coin-fly animation start or end exactly on a real button/badge
      // instead of an approximate spot.
      domElementToWorldXY(el) {
        const canvas = this.sys.game.canvas;
        const canvasRect = canvas.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();
        // Defensive: a zero-size canvas rect (can happen for a transient
        // frame during layout/reflow) would divide-by-zero into
        // Infinity/NaN coordinates - feeding NaN into a Phaser tween can
        // destabilize the tween system itself, not just this one call, so
        // fall back to a safe on-screen default rather than ever return
        // a non-finite value.
        if (!canvasRect.width || !canvasRect.height) return { x: W / 2, y: 90 };
        const scaleX = canvasRect.width / W;
        const scaleY = canvasRect.height / H;
        const x = (elRect.left + elRect.width / 2 - canvasRect.left) / scaleX;
        const y = (elRect.top + elRect.height / 2 - canvasRect.top) / scaleY;
        return {
          x: Number.isFinite(x) ? x : W / 2,
          y: Number.isFinite(y) ? y : 90
        };
      }

      // Shared coin-pool flight, usable from any scene/context: `count`
      // small coin icons fly from (fromX,fromY) to (toX,toY), staggered
      // and shrinking as they go. Used both directions - earning coins
      // flies them INTO the coin counter, spending coins (a shop purchase)
      // flies them OUT of it toward whatever was bought.
      flyCoinPool(count, fromX, fromY, toX, toY) {
        // Never hand a Phaser tween a non-finite coordinate - guard here
        // once instead of trusting every caller to have already validated
        // its inputs.
        if (![fromX, fromY, toX, toY].every(Number.isFinite)) return;
        for (let i = 0; i < count; i++) {
          this.time.delayedCall(i * 90, () => {
            const coinDom = this.add.dom(fromX, fromY)
              .createFromHTML(`<div style="width:30px;height:30px;">${coinIconHTML(30)}</div>`)
              .setOrigin(0.5).setDepth(9998);
            if (coinDom.node) coinDom.node.style.zIndex = "9998";

            const midX = fromX + (toX - fromX) * 0.5 + (Math.random() * 60 - 30);
            const midY = Math.min(fromY, toY) - 100 - Math.random() * 40;

            this.tweens.add({
              targets: coinDom,
              x: { value: [fromX, midX, toX] },
              y: { value: [fromY, midY, toY] },
              scale: { value: [1, 0.8, 0.3] },
              duration: 600,
              ease: "Cubic.easeIn",
              onComplete: () => coinDom.destroy()
            });
          });
        }
      }
    }

        const ageOrder = [AGE.UNDER_8, AGE.EIGHT_TO_12, AGE.TEENS, AGE.ADULTS];
        const totalWordsAllAges = ageOrder.reduce((sum, age) => sum + ((vault[age] && vault[age].length) || 0), 0);

        // Grid, so switching tabs doesn't reset you to the top each time.

              return `

      create() {
        window.currentGameSceneInstance = this;
        this.levelData = generateLevel(State.age, State.level, State.mode, State.difficulty);
        this.selected = []; this.cells = []; this.foundSet = new Set();
        this.hintedWords = new Set(); this.hintedCells = new Set();
        this.wordRowEls = {}; this.dragging = false; this.isLevelCleared = false;
        this.isPausedByOverlay = false; this.isPausedModalOpen = false;

        State.streak = 0; State.lastFoundTime = Date.now(); State.comboMultiplier = 1;
        State.timerFrozen = false;

        this.remainingTime = 60;
        this.totalTime = 60;

        this.bg(); this.drawHeader(); this.drawWordPanel(); this.drawBoard(); this.drawPowerupToolbar();
        this.startLevelTimer();

        this.input.on("pointerdown", this.handlePointerDown, this);
        this.input.on("pointermove", this.handlePointerMove, this);
        this.input.on("pointerup", this.finishSelection, this);
        this.input.on("pointerupoutside", this.finishSelection, this);

        window.addEventListener('wf-coins-updated', this.handleCoinUpdateEvent.bind(this));

        AudioEngine.startBGM();
        updateSmartOverlay();
      }

      shutdown() {
        super.shutdown();
        window.removeEventListener('wf-coins-updated', this.handleCoinUpdateEvent.bind(this));
      }

      // Spawns `count` small coin icons that fly from (fromX, fromY) - e.g.
      // wherever the word was found on the board - up and over to the coin
      // badge in the header, shrinking as they go. Purely visual; the
      // actual counter update is triggered separately once they land.
      handleCoinUpdateEvent(e) {
        // Deferred entirely to the next event-loop tick via setTimeout(0).
        // This fires synchronously from inside the same call stack as the
        // touchend/pointerup handler (State.coins changing → this event →
        // this handler), and it used to touch the DOM directly in there
        // (creating the floating "+15" number, forcing a reflow via
        // `void badge.offsetWidth` for the badge pulse). Synchronous DOM
        // mutation inside a touch event's own call stack is a known trigger
        // for mobile browsers losing track of the NEXT touch sequence -
        // which is exactly what "drag stops working right after the first
        // word is found, only on touch devices" looks like. Pushing all of
        // it out to a fresh tick means the touchend handler finishes and
        // returns control to the browser first, with zero DOM writes still
        // pending when it does.
        setTimeout(() => {
          try {
            if (!this.gameCoinDom || !this.gameCoinDom.node) return;
            const badge = this.gameCoinDom.node.querySelector("#game-coin-badge");
            const bumpBadge = () => {
              if (badge) {
                badge.classList.remove("wf-coin-anim");
                void badge.offsetWidth;
                badge.classList.add("wf-coin-anim");
              }
            };

            const delta = e && e.detail ? e.detail.delta : 0;
            // Fixed, known world position (matches where drawHeader()
            // actually places the coin badge) instead of measuring it via
            // domElementToWorldXY() - this runs on every single word find,
            // so it stays on the cheapest, most predictable path rather
            // than doing a DOM getBoundingClientRect() measurement.
            const bankXY = { x: 800, y: 90 };

            if (delta > 0) {
              // Earned coins - fly a few from roughly where the action
              // happened (the board) over to the bank, then land the
              // counter update once they arrive instead of jumping the
              // number instantly.
              const fromX = (this.boardX || W / 2 - 200) + 200;
              const fromY = (this.boardY || 400) + 200;
              const flyCount = Math.min(3, Math.max(1, Math.round(delta / 15)));
              this.flyCoinPool(flyCount, fromX, fromY, bankXY.x, bankXY.y);
              this.time.delayedCall(650, () => {
                this.updateCoinDisplay();
                bumpBadge();
              });
            } else {
              // Spent coins (e.g. shop purchase) - no flight, just count down.
              this.updateCoinDisplay();
              bumpBadge();
            }

            if (delta !== 0) {
              const sign = delta > 0 ? "+" : "";
              const floatNum = document.createElement("div");
              floatNum.className = "wf-floating-number";
              floatNum.innerHTML = `${sign}${delta} ${coinIconHTML(16)}`;
              floatNum.style.left = "40px";
              floatNum.style.top = "5px";
              this.gameCoinDom.node.appendChild(floatNum);
              setTimeout(() => floatNum.remove(), 900);
            }
          } catch (err) {
            console.warn("handleCoinUpdateEvent error (non-fatal):", err);
          }
        }, 0);
      }

      triggerOverlayPause() {
        if (this.isLevelCleared) return;
        this.isPausedByOverlay = true;
        State.timerFrozen = true;
        this.scene.pause();

      resumeFromOverlayPause() {
        if (!this.isPausedByOverlay) return;
        this.isPausedByOverlay = false;

        if (this.scene.isPaused()) { this.scene.resume(); }
        if (this.isPausedModalOpen && this.pauseModalDom) {
          this.pauseModalDom.destroy();
          this.pauseModalDom = null;
          this.isPausedModalOpen = false;
        }
      }

      showPausedModal() {
        if (this.isPausedModalOpen) return;
        this.isPausedModalOpen = true;

        const html = `

      startLevelTimer() {
        if (this.timerEvent) this.timerEvent.remove();
        this.timerEvent = this.time.addEvent({
          delay: 1000,
          callback: () => {
            if (this.isLevelCleared || this.isPausedByOverlay) return;
            if (!State.timerFrozen) {
              this.remainingTime--;
              this.timeTaken++;
              this.updateTimerText();
              if (this.remainingTime <= 0) { this.handleTimeout(); }
            }
          },
          loop: true
        });
      }

      updateTimerText() {
        if (this.timerTextNode) {
          const mins = Math.floor(Math.max(0, this.remainingTime) / 60).toString().padStart(2, "0");
          const secs = (Math.max(0, this.remainingTime) % 60).toString().padStart(2, "0");
          this.timerTextNode.textContent = `${mins}:${secs}`;
        }

        if (this.timerRingNode) {
          const total = this.totalTime || 60;
          const ratio = Math.max(0, Math.min(1, this.remainingTime / total));
          this.timerRingNode.style.strokeDashoffset = String(this.timerRingCirc * (1 - ratio));

          let color = "#4ade80"; // plenty of time - calm green
          if (this.remainingTime <= 15) color = "#facc15"; // warning - amber
          if (this.remainingTime <= 5) color = "#f87171"; // urgent - red
          this.timerRingNode.style.stroke = color;
          if (this.timerTextNode) this.timerTextNode.style.color = color;
        }

        if (this.timerRingWrapNode) {
          this.timerRingWrapNode.classList.remove("wf-timer-warn", "wf-timer-critical");
          if (this.remainingTime <= 5) this.timerRingWrapNode.classList.add("wf-timer-critical");
          else if (this.remainingTime <= 15) this.timerRingWrapNode.classList.add("wf-timer-warn");
        }
      }
