      drawBoard() {
        const d = this.levelData, p = d.profile, t = theme();
        const maxW = 920;
        this.cellSize = Math.floor(maxW / p.cols);
        const bw = this.cellSize * p.cols, bh = this.cellSize * p.rows;

        this.boardX = (W - bw) / 2; this.boardY = 650 + (maxW - bh) / 2;

        this.boardBg = this.add.rectangle(this.boardX + bw / 2, this.boardY + bh / 2, bw + 32, bh + 32, t.panel, 0.98).setStrokeStyle(6, t.line).setDepth(2);

        this.cells = Array.from({ length: p.rows }, () => Array(p.cols));

        for (let r = 0; r < p.rows; r++) {
          for (let c = 0; c < p.cols; c++) {
            const cx = this.boardX + c * this.cellSize + this.cellSize / 2;
            const cy = this.boardY + r * this.cellSize + this.cellSize / 2;
            const cs = this.cellSize - 10, isBlock = d.grid[r][c] === BLOCK_TILE;

            const g = this.add.graphics().setDepth(3);
            this.paintTile(g, cx, cy, cs, isBlock ? t.block : t.cell, t.cellLine, "normal");

            const tx = this.add.text(cx, cy, isBlock ? "" : d.grid[r][c], {
              fontFamily: t.font, fontSize: (Math.min(49, cs * 0.5) + 8) * State.textScale + "px", fontStyle: "bold", color: hex(t.text)
            }).setOrigin(0.5).setDepth(4);

            this.cells[r][c] = { g, tx, cx, cy, cs, r, c, isBlock, letter: d.grid[r][c] };

            if (!State.quietMode) {
              const delay = (r * p.cols + c) * 18;
              // Tile background fades in alongside the letter instead of
              // just appearing instantly - alpha only (not scale), since
              // this Graphics object's shapes are drawn at absolute cx/cy
              // coordinates rather than relative to its own origin, so
              // scaling it would make it fly in from the corner instead of
              // growing in place.
              g.setAlpha(0);
              this.tweens.add({
                targets: g, alpha: { from: 0, to: 1 }, duration: 320, delay: delay, ease: 'Sine.easeOut'
              });
              this.tweens.add({
                targets: [tx], scale: { from: 0, to: 1 }, alpha: { from: 0, to: 1 }, duration: 350, delay: delay, ease: 'Back.easeOut'
              });
            }
          }
        }
      }

      drawWordPanel() {
        const t = theme();
        const isBuilder = State.mode === MODE.BUILDER;

        let rowsHTML = "";
        if (isBuilder) {
          rowsHTML = this.levelData.placements.map((pl, idx) => {
            const isFound = this.foundSet.has(pl.word);
            const display = isFound ? pl.word : "_ ".repeat(pl.word.length);
            return `
              <div class="wf-word-row ${isFound ? 'wf-found' : ''}" data-word="${pl.word}" style="background:${isFound ? '#22c55e' : hex(t.bg) + '44'}; color:${hex(t.text)};">
                <span class="wf-word-icon" style="background:${hex(t.primary)}33;">${miniIconHTML(pl.icon, 20, hex(t.primary))}</span>
                <span class="wf-word-text" style="letter-spacing:4px;">${display}</span>
                <span class="wf-word-info" data-info-word="${pl.word}" title="Learn more">${miniIconHTML("info", 18, "#ffffff")}</span>
                <span class="wf-word-check">${miniIconHTML("check-circle-2", 24, "#ffffff")}</span>
              </div>`;
          }).join("");
        } else {
          rowsHTML = this.levelData.placements.map(pl => {
            const hasRiddle = !!this.levelData.quiz;
            const masked = hasRiddle && pl.isQuizWord;
            const display = masked ? "?".repeat(pl.word.length) : pl.word;
            return `
              <div class="wf-word-row" data-word="${pl.word}" style="background:${hex(t.bg)}44; color:${hex(t.text)};">
                <span class="wf-word-icon" style="background:${hex(t.primary)}33;">${miniIconHTML(pl.icon, 20, hex(t.primary))}</span>
                <span class="wf-word-text">${display}</span>
                <span class="wf-word-info" data-info-word="${pl.word}" title="Learn more">${miniIconHTML("info", 18, "#ffffff")}</span>
                <span class="wf-word-check">${miniIconHTML("check-circle-2", 24, "#ffffff")}</span>
              </div>`;
          }).join("");
        }

        let riddleHTML = "";
        if (this.levelData.quiz) {
          riddleHTML = `
            <div style="width:100%; border-radius:18px; padding:10px; margin-bottom:10px; background:${hex(t.primary)}22; border:2px dashed ${hex(t.primary)}; text-align:center; display:flex; flex-direction:column; align-items:center;">
              <div style="display:flex; align-items:center; justify-content:center; gap:12px; width:100%;">
                <div style="font-size:calc(26px * var(--wf-font-scale)); font-weight:700; color:${hex(t.text)};">"${this.levelData.quiz.q}"</div>
                <button class="wf-tts-btn" id="tts-btn">
                  ${miniIconHTML("volume-2", 26, "#1e3a8a")}
                </button>
              </div>
            </div>`;
        }

        const panelTitle = isBuilder ? "WORD BUILDER (FIND ANY VALID WORDS):" : (this.levelData.quiz ? "SOLVE RIDDLE & FIND WORDS:" : "FIND THE WORDS:");

        const innerHTML = `
          <div style="font-size:calc(28px * var(--wf-font-scale)); font-weight:800; color:${hex(t.text)}; margin-bottom:8px; text-align:center;">
            ${panelTitle}
          </div>
          ${riddleHTML}
          <div class="wf-word-list" style="width:100%;">${rowsHTML}</div>`;

        this.wordPanelDom = this.domCard(W / 2, 440, 940, this.levelData.quiz ? 390 : 320, innerHTML, { padding: 20, depth: 5 });

        if (this.levelData.quiz) {
          const ttsBtn = this.wordPanelDom.node.querySelector("#tts-btn");
          if (ttsBtn) ttsBtn.addEventListener("click", () => { AudioEngine.unlock(); TTS.speak(this.levelData.quiz.q); });
        }

        this.levelData.placements.forEach(pl => {
          this.wordRowEls[pl.word] = this.wordPanelDom.node.querySelector(`.wf-word-row[data-word="${pl.word}"]`);
        });

        // "Learn more" info buttons - CSS keeps them invisible/inert until
        // the row gets .wf-found, so tapping does nothing on an unfound word.
        this.wordPanelDom.node.querySelectorAll(".wf-word-info").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const row = btn.closest(".wf-word-row");
            if (!row || !row.classList.contains("wf-found")) return;
            const word = btn.getAttribute("data-info-word");
            const pl = this.levelData.placements.find(p => p.word === word);
            AudioEngine.click(); AudioEngine.unlock();
            this.openWordDetail(getWordInfo(word, pl && pl.icon, pl && pl.category));
          });
        });
      }

      drawPowerupToolbar() {
        const powerupBadgeHTML = (type) => {
          const count = State.powerups[type];
          return `<span class="wf-powerup-count" id="count-${type}">${count}</span>`;
        };

        const html = `
          <div class="wf-powerup-bar">
            <div class="wf-powerup-btn" id="pw-magnet" title="Solve 1 word">
              ${powerupBadgeHTML("magnet")}
              ${miniIconHTML("magnet", 52, "#ffffff")}
              <span class="wf-powerup-label">SOLVE</span>
            </div>
            <div class="wf-powerup-btn" id="pw-reveal" title="Reveal 1st Letter">
              ${powerupBadgeHTML("reveal")}
              ${miniIconHTML("eye", 52, "#ffffff")}
              <span class="wf-powerup-label">HINT</span>
            </div>
            <div class="wf-powerup-btn" id="pw-freeze" title="Freeze Timer">
              ${powerupBadgeHTML("freeze")}
              ${miniIconHTML("snowflake", 52, "#ffffff")}
              <span class="wf-powerup-label">FREEZE</span>
            </div>
            <div class="wf-powerup-btn" id="pw-shuffle" title="Shuffle Grid">
              ${powerupBadgeHTML("shuffle")}
              ${miniIconHTML("shuffle", 52, "#ffffff")}
              <span class="wf-powerup-label">SHUFFLE</span>
            </div>
          </div>`;

        this.powerupDom = this.domCenter(W / 2, 1740, 980, 200, html, "", 5);
        refreshIcons();

        const usePowerup = (type, handler) => {
          if (this.isPausedByOverlay) return;
          if (State.powerups[type] > 0) {
            State.powerups[type]--;
            State.savePowerups();
            this.updatePowerupCounts();
            AudioEngine.powerup(); AudioEngine.unlock(); handler();
          } else {
            // Used to fall back to AdManager.showRewarded() here, which
            // always "succeeds" and grants +2 uses since there's no real
            // ad SDK behind it yet - that meant tapping an empty powerup
            // was a free, unlimited refill loop. Until a real ad provider
            // is wired in, an empty powerup just can't be used.
            AudioEngine.wrong(); AudioEngine.unlock();
            this.showPowerupBanner("NO USES LEFT!");
          }
        };

        this.powerupDom.node.querySelector("#pw-magnet").addEventListener("click", () => {
          usePowerup("magnet", () => {
            const unfound = this.levelData.placements.filter(pl => !this.foundSet.has(pl.word));
            if (unfound.length > 0) this.markFound(unfound[0]);
          });
        });

        const revealBtn = this.powerupDom.node.querySelector("#pw-reveal");

        // Greys out and disables HINT once every word in the level has
        // either been found or already hinted - no point offering more
        // hints (or spending a use / watching an ad for one) when there's
        // nothing left to reveal.
        this.updateRevealAvailability = () => {
          const exhausted = this.levelData.placements.every(pl => this.foundSet.has(pl.word) || this.hintedWords.has(pl.word));
          if (revealBtn) {
            revealBtn.style.opacity = exhausted ? "0.4" : "1";
            revealBtn.style.filter = exhausted ? "grayscale(1)" : "none";
            revealBtn.style.pointerEvents = exhausted ? "none" : "auto";
            revealBtn.title = exhausted ? "All words already hinted" : "Reveal 1st Letter";
          }
        };
        this.updateRevealAvailability();

        revealBtn.addEventListener("click", () => {
          // Words that already got a hint are skipped - each use of HINT
          // moves on to a NEW word instead of re-revealing the same one,
          // and the mark it leaves on the board stays lit (via
          // hintedCells/paintCellDefault) instead of fading on the next
          // repaint.
          const unhinted = this.levelData.placements.filter(pl => !this.foundSet.has(pl.word) && !this.hintedWords.has(pl.word));
          if (unhinted.length === 0) {
            this.showPowerupBanner("ALL HINTS USED FOR THIS LEVEL!");
            return;
          }
          usePowerup("reveal", () => {
            const target = unhinted[0];
            const [c, r] = target.path[0];
            this.hintedWords.add(target.word);
            this.hintedCells.add(`${r},${c}`);
            const cell = this.cells[r][c];
            this.paintCellDefault(cell);
            this.showPowerupBanner(`HINT: 1ST LETTER OF '${target.word}' IS '${target.word[0]}'`);
            this.updateRevealAvailability();
          });
        });

        this.powerupDom.node.querySelector("#pw-freeze").addEventListener("click", () => {
          usePowerup("freeze", () => {
            State.timerFrozen = true;
            this.boardBg.setStrokeStyle(10, 0x38bdf8);
            this.showPowerupBanner("TIMER FROZEN FOR 15s!");
            this.time.delayedCall(15000, () => {
              if (!this.isPausedByOverlay) State.timerFrozen = false;
              this.boardBg.setStrokeStyle(6, theme().line);
            });
          });
        });

        this.powerupDom.node.querySelector("#pw-shuffle").addEventListener("click", () => {
          usePowerup("shuffle", () => {
            const p = this.levelData.profile;
            const targetCoords = new Set();
            this.levelData.placements.forEach(pl => { pl.path.forEach(([c, r]) => targetCoords.add(`${c},${r}`)); });

            for (let r = 0; r < p.rows; r++) {
              for (let c = 0; c < p.cols; c++) {
                const cell = this.cells[r][c];
                if (!cell.isBlock && !targetCoords.has(`${c},${r}`)) {
                  cell.letter = String.fromCharCode(65 + seededRnd(0, 25));
                  cell.tx.setText(cell.letter);
                  this.tweens.add({ targets: cell.tx, angle: 360, duration: 400 });
                }
              }
            }
            this.showPowerupBanner("DISTRACTORS SHUFFLED!");
          });
        });
      }

      updatePowerupCounts() {
        if (!this.powerupDom || !this.powerupDom.node) return;
        ['magnet', 'reveal', 'freeze', 'shuffle'].forEach(type => {
          const el = this.powerupDom.node.querySelector(`#count-${type}`);
          if (el) el.textContent = State.powerups[type];
        });
      }

      updateCoinDisplay() {
        const cEl = document.getElementById("game-coin-count");
        if (cEl) animateCounterEl(cEl, State.coins);
      }

      getCellAtPointer(pointer) {
        if (this.isLevelCleared || this.isPausedByOverlay) return null;
        const p = this.levelData.profile, radiusSq = (this.cellSize / 2) * (this.cellSize / 2);
        for (let r = 0; r < p.rows; r++) {
          for (let c = 0; c < p.cols; c++) {
            const cell = this.cells[r][c]; if (cell.isBlock) continue;
            const dx = pointer.x - cell.cx, dy = pointer.y - cell.cy;
            if (dx * dx + dy * dy <= radiusSq) return cell;
          }
        }
        return null;
      }

      handlePointerDown(pointer) {
        if (this.isLevelCleared || this.isPausedByOverlay) return;
        AudioEngine.unlock();
        const cell = this.getCellAtPointer(pointer);
        if (cell) {
          if (State.tapToSelect) { this.addCell(cell.c, cell.r); this.checkTapMatch(); }
          else { this.clearSelection(); this.dragging = true; this.addCell(cell.c, cell.r); }
        }
      }

      handlePointerMove(pointer) {
        if (!this.dragging || this.isLevelCleared || this.isPausedByOverlay || State.tapToSelect) return;
        const cell = this.getCellAtPointer(pointer);
        if (cell) {
          if (this.selected.length >= 2) {
            const prevCell = this.selected[this.selected.length - 2];
            if (prevCell.c === cell.c && prevCell.r === cell.r) {
              const removed = this.selected.pop();
              const remCell = this.cells[removed.r][removed.c];
              this.paintCellDefault(remCell);
              AudioEngine.deselect();
              return;
            }
          }
          this.addCell(cell.c, cell.r);
        }
      }

      addCell(c, r) {
        const p = this.levelData.profile;
        if (r < 0 || r >= p.rows || c < 0 || c >= p.cols || this.cells[r][c].isBlock) return;
        const last = this.selected[this.selected.length - 1];
        if (last && last.c === c && last.r === r) return;
        if (last && (Math.abs(last.c - c) + Math.abs(last.r - r) !== 1)) return;
        if (this.selected.some(item => item.c === c && item.r === r)) return;

        this.selected.push({ c, r });
        const cell = this.cells[r][c];
        this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, theme().selected, theme().accent, "selected");
        AudioEngine.select(this.selected.length - 1);
      }

      checkTapMatch() {
        const traced = this.selected.map(item => this.cells[item.r][item.c].letter).join("");
        const match = this.levelData.placements.find(pl => !this.foundSet.has(pl.word) && pl.word === traced);
        if (match) { this.markFound(match, [...this.selected]); }
      }

      finishSelection() {
        if (State.tapToSelect || !this.dragging || this.isPausedByOverlay) return;
        this.dragging = false;
        const traced = this.selected.map(item => this.cells[item.r][item.c].letter).join("");

        const match = this.levelData.placements.find(pl => !this.foundSet.has(pl.word) && pl.word === traced);

        if (match) {
          this.markFound(match, [...this.selected]);
        } else {
          if (State.mode === MODE.BUILDER && traced.length >= 3) {
            const anyValid = Object.values(JSON_DATA.wordPools).some(poolObj => Object.values(poolObj).some(list => list.some(i => i.word === traced)));
            if (anyValid && !this.foundSet.has(traced)) {
              this.markFound({ word: traced, category: "BONUS", icon: "award", path: [...this.selected] }, [...this.selected]);
              return;
            }
          }
          if (this.selected.length > 1) AudioEngine.wrong();
          this.clearSelection();
        }
      }

      clearSelection() {
        this.selected.forEach(item => {
          const cell = this.cells[item.r][item.c];
          this.paintCellDefault(cell);
        });
        this.selected = [];
      }

      markFound(pl, customPath = null) {
        // this.selected = [] is guaranteed via finally, no matter what
        // happens above - so even an unexpected error partway through
        // (coin FX, banners, particle effects, etc.) can never leave drag
        // selection state stuck and unable to recover on the next attempt.
        try {
          if (!this.foundSet.has(pl.word)) {
            this.foundSet.add(pl.word);
            State.coins += 15;
          }
          if (typeof this.updateRevealAvailability === "function") this.updateRevealAvailability();
          const t = theme();
          const pathTiles = customPath || pl.path.map(([c, r]) => ({ c, r }));

          pathTiles.forEach(({ c, r }) => {
            const cell = this.cells[r][c];
            this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, t.found, t.success, "found");
          });

          const row = this.wordRowEls[pl.word];
          if (row) {
            row.classList.add("wf-found");
            if (pl.isQuizWord) row.querySelector(".wf-word-text").textContent = pl.word;
            if (State.mode === MODE.BUILDER) row.querySelector(".wf-word-text").textContent = pl.word;
          }

          State.addLearnedWord(pl.word, pl.category || "GENERAL", State.age);
          AudioEngine.correct();

          const now = Date.now(), timeDiff = (now - State.lastFoundTime) / 1000;
          State.lastFoundTime = now;

          if (timeDiff <= 7) {
            State.streak++;
            State.coins += 10;
            this.showPowerupBanner(`FAST SOLVE x${State.streak}! +10 COINS`);
          } else {
            State.streak = 1;
          }

          const centerItem = pathTiles[Math.floor(pathTiles.length / 2)];
          const centerCell = this.cells[centerItem.r][centerItem.c];
          this.spawnWordParticleFX(centerCell.cx, centerCell.cy);
          this.confettiBurst(W / 2, this.boardY + 460, 28);

          if (this.foundSet.size === this.levelData.placements.length) {
            this.time.delayedCall(600, () => this.levelComplete());
          }
        } catch (err) {
          console.warn("markFound error (non-fatal):", err);
        } finally {
          this.selected = [];
        }
      }

      showPowerupBanner(msg) {
        const t = theme();
        const bannerY = this.boardY + 160;
        const banner = this.add.text(W / 2, bannerY, msg, {
          fontFamily: t.font, fontSize: "44px", fontStyle: "bold", color: "#ffffff", stroke: "#10b981", strokeThickness: 8
        }).setOrigin(0.5).setDepth(285);

        this.tweens.add({
          targets: banner, y: bannerY - 50, scale: { from: 0.6, to: 1.2 }, alpha: { from: 1, to: 0 },
          duration: 1400, ease: "Back.easeOut", onComplete: () => banner.destroy()
        });
      }

      spawnWordParticleFX(x, y) {
        if (State.quietMode) return;
        const t = theme(), praises = ["GREAT!", "AWESOME!", "FANTASTIC!", "SUPER!", "PERFECT!"];
        const praiseText = this.add.text(x, y, praises[Math.floor(Math.random() * praises.length)], {
          fontFamily: t.font, fontSize: "56px", fontStyle: "bold", color: "#ffffff", stroke: hex(t.secondary), strokeThickness: 10
        }).setOrigin(0.5).setDepth(280);

        this.tweens.add({
          targets: praiseText, y: y - 110, scale: { from: 0.5, to: 1.3 }, alpha: { from: 1, to: 0 },
          duration: 1100, ease: "Back.easeOut", onComplete: () => praiseText.destroy()
        });
      }

      paintTile(g, cx, cy, cs, fill, line, stateType = "normal") {
        g.clear();

        g.fillStyle(0x000000, 0.12);
        g.fillRoundedRect(cx - cs / 2, cy - cs / 2 + 4, cs, cs, 20);

        g.fillStyle(fill, 1);
        g.fillRoundedRect(cx - cs / 2, cy - cs / 2, cs, cs, 20);

        g.lineStyle(State.highContrast ? 5 : 3.5, line, 1);
        g.strokeRoundedRect(cx - cs / 2, cy - cs / 2, cs, cs, 20);

        if (State.colorblindMode && stateType === "selected") {
          g.lineStyle(3, 0xffffff, 0.7); g.lineBetween(cx - cs / 3, cy - cs / 3, cx + cs / 3, cy + cs / 3);
        }
      }

      // Repaints a cell to its resting appearance - "hint" (persistently
      // marked, stays lit until that word is found) if it's a hinted
      // word's first letter, otherwise plain "normal". Use this instead of
      // painting "normal" directly anywhere a cell reverts to its resting
      // state (deselecting, an invalid word, a theme refresh) so a hint
      // mark isn't accidentally erased by unrelated board repaints.
      paintCellDefault(cell) {
        const t = theme();
        if (this.hintedCells && this.hintedCells.has(`${cell.r},${cell.c}`)) {
          this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, t.hint, t.accent, "hint");
        } else {
          this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, t.cell, t.cellLine, "normal");
        }
      }

      // Re-paints every board tile in its CURRENT state (normal or found)
      // so a visual-only preference change (like High Contrast's thicker
      // borders) shows up immediately without regenerating the level -
      // that used to require a full this.scene.restart(), which threw away
      // the in-progress board, found words, timer and score just to update
      // a border thickness.
      refreshBoardTheme() {
        if (!this.levelData || !this.cells || !this.cells.length) return;
        const t = theme();
        for (let r = 0; r < this.cells.length; r++) {
          for (let c = 0; c < this.cells[r].length; c++) {
            const cell = this.cells[r][c];
            if (!cell || cell.isBlock) continue;
            this.paintCellDefault(cell);
            if (cell.tx) cell.tx.setColor(hex(t.text));
          }
        }
        this.levelData.placements.forEach(pl => {
          if (!this.foundSet.has(pl.word)) return;
          pl.path.forEach(([c, r]) => {
            const cell = this.cells[r] && this.cells[r][c];
            if (cell) this.paintTile(cell.g, cell.cx, cell.cy, cell.cs, t.found, t.success, "found");
          });
        });
      }

      openInGameAccessibility() {
        // Now that openSettingsModal() lives on BaseScene, call it on THIS
        // scene directly instead of reaching into the Home scene instance.
        // Calling homeScene.openSettingsModal() ran the method with `this`
        // bound to Home, so its this.scene.pause()/this.openHtmlModal(...)
        // all operated on Home (usually already inactive) instead of the
        // scene actually visible on screen - leaving GameScene's own
        // buttons underneath live and clickable through the modal, which
        // is what was letting clicks land on the game behind the overlay
        // instead of the popup's own controls.
        const wasFrozen = State.timerFrozen;
        State.timerFrozen = true;
        this.openSettingsModal();
        const checkModalClosed = this.time.addEvent({
          delay: 200,
          loop: true,
          callback: () => {
            if (!document.querySelector('.wf-dom') || !this.scene.isPaused()) {
              State.timerFrozen = wasFrozen;
              checkModalClosed.remove();
            }
          }
        });
      }

      levelComplete() {
        this.isLevelCleared = true;
        if (this.timerEvent) this.timerEvent.remove();
        AudioEngine.win();

        let stars = 1;
        if (this.timeTaken <= 25) stars = 3;
        else if (this.timeTaken <= 45) stars = 2;

        State.coins += 50 * stars;

        const unlockedCountBefore = State.getUnlockedDiffCount();
        State.addStars(State.difficulty, stars);
        const unlockedCountAfter = State.getUnlockedDiffCount();

        if (State.level >= State.highestUnlockedLevel) {
          State.highestUnlockedLevel = State.level + 1;
        }

        if (typeof PlayLearnSDK !== 'undefined' && typeof PlayLearnSDK.reportComplete === 'function') {
          try {
            PlayLearnSDK.reportComplete({
              performance: stars === 3 ? 1.0 : (stars === 2 ? 0.8 : 0.6),
              score: State.coins,
              levelReached: State.level
            });
          } catch (e) {
            console.warn("PlayLearnSDK reportComplete error:", e);
          }
        }

        AdManager.showInterstitial(() => {
          if (unlockedCountAfter > unlockedCountBefore) {
            const diffNames = ["", "Very Easy", "Easy", "Medium", "Hard", "Expert", "Master"];
            const unlockedName = diffNames[unlockedCountAfter] || "New Difficulty";

            const unlockHtml = `
              <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px; height:100%; justify-content:center;">
                <div class="wf-modal-header" style="border:none; margin:0; padding:0;">
                  <div class="wf-modal-title" style="color:#facc15;">🎉 DIFFICULTY UNLOCKED!</div>
                  <div class="wf-modal-subtitle">New challenge available</div>
                </div>
                <div style="font-size:calc(28px * var(--wf-font-scale)); color:#ffffff; max-width:550px;">You unlocked <strong>${unlockedName}</strong> difficulty!</div>
                <button class="wf-btn" id="btn-unlock-continue" style="width:300px; height:75px; background:linear-gradient(180deg, #fde047, #eab308); --base-btn-size: 24px; color:#1e3a8a;">AWESOME!</button>
              </div>`;

            const unlockModal = this.openHtmlModal(800, 750, unlockHtml, { depth: 9999, bg: "#1e2942", border: "#facc15" });
            unlockModal.node.querySelector("#btn-unlock-continue").addEventListener("click", () => {
              unlockModal.destroy(); this.showStandardLevelCompleteModal(stars);
            });
            return;
          }
          this.showStandardLevelCompleteModal(stars);
        });
      }

      showStandardLevelCompleteModal(stars) {
        // Every slot starts as an empty/disabled outline star - earned
        // ones get filled in via the flying-star animation after the
        // modal opens, instead of the icon set just deciding "filled vs
        // crossed-out" statically up front.
        const starsHTML = Array.from({ length: 3 }, (_, i) =>
          `<span class="wf-star-slot" id="star-slot-${i}" style="display:inline-flex;">${miniIconHTML("star", 64, "#64748b", "none")}</span>`
        ).join("");

        // Difficulty progression bar - makes it obvious, right on the win
        // screen, exactly how close this difficulty tier's stars are to
        // unlocking the next one (instead of only finding out via the
        // separate "Difficulty Unlocked!" popup when it actually happens).
        const nextDiff = State.difficulty + 1;
        let progressHTML;
        if (nextDiff <= 6) {
          let totalStars = 0;
          for (let d = 1; d <= State.difficulty; d++) totalStars += State.getAccumulatedStars(d);
          const required = State.getRequiredStarsToUnlock(nextDiff);
          const isNextUnlocked = State.isDiffUnlocked(nextDiff);
          const pct = Math.min(100, Math.round((totalStars / required) * 100));
          const nextDiffName = (JSON_DATA.difficulties[nextDiff.toString()] || {}).name || `Tier ${nextDiff}`;

          progressHTML = `
            <div style="width:100%; max-width:560px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-size:calc(25px * var(--wf-font-scale)); font-weight:800; color:#cbd5e1; letter-spacing:.5px;">
                  ${isNextUnlocked ? `🎉 ${nextDiffName.toUpperCase()} UNLOCKED!` : `PROGRESS TO ${nextDiffName.toUpperCase()}`}
                </span>
                <span style="font-size:calc(25px * var(--wf-font-scale)); font-weight:800; color:#facc15;">${Math.min(totalStars, required)}/${required} ⭐</span>
              </div>
              <div style="width:100%; height:30px; background:rgba(255,255,255,0.12); border-radius:999px; overflow:hidden; border:2px solid rgba(255,255,255,0.25); box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);">
                <div style="width:${pct}%; height:100%; background:linear-gradient(90deg, #facc15, #f59e0b); border-radius:999px; transition:width .8s cubic-bezier(.22,1,.36,1); box-shadow:0 0 10px rgba(250,204,21,0.6);"></div>
              </div>
            </div>`;
        } else {
          progressHTML = `
            <div style="width:100%; max-width:560px; text-align:center; background:rgba(250,204,21,0.12); border:2px solid #facc15; border-radius:16px; padding:12px;">
              <span style="font-size:calc(25px * var(--wf-font-scale)); font-weight:800; color:#facc15;">🏆 MAX DIFFICULTY REACHED!</span>
            </div>`;
        }

        const html = `
          <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px; height:100%; justify-content:center; position:relative;">
            <div class="wf-modal-close-x" id="win-close-x" title="Close">${miniIconHTML("x", 24, "#ffffff")}</div>
            <div id="win-stars-row" style="display:flex; gap:10px;">${starsHTML}</div>
            <div class="wf-modal-header" style="border:none; margin:0; padding:0;">
              <div class="wf-modal-title" style="color:${hex(theme().text)};">LEVEL CLEAR!</div>
              <div class="wf-modal-subtitle">Time: ${this.timeTaken}s • Earned +${stars} ⭐ & +${50 * stars} ${coinIconHTML(16)}</div>
            </div>
            ${progressHTML}
            <button class="wf-btn" id="btn-next" style="width:380px; height:96px; background:linear-gradient(180deg, ${theme().gradA}, ${theme().gradB}); --base-btn-size: 34px; color:#1e3a8a;">
              NEXT LEVEL ▶
            </button>
            ${this.postLevelExtrasHTML()}
          </div>`;

        const modal = this.openHtmlModal(880, 850, html, { depth: 9999 });
        refreshIcons();
        this.animateWinStars(modal, stars);
        // Same reasoning as the fail popup's corner-X: the level is
        // already complete, so "close" means heading back to Home - the
        // same destination as the HOME icon below, just via the
        // conventional spot people expect a close control to be.
        modal.node.querySelector("#win-close-x").addEventListener("click", () => {
          AudioEngine.click(); AudioEngine.unlock();
          modal.destroy();
          this.scene.start("Home");
        });
        modal.node.querySelector("#btn-next").addEventListener("click", () => {
          modal.destroy(); State.level++; this.scene.restart();
        });
        this.bindPostLevelExtras(modal);
      }

      // Flies a filled gold star from above the row into each earned
      // star's slot, one at a time, swapping that slot from an empty
      // outline to a solid filled star (with a little pop) the instant it
      // lands - rather than the row just appearing pre-filled.
      animateWinStars(modal, starsEarned) {
        const row = modal.node.querySelector("#win-stars-row");
        if (!row || starsEarned <= 0) return;

        for (let i = 0; i < starsEarned; i++) {
          this.time.delayedCall(300 + i * 450, () => {
            const slot = modal.node.querySelector(`#star-slot-${i}`);
            if (!slot || !slot.isConnected) return;

            const rowRect = row.getBoundingClientRect();
            const slotRect = slot.getBoundingClientRect();
            const startX = rowRect.left + rowRect.width / 2 - 32;
            const startY = rowRect.top - 110;

            const flyEl = document.createElement('div');
            flyEl.className = 'wf-flying-star';
            flyEl.style.left = startX + 'px';
            flyEl.style.top = startY + 'px';
            flyEl.style.opacity = '0';
            flyEl.innerHTML = miniIconHTML("star", 64, "#facc15", "#facc15");
            document.body.appendChild(flyEl);
            refreshIcons();

            requestAnimationFrame(() => {
              flyEl.style.opacity = '1';
              const dx = (slotRect.left + slotRect.width / 2 - 32) - startX;
              const dy = (slotRect.top + slotRect.height / 2 - 32) - startY;
              flyEl.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;
            });

            setTimeout(() => {
              flyEl.remove();
              slot.innerHTML = miniIconHTML("star", 64, "#facc15", "#facc15");
              refreshIcons();
              slot.classList.add('wf-star-pop');
              AudioEngine.powerup();
            }, 560);
          });
        }
      }
    }

    const config = {
      type: Phaser.AUTO, parent: "game-container", width: W, height: H,
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      input: { activePointers: 1, touch: { target: null, capture: true } },
      dom: { createContainer: true },
      scene: [PreloadScene, HomeScene, GameScene]
    };

    window.onload = () => new Phaser.Game(config);
  </script>
</body>

</html>
