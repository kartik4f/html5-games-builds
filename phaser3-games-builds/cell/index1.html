<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Microscopic Tissue</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070510;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }
    </style>

</head>

<body>

    <div id="game"></div>

    <script>

        const WIDTH = 1920;
        const HEIGHT = 1080;

        class TissueScene extends Phaser.Scene {

            constructor() {

                super("TissueScene");

            }

            create() {

                //--------------------------------
                // Background
                //--------------------------------

                this.cameras.main.setBackgroundColor(0x0b0716);

                this.bg = this.add.graphics();

                this.drawGradient();
                this.tissueBlobs = [];
                this.createMembraneTexture();
                this.createTissue();
                this.fluidParticles = [];

                this.createFluid();
                this.matrixGraphics = this.add.graphics();
                this.matrixGraphics.setBlendMode(Phaser.BlendModes.ADD);
                this.matrixLines = [];

                this.createMatrix();
                this.backgroundCells = [];
                this.foregroundBlobs = [];

                this.createBackgroundCells();
                this.createForegroundBlobs();
                this.createVignette();
                //--------------------------------
                // Camera
                //--------------------------------

                this.cameraTime = 0;

            }

            createVignette() {

                const g = this.add.graphics();

                g.fillStyle(0x000000, 0.18);

                g.fillRect(0, 0, WIDTH, 80);
                g.fillRect(0, HEIGHT - 80, WIDTH, 80);

                g.fillRect(0, 0, 80, HEIGHT);
                g.fillRect(WIDTH - 80, 0, 80, HEIGHT);

                g.setScrollFactor(0);

            }

            createBackgroundCells() {

                const COUNT = 180;

                for (let i = 0; i < COUNT; i++) {

                    const cell = this.add.circle(

                        Phaser.Math.Between(-200, WIDTH + 200),

                        Phaser.Math.Between(-200, HEIGHT + 200),

                        Phaser.Math.Between(8, 18),

                        0xffb6df,

                        Phaser.Math.FloatBetween(0.03, 0.08)

                    );

                    cell.speed = Phaser.Math.FloatBetween(0.03, 0.08);

                    cell.seed = Math.random() * 1000;

                    cell.baseScale = Phaser.Math.FloatBetween(0.8, 1.3);

                    this.backgroundCells.push(cell);

                }

            }

            createForegroundBlobs() {

                const COUNT = 12;

                for (let i = 0; i < COUNT; i++) {

                    const blob = this.add.circle(

                        Phaser.Math.Between(-300, WIDTH + 300),

                        Phaser.Math.Between(-300, HEIGHT + 300),

                        Phaser.Math.Between(180, 320),

                        0xff88d8,

                        0.025

                    );

                    blob.speed = Phaser.Math.FloatBetween(0.02, 0.05);

                    blob.seed = Math.random() * 1000;

                    this.foregroundBlobs.push(blob);

                }

            }

            createMatrix() {

                const COUNT = 45;

                for (let i = 0; i < COUNT; i++) {

                    const line = {

                        y: Phaser.Math.Between(-100, HEIGHT + 100),

                        amplitude: Phaser.Math.Between(8, 25),

                        frequency: Phaser.Math.FloatBetween(0.002, 0.006),

                        speed: Phaser.Math.FloatBetween(0.0004, 0.0012),

                        thickness: Phaser.Math.FloatBetween(1, 3),

                        alpha: Phaser.Math.FloatBetween(0.04, 0.12),

                        seed: Math.random() * 1000

                    };

                    this.matrixLines.push(line);

                }

            }

            drawMatrix(time) {

                const g = this.matrixGraphics;

                g.clear();

                for (const line of this.matrixLines) {

                    g.lineStyle(

                        line.thickness,

                        0xffc9f8,

                        line.alpha

                    );

                    g.beginPath();

                    for (let x = -50; x <= WIDTH + 50; x += 20) {

                        const y =

                            line.y +

                            Math.sin(

                                x * line.frequency +

                                time * line.speed +

                                line.seed

                            ) * line.amplitude;

                        if (x == -50) {

                            g.moveTo(x, y);

                        } else {

                            g.lineTo(x, y);

                        }

                    }

                    g.strokePath();

                }

            }

            createFluid() {

                const COUNT = 900;

                for (let i = 0; i < COUNT; i++) {

                    const r = Phaser.Math.FloatBetween(1, 4);

                    const colors = [

                        0xffffff,
                        0xfff4b0,
                        0x8ee8ff,
                        0xffc8ef

                    ];

                    const p = this.add.circle(

                        Phaser.Math.Between(-100, WIDTH + 100),
                        Phaser.Math.Between(-100, HEIGHT + 100),

                        r,

                        Phaser.Utils.Array.GetRandom(colors),

                        Phaser.Math.FloatBetween(0.08, 0.35)

                    );

                    //--------------------------------
                    // Store motion data
                    //--------------------------------

                    p.seed = Math.random() * 1000;

                    p.speed = Phaser.Math.FloatBetween(0.15, 0.45);

                    p.flow = Phaser.Math.FloatBetween(0.2, 0.8);

                    p.depthFactor = Phaser.Math.FloatBetween(0.4, 1);

                    p.baseAlpha = p.alpha;

                    this.fluidParticles.push(p);

                }

            }

            createOrganicBlob(x, y, radius, color = 0xff9ad8) {

                const blob = this.add.graphics();

                blob.x = x;
                blob.y = y;

                blob.baseRadius = radius;

                blob.color = color;

                blob.seed = Math.random() * 1000;

                blob.points = [];

                const POINTS = 36;

                for (let i = 0; i < POINTS; i++) {

                    blob.points.push({

                        angle: (Math.PI * 2 / POINTS) * i,

                        offset: Phaser.Math.FloatBetween(-12, 12),

                        speed: Phaser.Math.FloatBetween(0.8, 1.6)

                    });

                }

                this.drawOrganicBlob(blob, 0);

                return blob;

            }
            drawOrganicBlob(blob, time) {

                const g = blob;

                g.clear();

                //--------------------------------
                // Glow
                //--------------------------------

                g.fillStyle(0xff8ad8, 0.02);
                g.fillCircle(0, 0, blob.baseRadius + 80);

                g.fillStyle(0xff8ad8, 0.03);
                g.fillCircle(0, 0, blob.baseRadius + 50);

                g.fillStyle(0xff8ad8, 0.04);
                g.fillCircle(0, 0, blob.baseRadius + 25);

                //--------------------------------
                // Cell Body
                //--------------------------------

                g.fillStyle(blob.color, 0.16);

                g.beginPath();

                blob.points.forEach((p, index) => {

                    const wave =

                        Math.sin(

                            time * 0.001 * p.speed +

                            p.angle * 4 +

                            blob.seed

                        ) * 8;

                    const r =

                        blob.baseRadius +

                        p.offset +

                        wave;

                    const x = Math.cos(p.angle) * r;

                    const y = Math.sin(p.angle) * r;

                    if (index === 0) {

                        g.moveTo(x, y);

                    } else {

                        g.lineTo(x, y);

                    }

                });

                g.closePath();

                g.fillPath();

                //--------------------------------
                // Membrane
                //--------------------------------

                g.lineStyle(

                    2,

                    0xffffff,

                    0.15

                );

                g.strokePath();

                //--------------------------------
                // Nucleus
                //--------------------------------

                g.fillStyle(

                    0x6b29ff,

                    0.55

                );

                g.fillCircle(

                    Math.sin(time * 0.001 + blob.seed) * 8,

                    Math.cos(time * 0.0013 + blob.seed) * 6,

                    blob.baseRadius * 0.22

                );

            }
            createTissue() {

                const COUNT = 28;

                for (let i = 0; i < COUNT; i++) {

                    const x = Phaser.Math.Between(-100, WIDTH + 100);

                    const y = Phaser.Math.Between(-100, HEIGHT + 100);

                    const r = Phaser.Math.Between(90, 220);

                    const blob = this.createOrganicBlob(

                        x,
                        y,
                        r

                    );

                    blob.speed = Phaser.Math.FloatBetween(0.4, 1.2);

                    blob.phase = Math.random() * 1000;

                    this.tissueBlobs.push(blob);

                }

            }

            createMembraneTexture() {

                const g = this.make.graphics({ add: false });

                g.fillStyle(0xffa5dc, 0.18);
                g.lineStyle(2, 0xffffff, 0.18);

                const radius = 140;

                g.beginPath();

                for (let i = 0; i < 32; i++) {

                    const angle = (Math.PI * 2 / 32) * i;

                    const r = radius + Phaser.Math.Between(-8, 8);

                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;

                    if (i === 0)
                        g.moveTo(x + radius + 20, y + radius + 20);
                    else
                        g.lineTo(x + radius + 20, y + radius + 20);

                }

                g.closePath();
                g.fillPath();
                g.strokePath();

                g.generateTexture(

                    "cellMembrane",

                    radius * 2 + 40,

                    radius * 2 + 40

                );

                g.destroy();

            }

            drawGradient() {

                const g = this.bg;

                const cx = WIDTH / 2;
                const cy = HEIGHT / 2;

                const colors = [

                    0x0b0716,
                    0x1b1030,
                    0x31174b,
                    0x58236d,
                    0x873d93

                ];

                let radius = 1200;

                for (let i = 0; i < colors.length; i++) {

                    g.fillStyle(colors[i], 0.25);

                    g.fillCircle(

                        cx,
                        cy,
                        radius

                    );

                    radius -= 180;

                }

            }

            update(time, delta) {

                this.cameraTime += delta * 0.00015;

                const cam = this.cameras.main;

                cam.scrollX = Math.sin(this.cameraTime) * 8;

                cam.scrollY = Math.cos(this.cameraTime * 0.7) * 6;

                cam.setZoom(

                    1 +

                    Math.sin(this.cameraTime * 0.8) * 0.01

                );
                for (const blob of this.tissueBlobs) {

                    this.drawOrganicBlob(blob, time);

                    blob.x +=

                        Math.sin(

                            time * 0.0002 +

                            blob.seed

                        ) * 0.05;

                    blob.y +=

                        Math.cos(

                            time * 0.00018 +

                            blob.seed

                        ) * 0.05;

                } //--------------------------------
                // Fluid Simulation
                //--------------------------------

                for (const p of this.fluidParticles) {

                    //--------------------------------
                    // Main Flow
                    //--------------------------------

                    p.x += p.flow;

                    p.y += Math.sin(

                        p.x * 0.003 +

                        time * 0.0004 +

                        p.seed

                    ) * 0.15;

                    //--------------------------------
                    // Brownian Motion
                    //--------------------------------

                    p.x += Math.sin(

                        time * 0.0015 +

                        p.seed

                    ) * 0.25;

                    p.y += Math.cos(

                        time * 0.0013 +

                        p.seed

                    ) * 0.20;

                    //--------------------------------
                    // Vertical Current
                    //--------------------------------

                    p.y += Math.sin(

                        time * 0.0004 +

                        p.seed

                    ) * 0.12;

                    //--------------------------------
                    // Twinkle
                    //--------------------------------

                    p.alpha =

                        p.baseAlpha +

                        Math.sin(

                            time * 0.002 +

                            p.seed

                        ) * 0.05;

                    //--------------------------------
                    // Wrap
                    //--------------------------------

                    if (p.x > WIDTH + 120) {

                        p.x = -120;

                        p.y = Phaser.Math.Between(

                            -50,

                            HEIGHT + 50

                        );

                    }

                }
                this.drawMatrix(time);

                //------------------------------------
                // Background Cells
                //------------------------------------

                for (const cell of this.backgroundCells) {

                    cell.x += cell.speed;

                    cell.y += Math.sin(

                        time * 0.00025 +

                        cell.seed

                    ) * 0.08;

                    cell.setScale(

                        cell.baseScale +

                        Math.sin(

                            time * 0.001 +

                            cell.seed

                        ) * 0.05

                    );

                    if (cell.x > WIDTH + 220) {

                        cell.x = -220;

                        cell.y = Phaser.Math.Between(-100, HEIGHT + 100);

                    }

                }

                //------------------------------------
                // Foreground Tissue
                //------------------------------------

                for (const blob of this.foregroundBlobs) {

                    blob.x += blob.speed;

                    blob.y += Math.cos(

                        time * 0.0002 +

                        blob.seed

                    ) * 0.05;

                    blob.alpha =

                        0.02 +

                        Math.sin(

                            time * 0.0007 +

                            blob.seed

                        ) * 0.01;

                    if (blob.x > WIDTH + 350) {

                        blob.x = -350;

                        blob.y = Phaser.Math.Between(-150, HEIGHT + 150);

                    }

                }


            }

        }

        new Phaser.Game({

            type: Phaser.AUTO,

            parent: "game",

            width: WIDTH,

            height: HEIGHT,

            backgroundColor: "#0b0716",

            scale: {

                mode: Phaser.Scale.FIT,

                autoCenter: Phaser.Scale.CENTER_BOTH

            },

            render: {

                antialias: true

            },

            scene: [TissueScene]

        });

    </script>

</body>

</html>
