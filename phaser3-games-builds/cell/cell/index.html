<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell Defense: Cancer Awareness</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07111f;
            font-family: Arial, Helvetica, sans-serif
        }

        canvas {
            margin: 0;
            padding: 0;
            display: block;
            inset: env(safe-area-inset-top) env(saf-area-inset-right) env(saf-area-inset-bottom) env(saf-area-inset-left);
        }

        .cd-panel {
            width: 1260px;
            max-height: 930px;
            overflow: auto;
            box-sizing: border-box;
            padding: 26px;
            border-radius: 22px;
            color: #eef7ff;
            background: rgba(8, 22, 42, .96);
            border: 2px solid rgba(125, 211, 252, .55);
            box-shadow: 0 22px 70px rgba(0, 0, 0, .55)
        }

        .cd-panel h1 {
            margin: 0 0 12px;
            font-size: 42px;
            color: #67e8f9
        }

        .cd-panel h2 {
            margin: 0 0 12px;
            font-size: 24px
        }

        .cd-panel p {
            margin: 0 0 16px;
            line-height: 1.45;
            color: #cbd5e1
        }

        .cd-section {
            margin-top: 14px;
            padding: 15px;
            border-radius: 16px;
            background: rgba(15, 35, 62, .7);
            border: 1px solid rgba(148, 163, 184, .35)
        }

        .cd-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 13px
        }

        .cd-field label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #b6c6d9
        }

        .cd-field input,
        .cd-field select {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 11px;
            border-radius: 12px;
            border: 1px solid rgba(125, 211, 252, .45);
            color: #eef7ff;
            font-size: 17px;
            background: rgba(2, 8, 23, .82);
            outline: none
        }

        .cd-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px
        }

        .cd-btn {
            cursor: pointer;
            border: 0;
            border-radius: 14px;
            padding: 13px 19px;
            font-weight: 800;
            font-size: 16px;
            color: #06202e;
            background: linear-gradient(135deg, #67e8f9, #22c55e);
            box-shadow: 0 10px 22px rgba(0, 0, 0, .28)
        }

        .cd-btn.secondary {
            color: #e0f2fe;
            background: rgba(30, 64, 175, .8);
            border: 1px solid rgba(147, 197, 253, .45)
        }

        .cd-error,
        .cd-success {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 14px;
            display: none;
            white-space: pre-line
        }

        .cd-error {
            color: #fecaca;
            background: rgba(127, 29, 29, .65);
            border: 1px solid rgba(248, 113, 113, .55)
        }

        .cd-success {
            color: #bbf7d0;
            background: rgba(20, 83, 45, .62);
            border: 1px solid rgba(74, 222, 128, .52)
        }

        .cd-help {
            margin-top: 8px;
            font-size: 13px;
            color: #94a3b8
        }

        .game-hud {
            width: 1800px;
            height: 118px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            ;
            align-items: center;
            gap: 22px;
            padding: 18px 28px;
            box-sizing: border-box;
            border-radius: 24px;
            background: rgba(255, 255, 255, .82);
            border: 2px solid rgba(192, 132, 252, .34);
            box-shadow: 0 16px 48px rgba(15, 23, 42, .18);
            backdrop-filter: blur(16px);
            pointer-events: none
        }

        .hud-level {
            margin-bottom: 10px;
            font-size: 30px;
            line-height: 1;
            font-weight: 800;
            color: #334155
        }

        .hud-subtitle {
            margin-top: 7px;
            font-size: 14px;
            color: #64748b;
            white-space: nowrap
        }

        .health-row {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .health-bar {
            width: 420px;
            height: 24px;
            border-radius: 999px;
            overflow: hidden;
            background: #e2e8f0;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .08)
        }

        .health-fill {
            width: 100%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #22c55e, #84cc16);
            transition: width 140ms linear, background 140ms linear
        }

        .health-text {
            min-width: 116px;
            font-size: 15px;
            font-weight: 700;
            color: #475569
        }

        .hud-center {
            text-align: center
        }

        .hud-timer {
            font-size: 55px;
            line-height: .95;
            font-weight: 900;
            color: #0f172a
        }

        .hud-timer-label {
            margin-top: 7px;
            font-size: 15px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .hud-right {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: center;
            justify-content: flex-end;
            /* align-self: flex-end !important; */
        }

        .hud-stats,
        .hud-counters {
            display: none;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(248, 250, 252, .78);
            border: 1px solid rgba(148, 163, 184, .24);
            font-size: 16px;
            line-height: 1.42;
            color: #334155;
            box-sizing: border-box;
            min-height: 74px
        }

        .hud-counters {
            text-align: right;
            font-weight: 700
        }

        .hud-kpi {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-weight: 700
        }

        .hud-kpi span:first-child {
            color: #64748b;
            font-weight: 700
        }
    </style>
</head>

<body>
    <div id="game-container"></div>
    <script src="main.js">
    </script>
</body>

</html>
