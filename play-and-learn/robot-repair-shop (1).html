<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Repair Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Courier+Prime:wght@400;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --steel:#3B4A5A;
    --steel-soft:#4C5D70;
    --panel:#E9E4D8;
    --panel-dark:#DCD3B8;
    --panel-line:#C2B9A2;
    --amber:#D69A2D;
    --amber-dark:#B37E1E;
    --rust:#B24A2C;
    --rust-dark:#8C3820;
    --charcoal:#2A2620;
    --muted:#71695A;
    --circuit-green:#4C8C63;
    --font-display:'Chakra Petch', 'Courier New', monospace;
    --font-mono:'Courier Prime', 'Courier New', monospace;
    --font-body:'Public Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0) 0 0/22px 22px,
      var(--steel);
    color:var(--charcoal);
    min-height:100vh;
    padding:24px 16px 48px;
  }
  .wrap{max-width:680px;margin:0 auto;}

  .agency-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 18px; background:var(--steel-soft); border:1px solid rgba(255,255,255,0.08);
    border-radius:10px; margin-bottom:18px;
  }
  .agency-name{font-family:var(--font-display); color:var(--panel); font-size:1.05rem; letter-spacing:0.02em;}
  .agency-name small{display:block; font-family:var(--font-mono); color:var(--amber); font-size:0.62rem; letter-spacing:0.16em; margin-top:2px;}
  .badge{
    width:40px;height:40px; flex-shrink:0; overflow:visible;
    display:flex; align-items:center; justify-content:center;
  }
  .badge svg{display:block;}

  .panel{
    background:var(--panel); border-radius:6px; padding:22px;
    box-shadow:0 12px 28px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(0,0,0,0.05);
    position:relative;
  }
  .panel::before{
    content:""; position:absolute; top:0; left:22px; right:22px; height:14px;
    background:var(--panel-dark); border-radius:0 0 6px 6px; box-shadow:0 1px 0 var(--panel-line);
  }

  .field-label{font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin:0 0 8px;}
  .choice-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .choice-btn{
    flex:1; min-width:120px; padding:12px 10px; border-radius:6px; border:1.5px solid var(--panel-line);
    background:#f7f2e4; color:var(--charcoal); font-family:var(--font-body); font-weight:600; font-size:0.92rem;
    cursor:pointer; transition:transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .choice-btn:hover{border-color:var(--amber);}
  .choice-btn:focus-visible{outline:3px solid var(--rust); outline-offset:2px;}
  .choice-btn.active{background:var(--steel); color:var(--panel); border-color:var(--steel); transform:translateY(-1px);}

  .cta{
    display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:6px; border:none;
    background:var(--rust); color:#fdf3e7; font-family:var(--font-body); font-weight:700; font-size:0.98rem;
    cursor:pointer; letter-spacing:0.01em; transition:transform 0.12s ease, background 0.12s ease; width:100%; justify-content:center;
  }
  .cta:hover{background:var(--rust-dark);}
  .cta:active{transform:scale(0.98);}
  .cta:disabled{background:#b0a48a; cursor:not-allowed;}
  .cta:focus-visible{outline:3px solid var(--steel); outline-offset:2px;}

  /* Comic scene panel */
  .comic-panel{position:relative; border:4px solid var(--steel); border-radius:4px; overflow:hidden; min-height:190px; margin:2px 0 18px; background:var(--panel-dark);}
  .comic-bg{position:absolute; inset:0;}
  .comic-bg svg{width:100%; height:100%; display:block;}
  .comic-caption{
    position:absolute; top:8px; left:8px; z-index:3; background:#FBF3DD; border:2px solid var(--steel);
    padding:5px 10px; font-family:var(--font-mono); font-size:0.68rem; line-height:1.4; max-width:72%; border-radius:2px;
  }
  .comic-cast{position:absolute; inset:0; display:flex; align-items:flex-end; padding:0 16px 10px; z-index:2;}
  .comic-cast.single{justify-content:center;}
  .comic-cast.double{justify-content:space-between;}
  .comic-character{display:flex; flex-direction:column; align-items:center; position:relative; max-width:130px;}
  .comic-character svg{width:88px; height:97px; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.25));}
  .name-tag{font-family:var(--font-mono); font-size:0.6rem; background:var(--steel); color:var(--panel); padding:1px 7px; border-radius:3px; margin-top:-2px; white-space:nowrap;}
  .role-pill{font-family:var(--font-mono); font-size:0.52rem; text-transform:uppercase; letter-spacing:0.06em; color:#fff; padding:1px 7px; border-radius:8px; margin-top:3px;}
  .speech-bubble{position:relative; background:#fff; border:2px solid var(--steel); border-radius:10px; padding:5px 10px; font-family:var(--font-body); font-weight:600; font-size:0.72rem; text-align:center; max-width:150px; margin-bottom:10px;}
  .speech-bubble::before, .speech-bubble::after{content:""; position:absolute; top:100%; left:50%; border-style:solid;}
  .speech-bubble::before{border-width:8px 8px 0 8px; border-color:var(--steel) transparent transparent transparent; transform:translateX(-50%);}
  .speech-bubble::after{border-width:6px 6px 0 6px; border-color:#fff transparent transparent transparent; transform:translateX(-50%) translateY(-2px);}
  @media (max-width:420px){
    .comic-character svg{width:66px; height:73px;}
    .comic-caption{font-size:0.62rem; max-width:80%;}
    .speech-bubble{font-size:0.66rem; max-width:105px; padding:4px 8px;}
  }

  .case-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .case-tab{flex:1; text-align:center; padding:6px 4px; font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.06em; border-radius:4px 4px 0 0; background:var(--panel-dark); color:var(--muted); border-bottom:3px solid var(--panel-line);}
  .case-tab.done{background:var(--circuit-green); color:#fff; border-bottom-color:#345c44;}
  .case-tab.current{background:var(--steel); color:var(--panel); border-bottom-color:var(--amber);}

  .case-number{font-family:var(--font-mono); color:var(--rust); font-size:0.78rem; letter-spacing:0.06em; margin:0 0 6px;}
  .case-title{font-family:var(--font-display); font-size:1.4rem; line-height:1.3; color:var(--charcoal); margin:0 0 12px;}
  .case-intro{font-size:0.95rem; line-height:1.55; color:var(--charcoal); margin:0 0 18px; padding-bottom:16px; border-bottom:1px dashed var(--panel-line);}

  .type-badge{display:inline-flex; align-items:center; gap:6px; background:var(--panel-dark); border:1.5px solid var(--panel-line); padding:4px 10px 4px 6px; border-radius:20px; margin-bottom:14px;}
  .type-badge span{font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--steel-soft); font-weight:700;}

  .clue-question{font-size:1.05rem; font-weight:700; line-height:1.4; margin:0 0 16px;}
  .options-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  @media (max-width:480px){ .options-grid{grid-template-columns:1fr;} }

  .option-btn{text-align:left; padding:13px 14px; border-radius:6px; border:1.5px solid var(--panel-line); background:#f7f2e4; font-family:var(--font-body); font-size:0.93rem; cursor:pointer; transition:border-color 0.12s ease, background 0.12s ease;}
  .option-btn:hover{border-color:var(--amber);}
  .option-btn:focus-visible{outline:3px solid var(--rust); outline-offset:2px;}
  .option-btn.selected{border-color:var(--steel); background:var(--panel-dark); font-weight:700;}
  .option-btn.correct{border-color:var(--circuit-green); background:#e0ebe3; font-weight:700;}
  .option-btn.incorrect{border-color:var(--rust); background:#f3ddd5;}

  .feedback{font-size:0.92rem; line-height:1.5; padding:12px 14px; border-radius:6px; margin-bottom:16px;}
  .feedback.wrong{background:#f3ddd5; color:var(--rust-dark);}
  .feedback.right{background:#e0ebe3; color:#2d4c39;}

  .stamp-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:10;}
  .stamp{font-family:var(--font-display); font-size:1.9rem; color:var(--rust); border:6px solid var(--rust); padding:10px 26px; border-radius:8px; text-transform:uppercase; letter-spacing:0.06em; transform:rotate(-9deg) scale(1.4); opacity:0; animation:stampIn 0.45s ease-out forwards;}
  @keyframes stampIn{0%{opacity:0; transform:rotate(-9deg) scale(2.2);} 60%{opacity:1; transform:rotate(-9deg) scale(0.92);} 100%{opacity:1; transform:rotate(-9deg) scale(1);}}
  @media (prefers-reduced-motion: reduce){ .stamp{animation:none; opacity:1; transform:rotate(-9deg) scale(1);} .choice-btn,.cta,.option-btn{transition:none;} }

  .culprit-card{background:var(--panel-dark); border-radius:6px; padding:16px 18px; margin-bottom:18px; border-left:4px solid var(--circuit-green);}
  .culprit-card h3{font-family:var(--font-display); font-size:1.05rem; margin:0 0 8px; color:#2d4c39;}
  .culprit-card p{margin:0; line-height:1.55; font-size:0.95rem;}

  .loading-row{display:flex; align-items:center; gap:10px; font-family:var(--font-mono); color:var(--muted); font-size:0.85rem; padding:20px 0;}
  .spinner{width:16px;height:16px; border:2.5px solid var(--panel-line); border-top-color:var(--rust); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }

  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .link-btn{background:none; border:none; cursor:pointer; font-family:var(--font-mono); font-size:0.72rem; color:var(--muted); text-decoration:underline; letter-spacing:0.04em; padding:4px;}
  .link-btn:hover{color:var(--rust);}

  .pin-clip{position:absolute; top:-14px; right:28px; filter:drop-shadow(0 3px 2px rgba(0,0,0,0.28)); z-index:2;}

  #confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:80;}
  .confetti-piece{position:absolute; top:-16px; width:8px; height:14px; opacity:0.95; border-radius:1px; animation:confettiFall linear forwards;}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg); opacity:1;} 100%{transform:translateY(70vh) rotate(var(--rot)); opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .confetti-piece{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="agency-header">
    <div class="agency-name">Robot Repair Shop
      <small>Every ticket, a new circuit to crack</small>
    </div>
    <div class="badge" id="mascot"></div>
  </div>
  <div id="app"></div>
</div>
<div id="confetti-layer"></div>

<script>
const state = {
  screen: 'setup', grade: '3-5',
  ticketData: null, puzzleIndex: 0, solved: [false,false,false],
  selectedOption: null, feedback: null, showStamp: false, stampText: '', usedFallback: false
};

const SETTINGS = ['workshop','lab','warehouse','control_room'];
const HUMAN_ROLES = ['mechanic','customer'];
const EXPRESSIONS = ['happy','neutral','surprised','worried','sly'];
const ROBOT_STATUSES = ['broken','sparking','fixed'];
const PUZZLE_TYPES = ['if_then','sequence','pattern'];
const SKIN_TONES = ['#F2C9A0','#C68642','#8D5524','#FFDBAC'];
const HAIR_COLORS = ['#2A2620','#5C3A21','#171412','#7A4B2A'];
const HAIR_STYLES = ['short','pony','curly','bald'];

function isValidHex(c){ return typeof c === 'string' && /^#[0-9A-Fa-f]{6}$/.test(c); }
function humanRoleColor(role){ return {mechanic:'#D69A2D', customer:'#4C8C63'}[role] || '#3B4A5A'; }
function hashStr(s){ let h=0; const str=s||''; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
function shiftHex(hex, amt){
  const num = parseInt(hex.slice(1),16);
  let r=(num>>16)+amt*255, g=((num>>8)&0xff)+amt*255, b=(num&0xff)+amt*255;
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return '#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);
}

function sceneBackground(setting){
  const s = SETTINGS.includes(setting) ? setting : 'workshop';
  const palettes = {
    workshop:{bg:'#D9D2BF', accent:'#5B6B78', accent2:'#8A6A24'},
    lab:{bg:'#BFD2CF', accent:'#3B4A5A', accent2:'#4C8C63'},
    warehouse:{bg:'#D6C9AE', accent:'#8C6A45', accent2:'#5B4A32'},
    control_room:{bg:'#232F3B', accent:'#4C5D70', accent2:'#D69A2D'}
  };
  const p = palettes[s];
  let shapes = '';
  if(s === 'workshop'){
    let tools = '';
    for(let i=0;i<5;i++){ tools += `<rect x="${20+i*56}" y="18" width="8" height="46" rx="3" fill="${p.accent2}"/><circle cx="${24+i*56}" cy="14" r="6" fill="${p.accent}"/>`; }
    shapes = tools + `<rect x="0" y="140" width="320" height="30" fill="${p.accent}"/>`;
  } else if(s === 'lab'){
    let jars = '';
    for(let i=0;i<6;i++){ jars += `<rect x="${16+i*50}" y="30" width="28" height="34" rx="4" fill="${p.accent2}" opacity="0.85"/>`; }
    shapes = jars + `<rect x="0" y="90" width="320" height="14" fill="${p.accent}"/><rect x="0" y="140" width="320" height="30" fill="${p.accent}"/>`;
  } else if(s === 'warehouse'){
    let crates = '';
    for(let row=0; row<2; row++){ for(let col=0; col<6; col++){ crates += `<rect x="${10+col*52}" y="${90-row*46}" width="44" height="42" fill="${(row+col)%2===0?p.accent:p.accent2}"/>`; } }
    shapes = crates;
  } else {
    shapes = `<rect x="30" y="14" width="260" height="90" rx="4" fill="#101820"/>
      <line x1="50" y1="34" x2="270" y2="34" stroke="${p.accent2}" stroke-width="2" opacity="0.6"/>
      <line x1="50" y1="54" x2="220" y2="54" stroke="${p.accent2}" stroke-width="2" opacity="0.4"/>
      <line x1="50" y1="74" x2="250" y2="74" stroke="${p.accent2}" stroke-width="2" opacity="0.4"/>
      <rect x="0" y="130" width="320" height="40" fill="${p.accent}"/>
      <circle cx="40" cy="150" r="6" fill="${p.accent2}"/><circle cx="60" cy="150" r="6" fill="#B24A2C"/><circle cx="80" cy="150" r="6" fill="#4C8C63"/>`;
  }
  return `<svg viewBox="0 0 320 170" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" style="background:${p.bg}">${shapes}</svg>`;
}

function characterFace(expr){
  switch(expr){
    case 'happy': return `<path d="M38 34 Q42 29 46 34" stroke="#2A2620" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M54 34 Q58 29 62 34" stroke="#2A2620" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M38 45 Q50 54 62 45" stroke="#2A2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    case 'surprised': return `<circle cx="42" cy="36" r="3.4" fill="#2A2620"/><circle cx="58" cy="36" r="3.4" fill="#2A2620"/><ellipse cx="50" cy="47" rx="4.5" ry="5.5" fill="#2A2620"/>`;
    case 'worried': return `<line x1="36" y1="30" x2="44" y2="33" stroke="#2A2620" stroke-width="2"/><line x1="64" y1="30" x2="56" y2="33" stroke="#2A2620" stroke-width="2"/><circle cx="42" cy="36" r="2.6" fill="#2A2620"/><circle cx="58" cy="36" r="2.6" fill="#2A2620"/><path d="M40 49 Q50 43 60 49" stroke="#2A2620" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    case 'sly': return `<line x1="38" y1="36" x2="46" y2="36" stroke="#2A2620" stroke-width="2.4" stroke-linecap="round"/><line x1="54" y1="36" x2="62" y2="36" stroke="#2A2620" stroke-width="2.4" stroke-linecap="round"/><path d="M40 47 Q50 51 63 44" stroke="#2A2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    default: return `<circle cx="42" cy="36" r="2.6" fill="#2A2620"/><circle cx="58" cy="36" r="2.6" fill="#2A2620"/><line x1="42" y1="47" x2="58" y2="47" stroke="#2A2620" stroke-width="2.2" stroke-linecap="round"/>`;
  }
}
function characterHair(style, color){
  switch(style){
    case 'pony': return `<path d="M26 32 Q50 6 74 32 L74 22 Q50 0 26 22 Z" fill="${color}"/><circle cx="76" cy="42" r="7" fill="${color}"/>`;
    case 'curly': return `<circle cx="30" cy="24" r="8" fill="${color}"/><circle cx="42" cy="16" r="9" fill="${color}"/><circle cx="58" cy="16" r="9" fill="${color}"/><circle cx="70" cy="24" r="8" fill="${color}"/>`;
    case 'bald': return '';
    default: return `<path d="M26 32 Q50 6 74 32 L74 24 Q50 4 26 24 Z" fill="${color}"/>`;
  }
}
function buildCharacterSVG(c){
  const name = (c && c.name) || '';
  const role = (c && HUMAN_ROLES.includes(c.role)) ? c.role : 'mechanic';
  const expression = (c && EXPRESSIONS.includes(c.expression)) ? c.expression : 'neutral';
  const outfit = (c && isValidHex(c.outfitColor)) ? c.outfitColor : humanRoleColor(role);
  const h = hashStr(name || role);
  const skin = SKIN_TONES[h % SKIN_TONES.length];
  const hairColor = HAIR_COLORS[(h >> 2) % HAIR_COLORS.length];
  const hairStyle = HAIR_STYLES[(h >> 4) % HAIR_STYLES.length];
  return `
    <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 80 Q50 62 80 80 L83 110 L17 110 Z" fill="${outfit}"/>
      <rect x="41" y="56" width="18" height="16" fill="${skin}"/>
      <circle cx="50" cy="38" r="24" fill="${skin}"/>
      ${characterFace(expression)}
      ${characterHair(hairStyle, hairColor)}
      ${role === 'mechanic' ? `<path d="M30 22 a20 8 0 0 1 40 0" fill="none" stroke="#3B4A5A" stroke-width="4"/><circle cx="30" cy="30" r="7" fill="none" stroke="#3B4A5A" stroke-width="3"/><circle cx="70" cy="30" r="7" fill="none" stroke="#3B4A5A" stroke-width="3"/>` : ''}
    </svg>
  `;
}

function robotFace(status){
  if(status === 'fixed'){
    return `<path d="M36 24 Q40 19 44 24" stroke="#233" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M56 24 Q60 19 64 24" stroke="#233" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <rect x="38" y="30" width="24" height="4" rx="2" fill="#233"/>`;
  }
  if(status === 'sparking'){
    return `<circle cx="40" cy="24" r="3" fill="#233"/><circle cx="60" cy="24" r="3" fill="#B24A2C"/>
      <rect x="40" y="30" width="20" height="3" rx="1.5" fill="#233"/>
      <path d="M66 6 l-4 8 l5 0 l-5 9" stroke="#D69A2D" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  return `<line x1="36" y1="22" x2="44" y2="26" stroke="#233" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="44" y1="22" x2="36" y2="26" stroke="#233" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="60" cy="24" r="2.6" fill="#8A8A8A"/>
    <path d="M38 32 Q50 28 62 32" stroke="#233" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
}
function buildRobotSVG(c){
  const status = (c && ROBOT_STATUSES.includes(c.status)) ? c.status : 'broken';
  const body = (c && isValidHex(c.bodyColor)) ? c.bodyColor : '#4C5D70';
  const head = shiftHex(body, 0.18);
  const torso = shiftHex(body, -0.12);
  const coreFill = status === 'fixed' ? '#4C8C63' : status === 'sparking' ? '#B24A2C' : '#8A8A8A';
  const antennaPath = status === 'fixed'
    ? `<line x1="50" y1="6" x2="50" y2="16" stroke="#3B4A5A" stroke-width="3"/><circle cx="50" cy="4" r="3.5" fill="#4C8C63"/>`
    : `<path d="M50 16 L58 4" stroke="#3B4A5A" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="4" r="3.5" fill="${status==='sparking' ? '#D69A2D' : '#8A8A8A'}"/>`;
  const crack = status === 'fixed' ? '' : `<path d="M46 62 L52 70 L47 76 L54 84" stroke="#fff" stroke-width="1.6" fill="none" opacity="0.7"/>`;
  return `
    <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
      ${antennaPath}
      <rect x="30" y="16" width="40" height="34" rx="9" fill="${head}"/>
      ${robotFace(status)}
      <rect x="22" y="52" width="56" height="50" rx="10" fill="${torso}"/>
      <rect x="6" y="58" width="14" height="32" rx="6" fill="${torso}"/>
      <rect x="80" y="58" width="14" height="32" rx="6" fill="${torso}"/>
      <circle cx="50" cy="76" r="11" fill="${coreFill}"/>
      ${crack}
    </svg>
  `;
}

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }

function renderScenePanel(scene){
  if(!scene) return '';
  const setting = scene.setting;
  let chars = Array.isArray(scene.characters) ? scene.characters.slice(0,2) : [];
  if(chars.length === 0){ chars = [{kind:'robot', name:'Robot', status:'broken', bodyColor:'#4C5D70', dialogue:null}]; }
  const castClass = chars.length === 1 ? 'single' : 'double';
  const castHtml = chars.map(c => {
    const isRobot = c.kind === 'robot';
    const label = isRobot ? 'robot' : ((HUMAN_ROLES.includes(c.role)) ? c.role : 'mechanic');
    const pillColor = isRobot ? '#4C5D70' : humanRoleColor(label);
    const bubble = c.dialogue ? `<div class="speech-bubble">${escapeHtml(c.dialogue)}</div>` : '';
    return `
      <div class="comic-character">
        ${bubble}
        ${isRobot ? buildRobotSVG(c) : buildCharacterSVG(c)}
        <div class="name-tag">${escapeHtml(c.name || label)}</div>
        <div class="role-pill" style="background:${pillColor}">${escapeHtml(label)}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="comic-panel">
      <div class="comic-bg">${sceneBackground(setting)}</div>
      ${scene.caption ? `<div class="comic-caption">${escapeHtml(scene.caption)}</div>` : ''}
      <div class="comic-cast ${castClass}">${castHtml}</div>
    </div>
  `;
}

function mascotFace(mood){
  if(mood === 'happy'){
    return `<path d="M16 25 Q20 20 24 25" stroke="#2A2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M32 25 Q36 20 40 25" stroke="#2A2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M18 34 Q28 44 38 34" stroke="#2A2620" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }
  if(mood === 'thinking'){
    return `<circle cx="20" cy="27" r="2.4" fill="#2A2620"/><circle cx="36" cy="25" r="2.4" fill="#2A2620"/>
      <path d="M22 37 Q28 34.5 34 38" stroke="#2A2620" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }
  return `<circle cx="20" cy="26" r="2.6" fill="#2A2620"/><circle cx="36" cy="26" r="2.6" fill="#2A2620"/>
    <path d="M20 36 Q28 39 36 36" stroke="#2A2620" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
}
function gearMascotSVG(mood){
  let teeth = '';
  for(let i=0;i<8;i++){ teeth += `<rect x="23" y="2" width="10" height="9" rx="2" fill="#B37E1E" transform="rotate(${i*45} 28 26)"/>`; }
  return `<svg viewBox="0 0 58 48" width="34" height="34" xmlns="http://www.w3.org/2000/svg">
      ${teeth}
      <circle cx="28" cy="26" r="17" fill="#D69A2D"/>
      <circle cx="28" cy="26" r="13" fill="#E9E4D8"/>
      ${mascotFace(mood)}
    </svg>`;
}
function setMascotMood(mood){ const el = document.getElementById('mascot'); if(el) el.innerHTML = gearMascotSVG(mood); }

function burstConfetti(count){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = document.getElementById('confetti-layer');
  if(!layer) return;
  const colors = ['#B24A2C','#D69A2D','#4C8C63','#3B4A5A','#F4E9CE'];
  for(let i=0;i<count;i++){
    const piece = document.createElement('span');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + '%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (0.9 + Math.random()*0.7) + 's';
    piece.style.animationDelay = (Math.random()*0.2) + 's';
    piece.style.setProperty('--rot', (Math.random()*360) + 'deg');
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 2200);
  }
}

const typeBadges = {
  if_then: `<svg viewBox="0 0 40 20" width="34" height="17"><rect x="0" y="3" width="14" height="14" rx="3" fill="#D69A2D"/><path d="M16 10 L24 10" stroke="#5B6B78" stroke-width="2"/><path d="M21 6 L25 10 L21 14" stroke="#5B6B78" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="3" width="14" height="14" rx="3" fill="#4C8C63"/></svg><span>IF / THEN</span>`,
  sequence: `<svg viewBox="0 0 44 18" width="36" height="15"><circle cx="6" cy="9" r="6" fill="#D69A2D"/><text x="6" y="12.5" font-size="8" text-anchor="middle" fill="#2A2620" font-family="Courier Prime">1</text><circle cx="22" cy="9" r="6" fill="#4C8C63"/><text x="22" y="12.5" font-size="8" text-anchor="middle" fill="#fff" font-family="Courier Prime">2</text><circle cx="38" cy="9" r="6" fill="#B24A2C"/><text x="38" y="12.5" font-size="8" text-anchor="middle" fill="#fff" font-family="Courier Prime">3</text></svg><span>SEQUENCE</span>`,
  pattern: `<svg viewBox="0 0 44 18" width="36" height="15"><rect x="0" y="3" width="12" height="12" fill="#D69A2D"/><rect x="16" y="3" width="12" height="12" fill="#4C8C63"/><rect x="32" y="3" width="12" height="12" fill="none" stroke="#5B6B78" stroke-width="2" stroke-dasharray="2,2"/></svg><span>PATTERN</span>`
};

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'setup') app.innerHTML = renderSetup();
  else if(state.screen === 'loading') app.innerHTML = renderLoading();
  else app.innerHTML = renderTicket();
}

function renderSetup(){
  return `
    <div class="panel">
      <p class="field-label">Grade band</p>
      <div class="choice-row">
        <button class="choice-btn ${state.grade==='3-5'?'active':''}" onclick="setGrade('3-5')">Grade 3–5</button>
        <button class="choice-btn ${state.grade==='6-8'?'active':''}" onclick="setGrade('6-8')">Grade 6–8</button>
      </div>
      <button class="cta" onclick="openTicket()">Pick Up a Repair Ticket</button>
    </div>
  `;
}
function renderLoading(){
  return `<div class="panel"><div class="loading-row"><span class="spinner"></span><span>Pulling up a new repair ticket…</span></div></div>`;
}

function renderTicket(){
  const t = state.ticketData;
  if(!t) return renderSetup();

  const tabs = [0,1,2].map(i => {
    let cls = 'case-tab';
    if(state.solved[i]) cls += ' done';
    else if(i === state.puzzleIndex && state.screen==='playing') cls += ' current';
    const label = state.solved[i] ? '✓ FIX ' + (i+1) : 'FIX ' + (i+1);
    return `<div class="${cls}">${label}</div>`;
  }).join('') + `<div class="case-tab ${state.screen==='closed'?'done':''}">DONE</div>`;

  let sceneHtml = '';
  let body = '';

  if(state.screen === 'closed'){
    sceneHtml = renderScenePanel(t.fixedScene);
    body = `
      <div class="culprit-card">
        <h3>⚙️ Repair Complete</h3>
        <p>${escapeHtml(t.fixedReveal)}</p>
      </div>
      <button class="cta" onclick="resetToSetup()">Pick Up Another Ticket</button>
    `;
  } else {
    const puzzle = t.puzzles[state.puzzleIndex];
    if(state.puzzleIndex === 0) sceneHtml += renderScenePanel(t.introScene);
    sceneHtml += renderScenePanel(puzzle.scene);

    const optionsHtml = puzzle.options.map((opt, i) => {
      let cls = 'option-btn';
      if(state.feedback){
        if(i === puzzle.correctIndex) cls += ' correct';
        else if(i === state.selectedOption) cls += ' incorrect';
      } else if(i === state.selectedOption){ cls += ' selected'; }
      return `<button class="${cls}" onclick="selectOption(${i})" ${state.feedback?'disabled':''}>${escapeHtml(opt)}</button>`;
    }).join('');

    let feedbackHtml = state.feedback ? `<div class="feedback ${state.feedback.type}">${escapeHtml(state.feedback.text)}</div>` : '';

    let actionHtml = '';
    if(!state.feedback){
      actionHtml = `<button class="cta" ${state.selectedOption===null?'disabled':''} onclick="submitAnswer()">Try This Fix</button>`;
    } else if(state.feedback.type === 'wrong'){
      actionHtml = `<button class="cta" onclick="retryClue()">Try Again</button>`;
    } else {
      const isLast = state.puzzleIndex === 2;
      actionHtml = `<button class="cta" onclick="${isLast ? 'closeCase()' : 'nextClue()'}">${isLast ? 'Power On the Robot' : 'Next Repair Step'}</button>`;
    }

    const type = PUZZLE_TYPES.includes(puzzle.type) ? puzzle.type : 'if_then';

    body = `
      <div class="type-badge">${typeBadges[type]}</div>
      <p class="clue-question">${escapeHtml(puzzle.prompt)}</p>
      <div class="options-grid">${optionsHtml}</div>
      ${feedbackHtml}
      ${actionHtml}
    `;
  }

  return `
    <div class="top-row">
      <button class="link-btn" onclick="resetToSetup()">&larr; New setup</button>
      ${state.usedFallback ? '<span class="link-btn" style="text-decoration:none;">offline sample ticket</span>' : ''}
    </div>
    ${sceneHtml}
    <div class="panel" style="position:relative;">
      <svg class="pin-clip" viewBox="0 0 24 48" width="18" height="36" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6 v26 a6 6 0 0 0 12 0 v-22 a3 3 0 0 0-6 0 v18" fill="none" stroke="#D69A2D" stroke-width="3" stroke-linecap="round"/>
      </svg>
      ${state.showStamp ? `<div class="stamp-overlay"><div class="stamp">${state.stampText}</div></div>` : ''}
      <div class="case-tabs">${tabs}</div>
      <p class="case-number">TICKET #${escapeHtml(t.ticketNumber)}</p>
      <h2 class="case-title">${escapeHtml(t.title)}</h2>
      ${t.introText ? `<p class="case-intro">${escapeHtml(t.introText)}</p>` : ''}
      ${body}
    </div>
  `;
}

function setGrade(g){ state.grade = g; render(); }

function resetToSetup(){
  state.screen = 'setup'; state.ticketData = null; state.puzzleIndex = 0;
  state.solved = [false,false,false]; state.selectedOption = null; state.feedback = null; state.showStamp = false;
  setMascotMood('neutral'); render();
}
function selectOption(i){ if(state.feedback) return; state.selectedOption = i; render(); }

function submitAnswer(){
  const puzzle = state.ticketData.puzzles[state.puzzleIndex];
  const correct = state.selectedOption === puzzle.correctIndex;
  if(correct){
    state.feedback = {type:'right', text: '✅ Correct! ' + puzzle.explanation};
    state.solved[state.puzzleIndex] = true;
    setMascotMood('happy');
    triggerStamp('FIXED');
    burstConfetti(14);
  } else {
    state.feedback = {type:'wrong', text: '❌ Not quite. ' + puzzle.explanation};
    setMascotMood('thinking');
  }
  render();
}
function retryClue(){ state.selectedOption = null; state.feedback = null; render(); }
function nextClue(){ state.puzzleIndex += 1; state.selectedOption = null; state.feedback = null; setMascotMood('neutral'); render(); }
function closeCase(){
  state.screen = 'closed'; state.selectedOption = null; state.feedback = null;
  setMascotMood('happy'); triggerStamp('POWERED ON'); burstConfetti(40); render();
}
function triggerStamp(text){
  state.stampText = text; state.showStamp = true; render();
  setTimeout(() => { state.showStamp = false; render(); }, 1300);
}

async function openTicket(){
  state.screen = 'loading'; state.usedFallback = false; setMascotMood('thinking'); render();
  try{
    const data = await generateTicketFromAI(state.grade);
    state.ticketData = data;
  } catch(err){
    console.error('AI generation failed, using fallback ticket:', err);
    state.ticketData = getFallbackTicket(state.grade);
    state.usedFallback = true;
  }
  state.puzzleIndex = 0; state.solved = [false,false,false]; state.selectedOption = null; state.feedback = null;
  state.screen = 'playing'; setMascotMood('neutral'); render();
}

function sceneSchemaBlock(){
  return `{
      "setting": "one of: ${SETTINGS.join(', ')}",
      "caption": "one short narrator sentence (under 14 words)",
      "characters": [
        {
          "kind": "human or robot",
          "name": "short name",
          "role": "if kind is human, one of: ${HUMAN_ROLES.join(', ')} (omit if robot)",
          "status": "if kind is robot, one of: ${ROBOT_STATUSES.join(', ')} (omit if human)",
          "expression": "if kind is human, one of: ${EXPRESSIONS.join(', ')} (omit if robot)",
          "outfitColor": "if kind is human, a hex color (omit if robot)",
          "bodyColor": "if kind is robot, a hex color (omit if human)",
          "dialogue": "one short line under 10 words, or null"
        }
      ]
    }`;
}

async function generateTicketFromAI(grade){
  const gradeDesc = grade === '3-5'
    ? 'grade 3-5 (ages 8-10): keep logic simple and concrete, short if-then statements, 3-step sequences, and simple numeric or shape patterns; playful, encouraging tone'
    : 'grade 6-8 (ages 11-14): if-then can involve two conditions, sequences can have 4 steps, patterns can involve multiplication or simple arithmetic rules; slightly wittier tone';

  const schema = `{
  "ticketNumber": "a 4-digit number as a string",
  "robotName": "a fun robot name",
  "title": "a short, fun repair job title (kid-safe, no violence)",
  "introText": "2-3 sentences explaining what's wrong with the robot and who dropped it off",
  "introScene": ${sceneSchemaBlock()},
  "puzzles": [
    {
      "type": "if_then",
      "prompt": "an if-then logic puzzle appropriate for ${grade}, phrased like: IF [condition], THEN the robot should ___",
      "options": ["option A", "option B", "option C", "option D"],
      "correctIndex": 0,
      "explanation": "one short friendly sentence explaining the right answer",
      "scene": ${sceneSchemaBlock()}
    },
    {
      "type": "sequence",
      "prompt": "a short sequencing puzzle asking which order of 3-4 steps correctly repairs or restarts a robot function",
      "options": ["step order A written as 'Step -> Step -> Step'", "step order B", "step order C", "step order D"],
      "correctIndex": 0,
      "explanation": "one short friendly sentence explaining why that order is correct",
      "scene": ${sceneSchemaBlock()}
    },
    {
      "type": "pattern",
      "prompt": "a short number or shape pattern puzzle asking what comes next",
      "options": ["option A", "option B", "option C", "option D"],
      "correctIndex": 0,
      "explanation": "one short friendly sentence explaining the pattern rule",
      "scene": ${sceneSchemaBlock()}
    }
  ],
  "fixedScene": ${sceneSchemaBlock()},
  "fixedReveal": "2-3 sentences of a happy, satisfying wrap-up where the robot is fixed and thanks the kid"
}`;

  const prompt = `Create ONE kid-safe "robot repair shop" mini-game ticket for an educational comic-style app.
Audience: ${gradeDesc}.
There must be exactly 3 puzzles in this exact order and type: an "if_then" logic puzzle, a "sequence" ordering puzzle, and a "pattern" puzzle — each with exactly 4 multiple-choice options and one correct index (0-3).
Keep the story light and silly (a robot that won't stop beeping, a robot with hiccups, a robot stuck doing the wrong chore) — never scary or violent.
Every scene (introScene, each puzzle's scene, fixedScene) needs 1-2 characters, at least one of which should be the broken/sparking/fixed robot itself in most scenes. Settings must come from the allowed list. Keep any "dialogue" under 10 words, or null.
Respond with ONLY valid JSON, no markdown code fences, no commentary before or after, matching exactly this shape:
${schema}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1800,
      messages: [{ role: "user", content: prompt }]
    })
  });
  if(!response.ok) throw new Error('API request failed with status ' + response.status);
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if(!textBlock) throw new Error('No text content in API response');
  let clean = textBlock.text.trim();
  clean = clean.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(clean);
  if(!parsed.puzzles || parsed.puzzles.length !== 3) throw new Error('Malformed puzzle set');
  parsed.puzzles.forEach(p => {
    if(!Array.isArray(p.options) || p.options.length !== 4) throw new Error('Malformed options');
    if(typeof p.correctIndex !== 'number') throw new Error('Malformed correctIndex');
  });
  return parsed;
}

        {type:'pattern', prompt:"Torque's charge cycle follows 3, 6, 12, ___. What comes next?", options:["18","20","24","15"], correctIndex:2, explanation:"Each number doubles the one before it, so 12 x 2 = 24.", scene:{setting:'warehouse', caption:'Spare battery packs are stacked in rows.', characters:[{kind:'human', name:'You', role:'mechanic', expression:'sly', outfitColor:'#D69A2D', dialogue:null}]}}

setMascotMood('neutral');
render();
